<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>我的小小娃娃机 ♡</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

body{
    min-height:100vh;
    font-family:
        "Arial Rounded MT Bold",
        "Microsoft YaHei",
        sans-serif;

    background:
        radial-gradient(circle at 20% 15%, #fff7fc 0 10%, transparent 28%),
        radial-gradient(circle at 85% 80%, #e8e1ff 0 8%, transparent 28%),
        linear-gradient(135deg,#fff1f8,#f3edff 55%,#eaf7ff);

    color:#655879;
    display:flex;
    justify-content:center;
    padding:24px 12px 45px;
}

.page{
    width:100%;
    max-width:620px;
}

/* =========================
   标题
========================= */

.header{
    text-align:center;
    margin-bottom:18px;
}

.header h1{
    font-size:27px;
    color:#8b69b8;
    letter-spacing:1px;
    text-shadow:0 3px 0 #fff;
}

.header p{
    margin-top:7px;
    color:#a88fba;
    font-size:13px;
}

/* =========================
   娃娃机
========================= */

.machine{
    position:relative;
    width:100%;
    height:560px;

    overflow:hidden;

    border:5px solid #dca9e8;
    border-radius:30px;

    background:
        linear-gradient(
            to bottom,
            #dff5ff 0%,
            #eef9ff 54%,
            #fff4fb 54%,
            #fff0f8 100%
        );

    box-shadow:
        0 15px 35px rgba(157,118,183,.18),
        inset 0 0 0 3px rgba(255,255,255,.65);
}

/* 顶部装饰 */

.machine-title{
    position:absolute;
    left:50%;
    top:13px;
    transform:translateX(-50%);

    z-index:8;

    white-space:nowrap;

    font-size:12px;
    font-weight:bold;
    letter-spacing:2px;

    color:#9972b8;

    background:rgba(255,255,255,.78);
    padding:6px 15px;
    border-radius:20px;

    box-shadow:0 3px 8px rgba(150,120,170,.1);
}

/* =========================
   横轨
========================= */

.rail{
    position:absolute;

    left:34px;
    right:34px;
    top:75px;

    height:8px;

    background:
        linear-gradient(
            to bottom,
            #b989d0,
            #9f70bd
        );

    border-radius:10px;

    box-shadow:
        0 3px 0 #875ba5,
        0 5px 10px rgba(116,79,143,.16);

    z-index:5;
}

.rail::before,
.rail::after{
    content:"";

    position:absolute;
    top:50%;
    transform:translateY(-50%);

    width:14px;
    height:14px;

    background:#b988d0;
    border-radius:50%;

    box-shadow:
        inset 0 2px 2px rgba(255,255,255,.6);
}

.rail::before{
    left:-5px;
}

.rail::after{
    right:-5px;
}

/* =========================
   整个滑块
========================= */

.crane{
    position:absolute;

    left:50%;
    top:78px;

    width:62px;
    height:280px;

    transform:translateX(-50%);

    transition:left .25s ease;

    z-index:7;

    pointer-events:none;
}

/* 紫色滑块 */

.crane-head{
    position:absolute;

    left:50%;
    top:-3px;

    transform:translateX(-50%);

    width:38px;
    height:27px;

    background:
        linear-gradient(
            to bottom,
            #c89ce0,
            #a975c5
        );

    border-radius:8px 8px 11px 11px;

    border:2px solid #9865b5;

    box-shadow:
        0 4px 0 #8755a5,
        0 5px 8px rgba(120,82,145,.16);

    z-index:10;
}

.crane-head::before{
    content:"";

    position:absolute;

    left:7px;
    right:7px;
    top:5px;

    height:5px;

    border-radius:5px;

    background:rgba(255,255,255,.48);
}

/* =========================
   固定绳索
========================= */

.cable{
    position:absolute;

    left:50%;
    top:24px;

    transform:translateX(-50%);

    width:4px;
    height:125px;

    background:
        linear-gradient(
            to right,
            #8d7a9b,
            #c0afc9,
            #8d7a9b
        );

    border-radius:5px;

    box-shadow:
        1px 0 2px rgba(80,60,90,.12);

    z-index:8;
}

/* 绳子顶部的小连接 */

.cable::before{
    content:"";

    position:absolute;

    left:50%;
    top:-2px;

    transform:translateX(-50%);

    width:9px;
    height:7px;

    background:#846493;
    border-radius:4px;
}

/* =========================
   爪子固定连接点
========================= */

.claw-anchor{
    position:absolute;

    left:50%;
    top:143px;

    width:92px;
    height:112px;

    transform:translateX(-50%);

    z-index:9;

    transition:none;
}

/* 连接脖子 */

.claw-neck{
    position:absolute;

    left:50%;
    top:0;

    transform:translateX(-50%);

    width:7px;
    height:18px;

    background:#8c7697;

    border-radius:4px;
}

/* =========================
   爪子本体
========================= */

.claw-body{
    position:absolute;

    left:50%;
    top:12px;

    width:92px;
    height:100px;

    transform:
        translateX(-50%)
        translateY(0);

    transform-origin:center top;

    transition:
        transform .48s cubic-bezier(.2,.8,.2,1);

    /* 这里绝对不使用 scale */
}

/* 抓取时：
   只有整个爪子下降
   绳索和滑块完全不动 */

.claw-anchor.grabbing .claw-body{
    transform:
        translateX(-50%)
        translateY(65px);
}

/* =========================
   爪子 SVG
========================= */

.claw-svg{
    width:92px;
    height:100px;

    overflow:visible;

    filter:
        drop-shadow(0 3px 2px rgba(88,65,100,.15));
}

/* 中间圆轴 */

.claw-core{
    fill:#a47ab7;
    stroke:#79568b;
    stroke-width:2;
}

.claw-core-highlight{
    fill:rgba(255,255,255,.48);
}

/* 两侧爪臂 */

.claw-arm{
    fill:none;

    stroke:#80678d;
    stroke-width:8;

    stroke-linecap:round;
    stroke-linejoin:round;

    transition:
        transform .38s cubic-bezier(.2,.8,.2,1);
}

/* 爪尖 */

.claw-tip{
    fill:none;

    stroke:#80678d;
    stroke-width:8;

    stroke-linecap:round;
    stroke-linejoin:round;

    transition:
        transform .38s cubic-bezier(.2,.8,.2,1);
}

/*
   默认：张开
*/

.left-group{
    transform-origin:46px 20px;
    transform:rotate(-3deg);
}

.right-group{
    transform-origin:46px 20px;
    transform:rotate(3deg);
}

/*
   抓取：闭合
*/

.claw-anchor.closed .left-group{
    transform:
        rotate(13deg);
}

.claw-anchor.closed .right-group{
    transform:
        rotate(-13deg);
}

/* =========================
   地面
========================= */

.floor{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:145px;

    background:
        linear-gradient(
            to bottom,
            rgba(255,255,255,0),
            rgba(255,224,241,.65)
        );

    pointer-events:none;
}

/* 地面装饰 */

.floor::before{
    content:"";

    position:absolute;

    left:50%;
    bottom:38px;

    transform:translateX(-50%);

    width:150px;
    height:14px;

    background:rgba(203,165,211,.12);

    border-radius:50%;
}

/* =========================
   出口
========================= */

.exit{
    position:absolute;

    left:50%;
    bottom:18px;

    transform:translateX(-50%);

    width:145px;
    height:42px;

    border-radius:0 0 24px 24px;

    background:
        linear-gradient(
            to bottom,
            #cfa7da,
            #ad7cc3
        );

    border:3px solid #9c69b2;

    box-shadow:
        inset 0 4px 6px rgba(80,50,100,.16),
        0 4px 0 rgba(123,80,142,.18);

    display:flex;
    justify-content:center;
    align-items:flex-end;

    padding-bottom:5px;

    color:#fff;

    font-size:11px;
    font-weight:bold;
    letter-spacing:2px;

    z-index:5;
}

.exit::before{
    content:"";

    position:absolute;

    top:7px;

    width:70px;
    height:13px;

    background:#705477;

    border-radius:20px;

    opacity:.55;
}

/* =========================
   装饰小星星
========================= */

.star{
    position:absolute;

    color:#fff;

    font-size:18px;

    opacity:.8;

    text-shadow:
        0 2px 5px rgba(155,115,180,.3);

    animation:floatStar 3s ease-in-out infinite;
}

.star.s1{
    left:25px;
    top:115px;
}

.star.s2{
    right:25px;
    top:155px;
    animation-delay:.7s;
}

.star.s3{
    left:52px;
    top:270px;
    font-size:13px;
    animation-delay:1.2s;
}

.star.s4{
    right:46px;
    top:300px;
    font-size:13px;
    animation-delay:1.8s;
}

@keyframes floatStar{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-5px);
    }
}

/* =========================
   图片展示区
========================= */

.prizes{
    position:absolute;

    left:28px;
    right:28px;

    top:220px;
    bottom:75px;

    display:flex;
    justify-content:center;
    align-items:flex-end;

    gap:18px;

    z-index:3;

    pointer-events:none;
}

.prize{
    max-width:125px;
    max-height:150px;

    width:auto;
    height:auto;

    object-fit:contain;

    filter:
        drop-shadow(0 7px 8px rgba(117,88,125,.16));

    animation:
        prizeFloat 3s ease-in-out infinite;
}

.prize:nth-child(2){
    animation-delay:.6s;
}

@keyframes prizeFloat{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-4px);
    }
}

/* =========================
   控制区
========================= */

.controls{
    margin-top:16px;

    display:flex;
    justify-content:center;
    align-items:center;

    gap:12px;
}

.control-btn{
    width:58px;
    height:48px;

    border:none;
    border-radius:17px;

    background:
        linear-gradient(
            145deg,
            #e7c8f1,
            #c99add
        );

    color:#735080;

    font-size:22px;
    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 5px 0 #a978b7,
        0 8px 15px rgba(132,92,151,.16);

    transition:
        transform .12s,
        box-shadow .12s;
}

.control-btn:active{
    transform:translateY(4px);

    box-shadow:
        0 1px 0 #a978b7;
}

.grab-btn{
    min-width:150px;
    height:54px;

    border:none;
    border-radius:20px;

    background:
        linear-gradient(
            145deg,
            #d9b4ed,
            #b889d2
        );

    color:white;

    font-size:15px;
    font-weight:bold;

    letter-spacing:1px;

    cursor:pointer;

    box-shadow:
        0 6px 0 #9c69b5,
        0 10px 18px rgba(130,91,149,.2);

    transition:
        transform .12s,
        box-shadow .12s;
}

.grab-btn:active{
    transform:translateY(5px);

    box-shadow:
        0 1px 0 #9c69b5;
}

.grab-btn:disabled{
    opacity:.55;
    cursor:not-allowed;
}

/* =========================
   上传区域
========================= */

.upload-box{
    margin-top:18px;

    padding:17px;

    background:rgba(255,255,255,.75);

    border:
        2px dashed #d4b3df;

    border-radius:22px;

    text-align:center;

    box-shadow:
        0 8px 20px rgba(150,120,170,.08);
}

.upload-title{
    color:#9674aa;

    font-size:14px;
    font-weight:bold;

    margin-bottom:10px;
}

.upload-label{
    display:inline-flex;

    align-items:center;
    justify-content:center;

    padding:10px 18px;

    border-radius:15px;

    background:#ead7f2;

    color:#765682;

    font-size:13px;
    font-weight:bold;

    cursor:pointer;
}

.upload-label:active{
    transform:scale(.97);
}

#fileInput{
    display:none;
}

.upload-hint{
    margin-top:8px;

    color:#b39bbd;

    font-size:11px;
}

/* =========================
   小功能按钮
========================= */

.extra-buttons{
    display:flex;
    justify-content:center;
    gap:10px;

    margin-top:10px;
}

.small-btn{
    border:none;

    padding:7px 13px;

    border-radius:12px;

    background:rgba(255,255,255,.78);

    color:#987aa7;

    cursor:pointer;

    font-size:11px;
}

/* =========================
   成功弹窗
========================= */

.modal{
    position:fixed;

    inset:0;

    background:rgba(77,53,88,.38);

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

    z-index:100;

    opacity:0;
    pointer-events:none;

    transition:opacity .25s;
}

.modal.show{
    opacity:1;
    pointer-events:auto;
}

.modal-box{
    width:min(360px,100%);

    background:#fff8fd;

    border:4px solid #e2b9ec;

    border-radius:28px;

    padding:25px 20px 22px;

    text-align:center;

    box-shadow:
        0 18px 45px rgba(85,57,95,.25);

    transform:translateY(20px) scale(.96);

    transition:transform .25s;
}

.modal.show .modal-box{
    transform:translateY(0) scale(1);
}

.success-icon{
    font-size:42px;

    margin-bottom:4px;
}

.modal-title{
    color:#9367ad;

    font-size:22px;
    font-weight:bold;
}

.modal-text{
    margin-top:6px;

    color:#ad91b7;

    font-size:13px;
}

.caught-image{
    max-width:180px;
    max-height:180px;

    margin:15px auto;

    object-fit:contain;

    display:block;

    border-radius:12px;

    filter:
        drop-shadow(0 8px 12px rgba(120,90,130,.15));
}

.close-modal{
    border:none;

    padding:10px 27px;

    border-radius:15px;

    background:#c99bdc;

    color:#fff;

    font-weight:bold;

    cursor:pointer;
}

/* =========================
   手机适配
========================= */

@media(max-width:480px){

    body{
        padding:15px 9px 35px;
    }

    .header h1{
        font-size:24px;
    }

    .machine{
        height:560px;
        border-radius:27px;
    }

    .rail{
        left:27px;
        right:27px;
    }

    .prizes{
        left:18px;
        right:18px;
    }

    .prize{
        max-width:110px;
        max-height:135px;
    }

    .controls{
        gap:8px;
    }

    .control-btn{
        width:52px;
    }

    .grab-btn{
        min-width:135px;
        font-size:14px;
    }
}
</style>
</head>

<body>

<div class="page">

    <!-- 标题 -->
    <div class="header">
        <h1>🧸 我的小小娃娃机 ♡</h1>
        <p>上传你喜欢的图片，开始抓取吧 ✦</p>
    </div>


    <!-- 娃娃机 -->
    <div class="machine">

        <div class="machine-title">
            ✦ MY CLAW MACHINE ✦
        </div>


        <!-- 横轨 -->
        <div class="rail"></div>


        <!-- 装饰 -->
        <div class="star s1">✦</div>
        <div class="star s2">♡</div>
        <div class="star s3">✧</div>
        <div class="star s4">✦</div>


        <!-- 娃娃 -->
        <div class="prizes" id="prizes"></div>


        <!-- =========================
             爪子整个滑块
        ========================== -->

        <div class="crane" id="crane">

            <!-- 紫色滑块 -->
            <div class="crane-head"></div>

            <!-- 固定绳索 -->
            <div class="cable"></div>

            <!-- 爪子 -->
            <div class="claw-anchor" id="clawAnchor">

                <div class="claw-neck"></div>

                <div class="claw-body">

                    <!--
                        SVG 的好处：
                        两边爪臂是一整条连续线，
                        不会再出现“爪尖和爪臂断开”的情况。
                    -->
                    <svg
                        class="claw-svg"
                        viewBox="0 0 92 100"
                        xmlns="http://www.w3.org/2000/svg"
                    >

                        <!-- 左爪 -->
                        <g class="left-group">

                            <path
                                class="claw-arm"
                                d="
                                    M46 20
                                    C39 25 32 33 28 42
                                    L21 64
                                    L14 78
                                "
                            />

                            <path
                                class="claw-tip"
                                d="
                                    M14 78
                                    L6 75
                                "
                            />

                        </g>


                        <!-- 右爪 -->
                        <g class="right-group">

                            <path
                                class="claw-arm"
                                d="
                                    M46 20
                                    C53 25 60 33 64 42
                                    L71 64
                                    L78 78
                                "
                            />

                            <path
                                class="claw-tip"
                                d="
                                    M78 78
                                    L86 75
                                "
                            />

                        </g>


                        <!-- 中间连接圆 -->
                        <circle
                            class="claw-core"
                            cx="46"
                            cy="20"
                            r="11"
                        />

                        <circle
                            class="claw-core-highlight"
                            cx="42"
                            cy="16"
                            r="3"
                        />

                    </svg>

                </div>

            </div>

        </div>


        <!-- 地面 -->
        <div class="floor"></div>


        <!-- 出口 -->
        <div class="exit">
            PRIZE EXIT
        </div>

    </div>


    <!-- =========================
         操作按钮
    ========================== -->

    <div class="controls">

        <button
            class="control-btn"
            id="leftBtn"
            type="button"
        >
            ◀
        </button>

        <button
            class="grab-btn"
            id="grabBtn"
            type="button"
        >
            ✦ 抓取 ✦
        </button>

        <button
            class="control-btn"
            id="rightBtn"
            type="button"
        >
            ▶
        </button>

    </div>


    <!-- =========================
         上传
    ========================== -->

    <div class="upload-box">

        <div class="upload-title">
            ♡ 上传你的娃娃 ♡
        </div>

        <label
            class="upload-label"
            for="fileInput"
        >
            ＋ 选择图片
        </label>

        <input
            id="fileInput"
            type="file"
            accept="image/png,image/jpeg,image/webp"
            multiple
        >

        <div class="upload-hint">
            可以一次选择多张图片，每次抓取会随机抓取一张
        </div>

        <div class="extra-buttons">

            <button
                class="small-btn"
                id="randomBtn"
                type="button"
            >
                🎲 随机摆放
            </button>

            <button
                class="small-btn"
                id="clearBtn"
                type="button"
            >
                🗑 清空
            </button>

        </div>

    </div>

</div>


<!-- =========================
     抓取成功弹窗
========================= -->

<div
    class="modal"
    id="modal"
>

    <div class="modal-box">

        <div class="success-icon">
            🎉
        </div>

        <div class="modal-title">
            抓取成功！
        </div>

        <div class="modal-text">
            你的娃娃被抓到了 ♡
        </div>

        <img
            class="caught-image"
            id="caughtImage"
            alt="抓取成功"
        >

        <button
            class="close-modal"
            id="closeModal"
            type="button"
        >
            好耶！♡
        </button>

    </div>

</div>


<script>

/* =========================================================
   基础变量
========================================================= */

const crane = document.getElementById("crane");
const clawAnchor = document.getElementById("clawAnchor");

const grabBtn = document.getElementById("grabBtn");
const leftBtn = document.getElementById("leftBtn");
const rightBtn = document.getElementById("rightBtn");

const fileInput = document.getElementById("fileInput");
const prizesBox = document.getElementById("prizes");

const randomBtn = document.getElementById("randomBtn");
const clearBtn = document.getElementById("clearBtn");

const modal = document.getElementById("modal");
const caughtImage = document.getElementById("caughtImage");
const closeModal = document.getElementById("closeModal");


let prizes = [];

let position = 50;

let busy = false;


/* =========================================================
   横向移动
========================================================= */

function move(direction){

    if(busy){
        return;
    }

    position += direction * 8;

    if(position < 10){
        position = 10;
    }

    if(position > 90){
        position = 90;
    }

    crane.style.left = position + "%";
}


/* =========================================================
   左右按钮
========================================================= */

leftBtn.addEventListener("click",function(){
    move(-1);
});

rightBtn.addEventListener("click",function(){
    move(1);
});


/* =========================================================
   键盘控制
========================================================= */

document.addEventListener("keydown",function(event){

    if(event.key === "ArrowLeft"){
        event.preventDefault();
        move(-1);
    }

    if(event.key === "ArrowRight"){
        event.preventDefault();
        move(1);
    }

    if(
        event.key === " " ||
        event.key === "Enter"
    ){
        event.preventDefault();
        grab();
    }

});


/* =========================================================
   上传图片
========================================================= */

fileInput.addEventListener("change",function(){

    const files = Array.from(this.files);

    if(!files.length){
        return;
    }

    files.forEach(file => {

        if(!file.type.startsWith("image/")){
            return;
        }

        const reader = new FileReader();

        reader.onload = function(event){

            prizes.push({
                src:event.target.result,
                id:Date.now() + Math.random()
            });

            renderPrizes();

        };

        reader.readAsDataURL(file);

    });

    fileInput.value = "";

});


/* =========================================================
   显示娃娃
========================================================= */

function renderPrizes(){

    prizesBox.innerHTML = "";

    const showList = prizes.slice(0,8);

    showList.forEach((prize,index)=>{

        const img = document.createElement("img");

        img.className = "prize";

        img.src = prize.src;

        img.alt = "娃娃";

        /*
            不强制裁成圆形。
            保持原本图片比例。
        */

        prizesBox.appendChild(img);

    });

}


/* =========================================================
   随机摆放
========================================================= */

randomBtn.addEventListener("click",function(){

    if(prizes.length < 2){
        return;
    }

    prizes.sort(()=>Math.random() - .5);

    renderPrizes();

});


/* =========================================================
   清空
========================================================= */

clearBtn.addEventListener("click",function(){

    prizes = [];

    renderPrizes();

});


/* =========================================================
   抓取
========================================================= */

function grab(){

    if(busy){
        return;
    }

    if(prizes.length === 0){

        alert("先上传一些娃娃吧 ♡");

        return;
    }

    busy = true;

    grabBtn.disabled = true;


    /*
        第一阶段：
        爪子保持原位
        打开状态
    */

    clawAnchor.classList.remove("closed");


    /*
        第二阶段：
        只有爪子本体下降

        注意：
        crane 不动
        crane-head 不动
        cable 不动
    */

    setTimeout(()=>{

        clawAnchor.classList.add("grabbing");

    },100);


    /*
        第三阶段：
        爪子闭合
    */

    setTimeout(()=>{

        clawAnchor.classList.add("closed");

    },650);


    /*
        第四阶段：
        抓取结果
    */

    setTimeout(()=>{

        const success =
            Math.random() < 0.78;

        if(success){

            const randomIndex =
                Math.floor(
                    Math.random() * prizes.length
                );

            const caught =
                prizes.splice(
                    randomIndex,
                    1
                )[0];


            renderPrizes();


            caughtImage.src = caught.src;

            modal.classList.add("show");

        }else{

            /*
                没抓到
            */

            clawAnchor.classList.remove("closed");

        }

    },1050);


    /*
        第五阶段：
        爪子回到上面

        注意：
        还是只有 claw-body 在移动。
    */

    setTimeout(()=>{

        clawAnchor.classList.remove("grabbing");

    },1350);


    /*
        第六阶段：
        恢复
    */

    setTimeout(()=>{

        clawAnchor.classList.remove("closed");

        busy = false;

        grabBtn.disabled = false;

    },1900);

}


/* =========================================================
   抓取按钮
========================================================= */

grabBtn.addEventListener("click",grab);


/* =========================================================
   关闭成功弹窗
========================================================= */

closeModal.addEventListener("click",function(){

    modal.classList.remove("show");

});


/* 点击黑色背景也可以关闭 */

modal.addEventListener("click",function(event){

    if(event.target === modal){

        modal.classList.remove("show");

    }

});


/* =========================================================
   初始化
========================================================= */

renderPrizes();

</script>

</body>
</html>
