<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的小小娃娃机 ♡</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(135deg,#fff5f8,#f5efff);
  font-family:Arial,"Noto Sans SC",sans-serif;
  color:#66536d;
}

header{
  text-align:center;
  padding:24px 15px 12px;
}

h1{
  margin:0;
  font-size:28px;
  color:#9b6fa8;
}

.subtitle{
  margin-top:7px;
  font-size:13px;
  color:#aa94b1;
}

.container{
  width:min(94%,520px);
  margin:auto;
}

/* =========================
   娃娃机
========================= */

.machine{
  position:relative;
  height:560px;
  overflow:hidden;

  border:8px solid #d29abb;
  border-radius:30px;

  background:
    linear-gradient(
      to bottom,
      #dff7ff 0%,
      #f5fcff 67%,
      #d7a779 67%,
      #c18c61 100%
    );

  box-shadow:
    0 15px 35px rgba(120,90,130,.18),
    inset 0 0 30px rgba(255,255,255,.65);
}

.machine-title{
  position:absolute;
  top:18px;
  left:50%;
  transform:translateX(-50%);

  background:rgba(255,255,255,.86);
  padding:8px 24px;

  border-radius:20px;

  color:#a06da0;
  font-weight:bold;

  z-index:10;
  white-space:nowrap;
}

.light{
  position:absolute;
  top:4px;

  width:12px;
  height:12px;

  border-radius:50%;
  background:#fff;

  box-shadow:0 0 12px #fff;
}

.light:nth-child(1){
  left:25px;
}

.light:nth-child(2){
  left:55px;
}

.light:nth-child(3){
  right:55px;
}

.light:nth-child(4){
  right:25px;
}

/* =========================
   横向轨道
========================= */

.rail{
  position:absolute;

  top:78px;
  left:6%;

  width:88%;
  height:10px;

  border-radius:10px;

  background:#a984b4;
}

/* =========================
   吊车整体
========================= */

.crane{
  position:absolute;

  top:77px;
  left:50%;

  width:70px;
  height:190px;

  transform:translateX(-50%);

  transition:left .35s ease;

  z-index:8;
}

/* 上方滑块 */

.crane-head{
  width:42px;
  height:30px;

  margin:auto;

  background:#b88bc2;

  border-radius:10px 10px 6px 6px;

  box-shadow:
    0 3px 6px rgba(130,90,140,.15);
}

/* =========================
   💗 超细粉色绳索
========================= */

.cable{
  width:3px;
  height:90px;

  margin:auto;

  background:#e9a9c2;

  border-radius:10px;

  box-shadow:
    0 0 2px rgba(220,130,165,.25);
}


/* ==================================================
   🪝 娃娃机爪子
   细版 · 粉白奶油风 · 非金属
================================================== */

.claw{
  position:relative;

  width:62px;
  height:58px;

  margin:auto;

  filter:
    drop-shadow(
      0 3px 4px rgba(210,130,170,.18)
    );

  transform-origin:top center;
}


/* =========================
   中间圆形连接件
========================= */

.claw .joint{
  position:absolute;

  left:50%;
  top:0;

  width:24px;
  height:22px;

  transform:translateX(-50%);

  background:#fff8fc;

  border:3px solid #e4a0bd;

  border-radius:9px;

  box-shadow:
    0 2px 4px rgba(190,110,150,.16),
    inset 1px 1px 2px rgba(255,255,255,.9);

  z-index:5;
}


/* 中间的小圆 */

.claw .joint::after{
  content:"";

  position:absolute;

  left:50%;
  top:50%;

  width:10px;
  height:10px;

  transform:translate(-50%,-50%);

  border-radius:50%;

  background:#fff4f9;

  border:2px solid #e7a7c1;
}


/* =========================
   左边细爪
========================= */

.claw .arm-left{
  position:absolute;

  left:16px;
  top:17px;

  width:11px;
  height:38px;

  background:linear-gradient(
    90deg,
    #f8cade 0%,
    #fff4f9 50%,
    #f6c5da 100%
  );

  border:3px solid #df9fbb;

  border-radius:
    10px 10px 9px 9px;

  transform:
    rotate(31deg);

  transform-origin:top center;

  box-shadow:
    0 3px 5px rgba(190,110,150,.16),
    inset 1px 1px 2px rgba(255,255,255,.85);

  z-index:3;

  transition:
    transform .35s ease;
}


/* =========================
   右边细爪
========================= */

.claw .arm-right{
  position:absolute;

  right:16px;
  top:17px;

  width:11px;
  height:38px;

  background:linear-gradient(
    90deg,
    #f6c5da 0%,
    #fff4f9 50%,
    #f8cade 100%
  );

  border:3px solid #df9fbb;

  border-radius:
    10px 10px 9px 9px;

  transform:
    rotate(-31deg);

  transform-origin:top center;

  box-shadow:
    0 3px 5px rgba(190,110,150,.16),
    inset 1px 1px 2px rgba(255,255,255,.85);

  z-index:3;

  transition:
    transform .35s ease;
}


/* =========================
   张开状态
========================= */

.claw.open .arm-left{
  transform:rotate(39deg);
}

.claw.open .arm-right{
  transform:rotate(-39deg);
}


/* =========================
   闭合状态
========================= */

.claw.closed .arm-left{
  transform:rotate(20deg);
}

.claw.closed .arm-right{
  transform:rotate(-20deg);
}


/* =========================
   奖品区域
========================= */

.prizes{
  position:absolute;

  left:7%;
  right:7%;
  bottom:14%;

  height:52%;

  display:flex;
  flex-wrap:wrap;

  align-items:flex-end;
  justify-content:center;

  gap:9px;
}

.prize{
  width:76px;
  height:76px;

  overflow:hidden;

  background:rgba(255,255,255,.7);

  border:3px solid white;

  border-radius:12px;

  box-shadow:
    0 5px 10px rgba(80,50,80,.2);

  display:flex;

  align-items:center;
  justify-content:center;
}

.prize img{
  width:100%;
  height:100%;

  object-fit:contain;

  display:block;
}


/* =========================
   出奖口
========================= */

.exit{
  position:absolute;

  bottom:12px;
  left:50%;

  transform:translateX(-50%);

  width:145px;
  height:55px;

  border-radius:
    15px 15px 5px 5px;

  background:#725d76;

  border:5px solid #aa8bb0;

  color:white;

  text-align:center;

  padding-top:13px;

  font-weight:bold;
}


/* =========================
   按钮
========================= */

.controls{
  display:grid;

  grid-template-columns:
    1fr 1.2fr 1fr;

  gap:9px;

  margin-top:14px;
}

button,
.upload{
  border:none;

  border-radius:15px;

  padding:13px 8px;

  font-size:15px;

  font-weight:bold;

  color:white;

  background:#ad83b9;

  box-shadow:
    0 4px 8px rgba(100,70,110,.15);

  cursor:pointer;

  text-align:center;
}

button:active,
.upload:active{
  transform:scale(.96);
}

.grab{
  background:#df8fac;
}

.upload{
  background:#91a7c9;
}

input{
  display:none;
}


/* =========================
   信息
========================= */

.info{
  margin-top:12px;

  padding:13px;

  background:rgba(255,255,255,.78);

  border-radius:15px;

  text-align:center;

  font-size:14px;
}

.empty{
  color:#aa94b1;

  font-size:14px;

  text-align:center;

  padding-top:130px;
}


/* ==================================================
   🎉 抓取成功弹窗
================================================== */

.result{
  display:none;

  position:fixed;

  inset:0;

  z-index:50;

  background:
    rgba(82,60,90,.28);

  backdrop-filter:blur(4px);

  align-items:center;
  justify-content:center;

  padding:22px;
}

.result.show{
  display:flex;
}

.result-card{
  width:min(92vw,390px);

  padding:24px 20px 20px;

  background:#fff;

  border:3px solid #f0c7d7;

  border-radius:28px;

  text-align:center;

  box-shadow:
    0 20px 55px rgba(70,45,80,.25);

  position:relative;

  overflow:hidden;
}

.result-title{
  font-size:25px;

  font-weight:900;

  color:#d27f9d;
}

.result-icon{
  font-size:54px;

  line-height:1;

  margin:6px 0 2px;

  animation:pop .55s ease;
}

@keyframes pop{

  0%{
    transform:
      scale(.3)
      rotate(-12deg);

    opacity:0;
  }

  70%{
    transform:
      scale(1.15);
  }

  100%{
    transform:
      scale(1);
  }
}

.result-img-wrap{
  width:190px;
  height:190px;

  margin:12px auto;

  border-radius:20px;

  background:#faf6fb;

  border:3px solid #ead9ee;

  display:flex;

  align-items:center;
  justify-content:center;

  overflow:hidden;
}

.result-img{
  max-width:100%;
  max-height:100%;

  width:auto;
  height:auto;

  object-fit:contain;
}

.result-text{
  font-size:14px;

  color:#8e7893;

  margin-bottom:10px;
}

.result button{
  background:#df8fac;

  padding:12px 25px;
}


/* =========================
   ✨ 星星
========================= */

.sparkles{
  position:absolute;

  inset:0;

  pointer-events:none;

  font-size:22px;
}

.sparkles span{
  position:absolute;

  animation:
    spark 1.5s ease-out forwards;
}

.sparkles span:nth-child(1){
  left:10%;
  top:15%;
}

.sparkles span:nth-child(2){
  right:12%;
  top:20%;
}

.sparkles span:nth-child(3){
  left:18%;
  bottom:18%;
}

.sparkles span:nth-child(4){
  right:17%;
  bottom:15%;
}

@keyframes spark{

  0%{
    transform:
      scale(.3);

    opacity:0;
  }

  35%{
    opacity:1;
  }

  100%{
    transform:
      translateY(-25px)
      scale(1.3)
      rotate(180deg);

    opacity:0;
  }
}
</style>
</head>


<body>

<header>

  <h1>
    🧸 我的小小娃娃机 ♡
  </h1>

  <div class="subtitle">
    上传你喜欢的图片，开始抓取吧 ✦
  </div>

</header>


<div class="container">

  <div class="machine">

    <div class="light"></div>
    <div class="light"></div>
    <div class="light"></div>
    <div class="light"></div>


    <div class="machine-title">
      ✦ MY CLAW MACHINE ✦
    </div>


    <div class="rail"></div>


    <div class="crane" id="crane">

      <div class="crane-head"></div>

      <div class="cable"></div>


      <!-- 🪝 新版细爪 -->

      <div class="claw" id="claw">

        <div class="joint"></div>

        <div class="arm-left"></div>

        <div class="arm-right"></div>

      </div>

    </div>


    <div
      class="prizes"
      id="prizes">
    </div>


    <div class="exit">
      🎁 出奖口
    </div>

  </div>


  <div class="controls">

    <button onclick="move(-1)">
      ← 左
    </button>

    <button
      class="grab"
      onclick="grab()">
      🪝 抓取
    </button>

    <button onclick="move(1)">
      右 →
    </button>


    <label class="upload">

      ＋ 上传图片

      <input
        type="file"
        id="upload"
        accept="image/*"
        multiple
      >

    </label>


    <button onclick="newGame()">
      🔀 重新摆放
    </button>


    <button onclick="clearPrizes()">
      🗑 清空
    </button>

  </div>


  <div class="info">

    当前奖品：
    <b id="count">0</b>
    个

  </div>

</div>


<!-- =========================
     抓取结果
========================= -->

<div
  class="result"
  id="result">

  <div class="result-card">

    <div class="sparkles">

      <span>✦</span>
      <span>♡</span>
      <span>✧</span>
      <span>✦</span>

    </div>


    <div
      class="result-icon"
      id="resultIcon">

      🎉

    </div>


    <div
      class="result-title"
      id="resultTitle">

      抓取成功！

    </div>


    <div
      class="result-img-wrap"
      id="resultImgWrap">

      <img
        class="result-img"
        id="resultImg"
      >

    </div>


    <div
      class="result-text"
      id="resultText">

      恭喜你获得了这个奖品 ♡

    </div>


    <button onclick="closeResult()">
      再抓一次 ♡
    </button>

  </div>

</div>


<script>

let prizes = [];

let position = 50;

let busy = false;


const crane =
  document.getElementById("crane");

const claw =
  document.getElementById("claw");

const prizeBox =
  document.getElementById("prizes");

const count =
  document.getElementById("count");

const upload =
  document.getElementById("upload");

const result =
  document.getElementById("result");


/* =========================
   上传图片
========================= */

upload.addEventListener(
  "change",
  function(e){

    [...e.target.files].forEach(
      function(file){

        const reader =
          new FileReader();


        reader.onload =
          function(event){

            prizes.push({

              image:
                event.target.result,

              name:
                file.name

            });


            renderPrizes();

          };


        reader.readAsDataURL(file);

      }
    );


    upload.value="";

  }
);


/* =========================
   显示奖品
========================= */

function renderPrizes(){

  prizeBox.innerHTML="";


  if(!prizes.length){

    prizeBox.innerHTML =
      '<div class="empty">' +
      '还没有奖品 ♡<br>' +
      '请先上传图片' +
      '</div>';

  }else{

    prizes.forEach(
      function(prize){

        const div =
          document.createElement("div");


        div.className =
          "prize";


        div.innerHTML =
          '<img src="' +
          prize.image +
          '" alt="">';


        prizeBox.appendChild(div);

      }
    );

  }


  count.textContent =
    prizes.length;

}


/* =========================
   移动爪子
========================= */

function move(direction){

  if(busy)return;


  position +=
    direction * 10;


  position =
    Math.max(
      12,
      Math.min(
        88,
        position
      )
    );


  crane.style.left =
    position + "%";

}


/* =========================
   抓取
========================= */

function grab(){

  if(busy)return;


  if(!prizes.length){

    alert(
      "请先上传一些图片作为奖品 ♡"
    );

    return;
  }


  busy=true;


  /* 张开 */

  claw.className =
    "claw open";


  crane.style.transition =
    "left .35s ease, top .45s ease";


  /* 下去 */

  crane.style.top =
    "235px";


  setTimeout(
    function(){

      /* 闭合 */

      claw.className =
        "claw closed";

    },
    430
  );


  setTimeout(
    function(){

      /* 上来 */

      crane.style.top =
        "77px";

    },
    700
  );


  setTimeout(
    function(){

      const success =
        Math.random() < 0.65;


      if(success){

        const index =
          Math.floor(
            Math.random() *
            prizes.length
          );


        const prize =
          prizes[index];


        showSuccess(prize);


        prizes.splice(
          index,
          1
        );


        renderPrizes();

      }else{

        showFail();

      }


      claw.className =
        "claw";


      busy=false;

    },
    1200
  );

}


/* =========================
   抓取成功
========================= */

function showSuccess(prize){

  document.getElementById(
    "resultIcon"
  ).textContent =
    "🎉";


  document.getElementById(
    "resultTitle"
  ).textContent =
    "抓取成功！";


  document.getElementById(
    "resultImg"
  ).src =
    prize.image;


  document.getElementById(
    "resultImg"
  ).alt =
    prize.name;


  document.getElementById(
    "resultImgWrap"
  ).style.display =
    "flex";


  document.getElementById(
    "resultText"
  ).textContent =
    "恭喜你获得了这个奖品 ♡";


  result.classList.add(
    "show"
  );

}


/* =========================
   没抓到
========================= */

function showFail(){

  document.getElementById(
    "resultIcon"
  ).textContent =
    "💦";


  document.getElementById(
    "resultTitle"
  ).textContent =
    "差一点点！";


  document.getElementById(
    "resultImgWrap"
  ).style.display =
    "none";


  document.getElementById(
    "resultText"
  ).textContent =
    "这次没有抓到，再试一次吧 ♡";


  result.classList.add(
    "show"
  );

}


/* =========================
   关闭弹窗
========================= */

function closeResult(){

  result.classList.remove(
    "show"
  );


  document.getElementById(
    "resultImgWrap"
  ).style.display =
    "flex";

}


/* =========================
   随机摆放
========================= */

function newGame(){

  prizes.sort(
    () =>
      Math.random() - 0.5
  );


  renderPrizes();


  position =
    20 +
    Math.random() * 60;


  crane.style.left =
    position + "%";

}


/* =========================
   清空
========================= */

function clearPrizes(){

  if(
    !confirm(
      "确定要清空所有奖品吗？"
    )
  ){

    return;

  }


  prizes=[];


  renderPrizes();

}


/* =========================
   初始显示
========================= */

renderPrizes();

</script>

</body>
</html>
