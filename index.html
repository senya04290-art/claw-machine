<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>我的小小娃娃机 ♡</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --machine-color:#e9a9c4;
    --machine-dark:#d786aa;
    --text:#66525b;
}

body{
    min-height:100vh;
    padding:24px 14px 50px;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text);
    background:
        radial-gradient(circle at 10% 10%,rgba(255,220,235,.6),transparent 28%),
        radial-gradient(circle at 90% 20%,rgba(225,215,250,.5),transparent 28%),
        linear-gradient(135deg,#fff5f8,#faf2f7);
}

.page{
    width:min(1100px,100%);
    margin:auto;
}

.page-title{
    text-align:center;
    margin-bottom:24px;
}

.page-title h1{
    font-size:30px;
    color:#745965;
    text-shadow:0 2px 0 white;
}

.page-title p{
    margin-top:7px;
    color:#a1848f;
    font-size:13px;
}

.layout{
    display:grid;
    grid-template-columns:minmax(0,1fr) 330px;
    gap:24px;
    align-items:start;
}

@media(max-width:800px){
    .layout{
        grid-template-columns:1fr;
    }
}


/* =====================================
   娃娃机
===================================== */

.machine{
    position:relative;
    width:100%;
    max-width:620px;
    margin:auto;
    padding:15px 15px 20px;

    background:
        linear-gradient(
            135deg,
            #fffafd,
            #fff
        );

    border:9px solid var(--machine-color);
    border-radius:32px 32px 22px 22px;

    box-shadow:
        0 20px 45px rgba(100,65,85,.17),
        inset 0 2px 0 rgba(255,255,255,.9);

    overflow:hidden;
    transition:.3s;
}

.machine-top{
    position:relative;
    height:58px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:20px 20px 11px 11px;

    background:
        linear-gradient(
            180deg,
            var(--machine-color),
            var(--machine-dark)
        );

    box-shadow:
        inset 0 2px 3px rgba(255,255,255,.4);
}

.machine-title{
    color:white;
    font-size:17px;
    font-weight:900;
    letter-spacing:2px;
    text-shadow:0 2px 3px rgba(100,50,70,.2);
}

.lights{
    position:absolute;
    top:7px;
    left:13px;
    right:13px;
    display:flex;
    justify-content:space-between;
}

.light{
    width:7px;
    height:7px;
    border-radius:50%;
    background:white;
    box-shadow:0 0 8px rgba(255,255,255,.95);
}


/* =====================================
   玻璃
===================================== */

.glass{
    position:relative;
    height:390px;
    margin-top:12px;

    overflow:hidden;

    border:4px solid var(--machine-color);
    border-radius:18px;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.82),
            rgba(255,246,250,.96)
        );

    box-shadow:
        inset 0 0 25px rgba(180,130,155,.1);
}

.glass:before{
    content:"";
    position:absolute;
    left:-5%;
    top:0;
    width:38%;
    height:100%;
    transform:skewX(-10deg);

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.42),
            transparent
        );

    pointer-events:none;
    z-index:30;
}


/* =====================================
   滑轨
===================================== */

.rail{
    position:absolute;
    top:23px;
    left:7%;
    width:86%;
    height:9px;

    border-radius:20px;

    background:
        linear-gradient(
            180deg,
            #fff,
            #d0c9cd
        );

    border:1px solid #c5bdc1;

    box-shadow:
        0 2px 4px rgba(70,50,60,.16),
        inset 0 1px 2px white;

    z-index:8;
}


/* =====================================
   紫色滑块
===================================== */

.slider{
    position:absolute;
    top:17px;
    left:50%;

    width:34px;
    height:20px;

    transform:translateX(-50%);

    border-radius:8px;

    background:
        linear-gradient(
            180deg,
            #d7a0c7,
            #a96f9f
        );

    border:2px solid white;

    box-shadow:
        0 3px 7px rgba(90,50,90,.22);

    z-index:9;

    transition:left .35s ease;
}

.slider:after{
    content:"";
    position:absolute;
    left:50%;
    top:4px;

    width:11px;
    height:4px;

    transform:translateX(-50%);

    border-radius:5px;
    background:rgba(255,255,255,.6);
}


/* =====================================
   吊机
===================================== */

.crane{
    position:absolute;
    top:21px;
    left:50%;

    width:54px;
    height:320px;

    transform:translateX(-50%);

    z-index:12;

    transition:left .35s ease;
}

.crane-head{
    position:absolute;
    top:0;
    left:50%;

    width:42px;
    height:27px;

    transform:translateX(-50%);

    border-radius:7px 7px 5px 5px;

    background:
        linear-gradient(
            180deg,
            var(--machine-color),
            var(--machine-dark)
        );

    box-shadow:
        0 4px 8px rgba(80,50,60,.15),
        inset 0 2px 2px rgba(255,255,255,.35);
}

.crane-head:after{
    content:"";
    position:absolute;
    left:50%;
    bottom:-4px;

    width:23px;
    height:5px;

    transform:translateX(-50%);

    border-radius:5px;
    background:#d1c7cc;
}


/* =====================================
   绳索
===================================== */

.cable{
    position:absolute;
    top:25px;
    left:50%;

    width:3px;
    height:45px;

    transform:translateX(-50%);

    border-radius:5px;

    background:
        linear-gradient(
            90deg,
            #978d93,
            #f7f4f5,
            #978d93
        );

    transition:height .6s ease;

    z-index:4;
}

.crane.dropping .cable{
    height:235px;
}


/* =====================================
   ★ 新版一体式两爪
===================================== */

.claw{
    position:absolute;

    top:65px;
    left:50%;

    width:60px;
    height:66px;

    transform:translateX(-50%);

    transition:top .6s ease;

    z-index:7;
}

.crane.dropping .claw{
    top:250px;
}


/*
    中央连接点
*/

.joint{
    position:absolute;

    top:0;
    left:50%;

    width:13px;
    height:13px;

    transform:translateX(-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #faf8f9,
            #b9b0b5 55%,
            #817a80
        );

    border:2px solid white;

    box-shadow:
        0 2px 5px rgba(60,45,52,.22);

    z-index:6;
}


/*
    上半段连接杆
*/

.claw-upper{
    position:absolute;

    top:10px;
    left:50%;

    width:6px;
    height:25px;

    transform:
        translateX(-50%);

    border-radius:5px;

    background:
        linear-gradient(
            90deg,
            #898186,
            #faf8f9 48%,
            #91898e
        );

    box-shadow:
        0 2px 3px rgba(70,55,65,.2);

    z-index:5;
}


/*
    左右爪主体

    初始状态：

       ／    ＼
        \    /
         \  /
          \/

*/

.claw-piece{
    position:absolute;

    top:26px;

    width:6px;
    height:34px;

    border-radius:5px 5px 4px 4px;

    background:
        linear-gradient(
            90deg,
            #898186,
            #faf8f9 48%,
            #91898e
        );

    box-shadow:
        0 2px 3px rgba(70,55,65,.2);

    transform-origin:50% 3px;

    transition:
        transform .35s ease;

    z-index:4;
}


/* 左边 */

.claw-piece.left{
    left:50%;

    transform:
        translateX(-50%)
        rotate(38deg);
}


/* 右边 */

.claw-piece.right{
    left:50%;

    transform:
        translateX(-50%)
        rotate(-38deg);
}


/*
    爪尖
*/

.claw-piece:after{
    content:"";

    position:absolute;

    left:50%;
    bottom:-5px;

    width:10px;
    height:14px;

    transform:
        translateX(-50%)
        rotate(28deg);

    border-left:4px solid #8d858a;
    border-bottom:4px solid #8d858a;

    border-radius:0 0 0 5px;
}


/*
    合拢：

        ＼／
         ＼／
*/

.claw.closed .claw-piece.left{
    transform:
        translateX(-50%)
        rotate(17deg);
}

.claw.closed .claw-piece.right{
    transform:
        translateX(-50%)
        rotate(-17deg);
}


/* =====================================
   ★ 被抓住的物品
===================================== */

.grabbed-item{
    position:absolute;

    left:50%;
    top:58px;

    width:52px;
    height:52px;

    transform:
        translateX(-50%)
        scale(.88);

    display:flex;
    align-items:center;
    justify-content:center;

    opacity:0;

    pointer-events:none;

    z-index:3;

    transition:
        top .6s ease,
        opacity .25s ease,
        transform .35s ease;
}


/*
    图片本身保持比例
*/

.grabbed-item img{
    max-width:100%;
    max-height:100%;

    width:auto;
    height:auto;

    object-fit:contain;

    display:block;

    filter:
        drop-shadow(
            0 3px 4px rgba(70,50,60,.18)
        );
}


/*
    下爪以后显示图片
*/

.crane.grabbing .grabbed-item{
    opacity:1;
}


/*
    跟随爪子下降
*/

.crane.dropping .grabbed-item{
    top:243px;
}


/*
    上升时跟着爪子回来
*/

.crane.dropping.finished .grabbed-item{
    top:58px;
}


/* =====================================
   奖品区域
===================================== */

.prizes{
    position:absolute;

    left:18px;
    right:18px;
    bottom:38px;

    height:120px;

    display:grid;

    grid-template-columns:
        repeat(5,1fr);

    grid-auto-rows:1fr;

    gap:8px;

    align-items:end;

    z-index:3;
}


/*
    ★ 每个奖品位置固定为正方形
*/

.prize-slot{
    width:100%;
    aspect-ratio:1 / 1;

    min-width:0;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;

    border-radius:8px;

    background:
        rgba(255,255,255,.45);

    box-shadow:
        0 5px 12px rgba(100,70,85,.10);

    animation:
        prizeFloat 2.4s ease-in-out infinite;
}


/*
    图片保持原始比例
*/

.prize{
    display:block;

    max-width:92%;
    max-height:92%;

    width:auto;
    height:auto;

    object-fit:contain;
}

@keyframes prizeFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-4px);
    }
}


/* 空状态 */

.empty{
    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    color:#b49ca6;

    text-align:center;

    font-size:14px;
    line-height:1.8;

    pointer-events:none;
    z-index:2;
}


/* =====================================
   出口
===================================== */

.exit{
    position:absolute;

    left:50%;
    bottom:0;

    width:150px;
    height:35px;

    transform:translateX(-50%);

    border-radius:15px 15px 0 0;

    background:
        linear-gradient(
            180deg,
            #d2c9ce,
            #a9a0a5
        );

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;

    font-size:11px;
    font-weight:900;
    letter-spacing:2px;

    box-shadow:
        inset 0 2px 3px rgba(255,255,255,.5);
}


/* =====================================
   控制按钮
===================================== */

.controls{
    display:flex;

    align-items:center;
    justify-content:center;

    gap:10px;

    margin-top:14px;
}

.move-btn,
.grab-btn{
    border:0;
    font-family:inherit;
    cursor:pointer;

    transition:
        transform .15s ease,
        box-shadow .15s ease;
}

.move-btn{
    width:43px;
    height:43px;

    border-radius:13px;

    background:white;
    color:#9d7585;

    box-shadow:
        0 5px 12px rgba(100,70,85,.12);
}

.grab-btn{
    min-width:135px;
    height:46px;

    border-radius:16px;

    color:white;

    font-size:14px;
    font-weight:900;

    background:
        linear-gradient(
            135deg,
            var(--machine-color),
            var(--machine-dark)
        );

    box-shadow:
        0 7px 14px rgba(190,110,145,.2);
}

.move-btn:hover,
.grab-btn:hover{
    transform:translateY(-2px);
}

.move-btn:active,
.grab-btn:active{
    transform:translateY(1px);
}

.grab-btn:disabled,
.move-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}


/* =====================================
   编辑器
===================================== */

.editor{
    background:rgba(255,255,255,.86);

    border-radius:22px;
    padding:14px;

    box-shadow:
        0 12px 30px rgba(110,75,95,.1);

    border:1px solid rgba(255,255,255,.8);
}

.editor-title{
    text-align:center;

    margin:3px 0 13px;

    color:#765d68;

    font-size:17px;
    font-weight:900;
}

.section{
    margin-bottom:9px;

    border-radius:14px;

    background:white;

    overflow:hidden;

    border:1px solid #f1e4e9;
}

.section-head{
    width:100%;

    padding:13px 14px;

    border:0;

    background:white;

    color:#765d68;

    font-family:inherit;

    font-size:13px;
    font-weight:900;

    text-align:left;

    cursor:pointer;

    display:flex;

    justify-content:space-between;
    align-items:center;
}

.section-head span:last-child{
    transition:.25s;
}

.section.open
.section-head
span:last-child{
    transform:rotate(180deg);
}

.section-body{
    display:none;

    padding:
        0
        14px
        14px;
}

.section.open .section-body{
    display:block;
}

.label{
    display:block;

    margin:9px 0 6px;

    color:#927b85;

    font-size:11px;
    font-weight:900;
}

input[type="text"],
input[type="number"],
input[type="color"]{
    width:100%;
    height:38px;

    border:1px solid #eadde3;

    border-radius:10px;

    background:white;

    padding:0 10px;

    font-family:inherit;

    color:#6d5962;

    outline:none;
}

input:focus{
    border-color:#dda6bb;
}


/* =====================================
   上传
===================================== */

.upload-label{
    display:flex;

    align-items:center;
    justify-content:center;

    min-height:47px;

    border-radius:12px;

    background:#fff2f7;

    color:#b46785;

    border:1px dashed #e3a5bc;

    cursor:pointer;

    font-size:13px;
    font-weight:900;
}

.upload-label:hover{
    background:#ffedf4;
}

#imageInput{
    display:none;
}

.tip{
    margin-top:8px;

    color:#ae969f;

    font-size:10px;

    line-height:1.6;

    text-align:center;
}

.upload-list{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:7px;

    margin-top:10px;
}

.upload-item{
    position:relative;

    aspect-ratio:1;

    overflow:hidden;

    border-radius:10px;

    background:#faf5f7;

    border:1px solid #eee0e6;
}

.upload-item img{
    width:100%;
    height:100%;

    object-fit:contain;
}

.remove-img{
    position:absolute;

    right:3px;
    top:3px;

    width:21px;
    height:21px;

    border:0;

    border-radius:50%;

    background:rgba(80,60,70,.65);

    color:white;

    cursor:pointer;
}

.small-buttons{
    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:7px;

    margin-top:8px;
}

.small-btn{
    height:36px;

    border:0;

    border-radius:10px;

    background:#f8eef3;

    color:#876b77;

    font-family:inherit;

    cursor:pointer;

    font-size:11px;
}


/* =====================================
   颜色
===================================== */

.color-grid{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:7px;
}

.color-btn{
    height:34px;

    border:2px solid transparent;

    border-radius:10px;

    cursor:pointer;
}

.color-btn.active{
    border-color:#6d5962;

    box-shadow:
        0 0 0 2px white inset;
}

.choice-grid{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:7px;
}

.choice{
    padding:9px 5px;

    border:1px solid #eadde3;

    background:white;

    border-radius:10px;

    color:#806c75;

    cursor:pointer;

    font-family:inherit;

    font-size:11px;
}

.choice.active{
    background:#fff0f5;

    border-color:#dfa5bb;

    color:#ad6580;
}


/* =====================================
   开关
===================================== */

.switch-row{
    display:flex;

    justify-content:space-between;
    align-items:center;

    margin-top:11px;

    color:#806c75;

    font-size:11px;
}

.switch{
    position:relative;

    width:42px;
    height:23px;
}

.switch input{
    opacity:0;
    width:0;
    height:0;
}

.switch-track{
    position:absolute;

    inset:0;

    background:#ddd2d7;

    border-radius:20px;

    cursor:pointer;
}

.switch-track:before{
    content:"";

    position:absolute;

    width:17px;
    height:17px;

    left:3px;
    top:3px;

    border-radius:50%;

    background:white;

    transition:.25s;
}

.switch input:checked
+ .switch-track{
    background:#dda0b8;
}

.switch input:checked
+ .switch-track:before{
    transform:translateX(19px);
}


/* =====================================
   弹窗
===================================== */

.success-modal{
    position:fixed;

    inset:0;

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:rgba(60,40,50,.28);

    backdrop-filter:blur(5px);

    z-index:100;
}

.success-modal.show{
    display:flex;
}

.success-card{
    width:min(330px,100%);

    padding:25px 20px 22px;

    border-radius:25px;

    background:white;

    text-align:center;

    box-shadow:
        0 20px 60px rgba(70,40,55,.25);

    animation:
        modalIn .35s ease;
}

@keyframes modalIn{

    from{
        transform:scale(.8);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }

}

.success-icon{
    width:76px;
    height:76px;

    margin:0 auto 12px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:42px;

    background:#fff0f5;
}

.success-card h2{
    margin:7px 0;

    color:#785d68;

    font-size:21px;
}

.success-card p{
    margin:5px 0 17px;

    color:#a1848f;

    font-size:13px;
}

.close-modal{
    width:100%;

    height:42px;

    border:0;

    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            var(--machine-color),
            var(--machine-dark)
        );

    color:white;

    font-family:inherit;

    font-weight:900;

    cursor:pointer;
}


/* =====================================
   闪光
===================================== */

.sparkle{
    position:fixed;

    pointer-events:none;

    z-index:150;

    animation:
        sparkle .8s ease forwards;
}

@keyframes sparkle{

    0%{
        transform:
            scale(.3)
            rotate(0deg);

        opacity:1;
    }

    100%{
        transform:
            scale(1.5)
            rotate(90deg);

        opacity:0;
    }
}


/* =====================================
   手机
===================================== */

@media(max-width:500px){

    body{
        padding:
            15px
            9px
            35px;
    }

    .page-title h1{
        font-size:23px;
    }

    .machine{
        border-width:7px;
        padding:
            10px
            10px
            15px;
    }

    .glass{
        height:360px;
    }

    .prizes{
        left:14px;
        right:14px;
        bottom:38px;
        gap:5px;
    }

    .grab-btn{
        min-width:115px;
    }
}
</style>
</head>


<body>

<div class="page">

    <div class="page-title">
        <h1>🧸 我的小小娃娃机 ♡</h1>
        <p>上传你喜欢的图片，开始抓取吧 ✦</p>
    </div>


    <div class="layout">


        <!-- =====================
             娃娃机
        ====================== -->

        <div class="machine" id="machine">

            <div class="machine-top">

                <div class="lights">
                    <span class="light"></span>
                    <span class="light"></span>
                    <span class="light"></span>
                    <span class="light"></span>
                    <span class="light"></span>
                    <span class="light"></span>
                    <span class="light"></span>
                </div>

                <div
                    class="machine-title"
                    id="machineTitle"
                >
                    ✦ MY CLAW MACHINE ✦
                </div>

            </div>


            <div
                class="glass"
                id="glass"
            >

                <div class="rail"></div>

        </div>



        <!-- =====================
             编辑器
        ====================== -->

        <div class="editor">

            <div class="editor-title">
                ♡ 娃娃机设置 ♡
            </div>


            <div class="section open">

                <button class="section-head">

                        01　我的奖品
                    </span>

                    <span>⌄</span>

                </button>


                <div class="section-body">

                    <label
                        class="upload-label"

                    >

                    </label>

                    <input

                        accept="image/png,image/jpeg,image/webp"

                    >

                    <div class="tip">
                        可以一次选择多张图片

                    <div
                        class="upload-list"
                        id="uploadList"
                    ></div>


                    <div class="small-buttons">

                        <button
                            class="small-btn"
                            id="randomBtn"
                        >
                            🎲 随机摆放
                        </button>

                        <button
                            class="small-btn"
                            id="clearBtn"
                        >
                            🗑 清空
                        </button>

                    </div>

                </div>

            </div>



            <div class="section">

                <button class="section-head">

                    <span>
                        02　娃娃机外观
                    </span>

                    <span>⌄</span>

                </button>


                <div class="section-body">

                    <label class="label">

                    <div class="color-grid">

                        <button

                            data-color="#e9a9c4"

                        <button
                            class="color-btn"
                            data-color="#b9b5df"

                        ></button>

                        <button
                            class="color-btn"
                            data-color="#a9d7cf"
                            style="background:#a9d7cf"
                        ></button>

                        <button
                            class="color-btn"
                            data-color="#f0c48c"
                            style="background:#f0c48c"
                        ></button>

                        <button
                            class="color-btn"
                            data-color="#d7b6a8"
                            style="background:#d7b6a8"
                        ></button>

                        <button
                            class="color-btn"
                            data-color="#a9c6e8"
                            style="background:#a9c6e8"
                        ></button>

                    </div>


                    <label class="label">

                    <input

            <div class="section">

                    >

                    <input

                    >


                    <label class="label">

                    <input

            <div class="section">

                <button class="section-head">

                    <span>

                    </span>

                    <span>⌄</span>

                <div class="section-body">

                    <label class="label">

                    </label>

                    <input

                        min="1"

                    <div class="switch-row">

                        <span>

                        </span>

                                type="checkbox"

                                checked
                            >

                        <span>

<!-- =====================================
     结果弹窗
===================================== -->

<div
    class="success-modal"
    id="successModal"
>

    <div class="success-card">

        <div
            class="success-icon"
            id="successIcon"
        >
            🧸
        </div>

        <h2 id="resultTitle">
            抓取成功啦！♡
        </h2>

        <p id="resultText">
            恭喜你抓到了一个喜欢的娃娃！
        </p>

        <button
            class="close-modal"
            id="closeModal"
        >
            好耶！♡
        </button>

    </div>

</div>



<script>

/* =====================================
   元素
===================================== */

const machine =
    document.getElementById("machine");

const crane =
    document.getElementById("crane");

const claw =
    document.getElementById("claw");

const slider =
    document.getElementById("slider");

const grabBtn =
    document.getElementById("grabBtn");

const leftBtn =
    document.getElementById("leftBtn");

const rightBtn =
    document.getElementById("rightBtn");

const imageInput =
    document.getElementById("imageInput");

const uploadList =
    document.getElementById("uploadList");

const prizes =
    document.getElementById("prizes");

const empty =
    document.getElementById("empty");

const successModal =
    document.getElementById("successModal");

const closeModal =
    document.getElementById("closeModal");

const resultTitle =
    document.getElementById("resultTitle");

const resultText =
    document.getElementById("resultText");

const successIcon =
    document.getElementById("successIcon");

const titleInput =
    document.getElementById("titleInput");

const exitInput =
    document.getElementById("exitInput");

const successInput =
    document.getElementById("successInput");

const failInput =
    document.getElementById("failInput");

const machineTitle =
    document.getElementById("machineTitle");

const exitText =
    document.getElementById("exitText");

const successRate =
    document.getElementById("successRate");

const effectSwitch =
    document.getElementById("effectSwitch");

const saveSwitch =
    document.getElementById("saveSwitch");

const customColor =
    document.getElementById("customColor");

const grabbedItem =
    document.getElementById("grabbedItem");

const grabbedImage =
    document.getElementById("grabbedImage");


/* =====================================
   状态
===================================== */

let uploadedImages = [];

let cranePosition = 50;

let isPlaying = false;


/* =====================================
   面板
===================================== */

document
.querySelectorAll(".section-head")
.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            button.parentElement
            .classList.toggle("open");

        }
    );

});


/* =====================================
   上传图片
===================================== */

imageInput.addEventListener(
    "change",
    event => {

        const files =
            Array.from(
                event.target.files
            );

        files.forEach(file => {

            if(
                !file.type.startsWith("image/")
            ){
                return;
            }

            const reader =
                new FileReader();

            reader.onload =
                function(e){

                    uploadedImages.push(
                        e.target.result
                    );

                    renderUploadList();

                    renderPrizes();

                    saveData();

                };

            reader.readAsDataURL(file);

        });

        imageInput.value = "";

    }
);


/* =====================================
   上传列表
===================================== */

function renderUploadList(){

    uploadList.innerHTML = "";

    uploadedImages.forEach(
        (src,index) => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "upload-item";

            const img =
                document.createElement(
                    "img"
                );

            img.src = src;


            const remove =
                document.createElement(
                    "button"
                );

            remove.className =
                "remove-img";

            remove.textContent = "×";

            remove.onclick =
                function(){

                    uploadedImages.splice(
                        index,
                        1
                    );

                    renderUploadList();

                    renderPrizes();

                    saveData();

                };


            item.appendChild(img);

            item.appendChild(remove);

            uploadList.appendChild(item);

        }
    );

}


/* =====================================
   ★ 正方形奖品随机摆放
===================================== */

function renderPrizes(){

    prizes.innerHTML = "";

    if(
        uploadedImages.length === 0
    ){

        empty.style.display = "block";

        return;

    }

    empty.style.display = "none";


    /*
       最多显示7个奖品
       每个奖品都有独立正方形格子
    */

    uploadedImages
    .slice(0,7)
    .forEach(
        (src,index) => {

            const slot =
                document.createElement(
                    "div"
                );

            slot.className =
                "prize-slot";

            slot.style.animationDelay =
                `${index * .12}s`;


            const img =
                document.createElement(
                    "img"
                );

            img.className =
                "prize";

            img.src = src;


            slot.appendChild(img);

            prizes.appendChild(slot);

        }
    );

}


/* =====================================
   随机摆放
===================================== */

document
.getElementById("randomBtn")
.addEventListener(
    "click",
    function(){

        uploadedImages.sort(
            () =>
                Math.random() - .5
        );

        renderUploadList();

        renderPrizes();

        saveData();

    }
);


/* =====================================
   清空
===================================== */

document
.getElementById("clearBtn")
.addEventListener(
    "click",
    function(){

        if(
            !confirm(
                "确定要清空所有娃娃吗？"
            )
        ){
            return;
        }

        uploadedImages = [];

        renderUploadList();

        renderPrizes();

        saveData();

    }
);


/* =====================================
   移动
===================================== */

function moveCrane(amount){

    if(isPlaying){
        return;
    }

    cranePosition += amount;

    cranePosition =
        Math.max(
            12,
            Math.min(
                88,
                cranePosition
            )
        );

    crane.style.left =
        cranePosition + "%";

    slider.style.left =
        cranePosition + "%";

}

leftBtn.addEventListener(
    "click",
    () => moveCrane(-7)
);

rightBtn.addEventListener(
    "click",
    () => moveCrane(7)
);


/* =====================================
   ★★★ 抓取 ★★★
===================================== */

async function grab(){

    if(isPlaying){
        return;
    }


    if(
        uploadedImages.length === 0
    ){

        resultTitle.textContent =
            "还没有娃娃哦 ♡";

        resultText.textContent =
            "先上传一些喜欢的图片吧！";

        successIcon.textContent =
            "🧸";

        successModal.classList.add(
            "show"
        );

        return;
    }


    isPlaying = true;

    grabBtn.disabled = true;

    leftBtn.disabled = true;

    rightBtn.disabled = true;


    /*
       ★ 先随机决定这次抓哪个
    */

    const grabbedIndex =
        Math.floor(
            Math.random() *
            uploadedImages.length
        );

    const grabbedSrc =
        uploadedImages[
            grabbedIndex
        ];


    /*
       ★ 把图片放进爪子
    */

    grabbedImage.src =
        grabbedSrc;

    grabbedItem.classList.remove(
        "show"
    );


    /*
       ① 爪子下降
    */

    crane.classList.add(
        "dropping"
    );

    await wait(700);


    /*
       ② 两爪闭合
    */

    claw.classList.add(
        "closed"
    );

    await wait(450);


    /*
       ③ 图片被抓住
       这里开始显示
    */

    grabbedItem.classList.add(
        "show"
    );

    crane.classList.add(
        "grabbing"
    );

    await wait(350);


    /*
       ④ 开始上升
    */

    crane.classList.remove(
        "dropping"
    );

    await wait(900);


    /*
       ⑤ 判断是否成功
    */

    let rate =
        parseInt(
            successRate.value,
            10
        );

    if(
        isNaN(rate)
    ){
        rate = 70;
    }

    rate =
        Math.max(
            1,
            Math.min(
                100,
                rate
            )
        );


    const success =
        Math.random() * 100 < rate;


    /*
       ★ 成功
    */

    if(success){

        /*
           奖品从机器里消失
        */

        uploadedImages.splice(
            grabbedIndex,
            1
        );

        renderUploadList();

        renderPrizes();

        saveData();


        resultTitle.textContent =
            successInput.value ||
            "抓取成功啦！♡";

        resultText.textContent =
            "恭喜你抓到了一个喜欢的娃娃！";

        successIcon.textContent =
            "🧸";

        successModal.classList.add(
            "show"
        );


        if(
            effectSwitch.checked
        ){

            createSparkles();

        }

    }


    /*
       ★ 失败
    */

    else{

        resultTitle.textContent =
            "差一点点！";

        resultText.textContent =
            failInput.value ||
            "再试一次吧！";

        successIcon.textContent =
            "🥺";

        successModal.classList.add(
            "show"
        );

    }


    /*
       ⑥ 清除抓住的图片
    */

    await wait(350);

    crane.classList.remove(
        "grabbing"
    );

    claw.classList.remove(
        "closed"
    );

    grabbedItem.classList.remove(
        "show"
    );


    grabbedImage.src = "";


    /*
       ⑦ 恢复操作
    */

    await wait(300);

    isPlaying = false;

    grabBtn.disabled = false;

    leftBtn.disabled = false;

    rightBtn.disabled = false;

}


/* =====================================
   抓取按钮
===================================== */

grabBtn.addEventListener(
    "click",
    grab
);


/* =====================================
   等待
===================================== */

function wait(ms){

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


/* =====================================
   弹窗
===================================== */

closeModal.addEventListener(
    "click",
    function(){

        successModal.classList.remove(
            "show"
        );

    }
);

successModal.addEventListener(
    "click",
    function(event){

        if(
            event.target ===
            successModal
        ){

            successModal.classList.remove(
                "show"
            );

        }

    }
);


/* =====================================
   成功特效
===================================== */

function createSparkles(){

    const symbols = [
        "✦",
        "✧",
        "♡",
        "⋆",
        "✿"
    ];


    for(
        let i=0;
        i<14;
        i++
    ){

        const sparkle =
            document.createElement(
                "div"
            );

        sparkle.className =
            "sparkle";

        sparkle.textContent =
            symbols[
                Math.floor(
                    Math.random() *
                    symbols.length
                )
            ];

        sparkle.style.left =
            Math.random() *
            100 +
            "vw";

        sparkle.style.top =
            Math.random() *
            100 +
            "vh";

        sparkle.style.fontSize =
            (
                12 +
                Math.random()*18
            ) +
            "px";

        document.body.appendChild(
            sparkle
        );

        setTimeout(
            () =>
                sparkle.remove(),
            850
        );

    }

}


/* =====================================
   颜色
===================================== */

document
.querySelectorAll(".color-btn")
.forEach(button => {

    button.addEventListener(
        "click",
        function(){

            const color =
                button.dataset.color;

            setMachineColor(color);

            document
            .querySelectorAll(
                ".color-btn"
            )
            .forEach(btn =>
                btn.classList.remove(
                    "active"
                )
            );

            button.classList.add(
                "active"
            );

            customColor.value =
                color;

            saveData();

        }
    );

});


customColor.addEventListener(
    "input",
    function(){

        setMachineColor(
            customColor.value
        );

        saveData();

    }
);


function setMachineColor(color){

    document.documentElement
    .style
    .setProperty(
        "--machine-color",
        color
    );

    document.documentElement
    .style
    .setProperty(
        "--machine-dark",
        shadeColor(
            color,
            -12
        )
    );

}


function shadeColor(
    color,
    percent
){

    let num =
        parseInt(
            color.replace("#",""),
            16
        );

    let r =
        (num >> 16) +
        percent;

    let g =
        ((num >> 8) & 255) +
        percent;

    let b =
        (num & 255) +
        percent;

    r =
        Math.max(
            0,
            Math.min(
                255,
                r
            )
        );

    g =
        Math.max(
            0,
            Math.min(
                255,
                g
            )
        );

    b =
        Math.max(
            0,
            Math.min(
                255,
                b
            )
        );

    return "#" +
        (
            0x1000000 +
            (r << 16) +
            (g << 8) +
            b
        )
        .toString(16)
        .slice(1);

}


/* =====================================
   形状设置
===================================== */

document
.querySelectorAll(".choice")
.forEach(button => {

    button.addEventListener(
        "click",
        function(){

            document
            .querySelectorAll(
                ".choice"
            )
            .forEach(btn =>
                btn.classList.remove(
                    "active"
                )
            );

            button.classList.add(
                "active"
            );

            /*
               保留原来的形状设置功能
            */

            machine.classList.remove(
                "round",
                "soft"
            );

            const shape =
                button.dataset.shape;

            if(
                shape !== "normal"
            ){

                machine.classList.add(
                    shape
                );

            }

        }
    );

});


/* =====================================
   文字
===================================== */

titleInput.addEventListener(
    "input",
    function(){

        machineTitle.textContent =
            titleInput.value;

        saveData();

    }
);


exitInput.addEventListener(
    "input",
    function(){

        exitText.textContent =
            exitInput.value;

        saveData();

    }
);


/* =====================================
   保存
===================================== */

function saveData(){

    if(
        !saveSwitch.checked
    ){
        return;
    }

    try{

        localStorage.setItem(
            "myClawImages",
            JSON.stringify(
                uploadedImages
            )
        );

        localStorage.setItem(
            "myClawColor",
            customColor.value
        );

        localStorage.setItem(
            "myClawTitle",
            titleInput.value
        );

        localStorage.setItem(
            "myClawExit",
            exitInput.value
        );

    }catch(error){

        console.log(
            "保存失败",
            error
        );

    }

}


/* =====================================
   读取
===================================== */

function loadData(){

    try{

        const savedImages =
            localStorage.getItem(
                "myClawImages"
            );

        if(savedImages){

            uploadedImages =
                JSON.parse(
                    savedImages
                );

        }


        const savedColor =
            localStorage.getItem(
                "myClawColor"
            );

        if(savedColor){

            customColor.value =
                savedColor;

            setMachineColor(
                savedColor
            );

        }


        const savedTitle =
            localStorage.getItem(
                "myClawTitle"
            );

        if(savedTitle){

            titleInput.value =
                savedTitle;

            machineTitle.textContent =
                savedTitle;

        }


        const savedExit =
            localStorage.getItem(
                "myClawExit"
            );

        if(savedExit){

            exitInput.value =
                savedExit;

            exitText.textContent =
                savedExit;

        }


        renderUploadList();

        renderPrizes();

    }catch(error){

        console.log(
            "读取失败",
            error
        );

    }

}


/* =====================================
   初始化
===================================== */

loadData();

crane.style.left =
    cranePosition + "%";

slider.style.left =
    cranePosition + "%";


/* =====================================
   键盘
===================================== */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "ArrowLeft"
        ){

            moveCrane(-7);

        }

        if(
            event.key === "ArrowRight"
        ){

            moveCrane(7);

        }

        if(
            event.key === " " &&
            document.activeElement.tagName !== "INPUT"
        ){

            event.preventDefault();

            grab();

        }

    }
);

</script>
