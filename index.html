<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>我的小小娃娃机</title>

<style>

/* =========================================================
   基础
========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --pink:#ef91ad;
  --pink-dark:#df718f;
  --pink-light:#fff1f5;

  --text:#51464d;
  --muted:#9b9097;
  --line:#eadde2;

  --page:#faf7f8;
  --white:#ffffff;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "PingFang SC",
    "Microsoft YaHei",
    "Helvetica Neue",
    sans-serif;

  color:var(--text);

  background:
    radial-gradient(
      circle at 10% 10%,
      rgba(255,220,231,.45),
      transparent 28%
    ),
    radial-gradient(
      circle at 90% 20%,
      rgba(225,216,255,.4),
      transparent 28%
    ),
    var(--page);
}


/* =========================================================
   页面
========================================================= */

.page{
  width:min(1160px,92%);
  margin:auto;
}


/* =========================================================
   顶部
========================================================= */

.topbar{
  height:78px;

  display:flex;
  justify-content:space-between;
  align-items:center;

  border-bottom:1px solid var(--line);
}

.logo{
  font-size:14px;
  font-weight:900;
  letter-spacing:2px;
}

.logo span{
  color:var(--pink-dark);
}

.top-info{
  font-size:10px;
  color:var(--muted);
  letter-spacing:2px;
}


/* =========================================================
   主标题
========================================================= */

.hero{
  padding:60px 0 45px;
}

.hero-small{
  color:var(--pink-dark);
  font-size:10px;
  font-weight:900;
  letter-spacing:3px;
  margin-bottom:15px;
}

.hero h1{
  font-size:clamp(42px,7vw,78px);
  line-height:.95;
  letter-spacing:-4px;
  font-weight:900;
}

.hero h1 span{
  color:var(--pink-dark);
}

.hero p{
  max-width:600px;

  margin-top:22px;

  color:var(--muted);

  font-size:13px;
  line-height:1.9;
}


/* =========================================================
   主布局
========================================================= */

.workspace{
  display:grid;

  grid-template-columns:
    350px
    minmax(0,1fr);

  gap:34px;

  align-items:start;
}


/* =========================================================
   编辑器
========================================================= */

.editor{
  background:white;

  border:1px solid var(--line);

  box-shadow:
    0 18px 50px rgba(90,60,72,.08);
}

.editor-header{
  height:62px;

  padding:0 20px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  border-bottom:1px solid var(--line);
}

.editor-title{
  font-size:11px;
  font-weight:900;
  letter-spacing:2px;
}

.save-status{
  display:flex;
  align-items:center;
  gap:7px;

  color:#9c9298;
  font-size:9px;
}

.save-dot{
  width:7px;
  height:7px;

  border-radius:50%;

  background:#8dcc9e;
}


/* =========================================================
   折叠区域
========================================================= */

.edit-section{
  border-bottom:1px solid var(--line);
}

.edit-section:last-child{
  border-bottom:0;
}


/* 可点击标题 */

.section-toggle{
  width:100%;

  min-height:72px;

  padding:16px 20px;

  border:0;
  background:white;

  display:flex;
  align-items:center;

  gap:13px;

  text-align:left;

  cursor:pointer;

  color:var(--text);
}

.section-toggle:hover{
  background:#fffafb;
}


/* 编号 */

.section-number{
  width:28px;
  height:28px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:var(--pink-light);

  color:var(--pink-dark);

  font-size:9px;
  font-weight:900;
}


/* 标题 */

.section-title{
  flex:1;
}

.section-title strong{
  display:block;

  font-size:13px;

  margin-bottom:3px;
}

.section-title span{
  display:block;

  font-size:9px;

  color:#aaa0a6;
}


/* 箭头 */

.section-arrow{
  width:20px;
  height:20px;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#aaa0a6;

  font-size:14px;

  transition:.25s;
}

.edit-section.open
.section-arrow{
  transform:rotate(180deg);
}


/* 内容 */

.section-content{
  max-height:0;

  overflow:hidden;

  padding:0 20px;

  opacity:0;

  transition:
    max-height .35s ease,
    opacity .25s ease,
    padding .35s ease;
}

.edit-section.open
.section-content{
  max-height:900px;

  padding:
    0 20px 22px;

  opacity:1;
}


/* =========================================================
   表单
========================================================= */

.field{
  margin-top:15px;
}

.field:first-child{
  margin-top:0;
}

.field label{
  display:block;

  margin-bottom:7px;

  color:#756b72;

  font-size:9px;
  font-weight:900;

  letter-spacing:1px;
}

input[type="text"],
input[type="number"],
select{
  width:100%;
  height:40px;

  border:1px solid var(--line);

  border-radius:9px;

  background:#fcfafb;

  padding:
    0 11px;

  color:var(--text);

  font-size:11px;

  outline:none;

  transition:.2s;
}

input[type="text"]:focus,
input[type="number"]:focus,
select:focus{
  border-color:var(--pink);

  box-shadow:
    0 0 0 3px
    rgba(239,145,173,.12);
}


/* =========================================================
   上传
========================================================= */

.upload-box{
  display:block;

  border:1px dashed #dfc9d2;

  border-radius:12px;

  padding:19px;

  text-align:center;

  cursor:pointer;

  background:#fffafb;

  transition:.2s;
}

.upload-box:hover{
  border-color:var(--pink);

  background:#fff5f8;
}

.upload-icon{
  font-size:23px;

  margin-bottom:6px;
}

.upload-title{
  font-size:11px;
  font-weight:900;
}

.upload-sub{
  margin-top:5px;

  color:#aaa0a6;

  font-size:9px;

  line-height:1.6;
}

#fileInput{
  display:none;
}


/* =========================================================
   图片列表
========================================================= */

.prize-list{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:7px;

  margin-top:12px;
}

.prize-thumb{
  position:relative;

  width:100%;
  aspect-ratio:1;

  overflow:hidden;

  border:1px solid var(--line);

  border-radius:8px;

  background:#faf6f8;
}

.prize-thumb img{
  width:100%;
  height:100%;

  object-fit:contain;
}

.remove-prize{
  position:absolute;

  top:3px;
  right:3px;

  width:18px;
  height:18px;

  border:0;

  border-radius:50%;

  background:
    rgba(65,50,57,.7);

  color:white;

  cursor:pointer;

  font-size:11px;

  line-height:18px;
}


/* =========================================================
   颜色
========================================================= */

.color-row{
  display:flex;

  flex-wrap:wrap;

  gap:8px;
}

.color-btn{
  width:30px;
  height:30px;

  border:2px solid white;

  border-radius:50%;

  box-shadow:
    0 0 0 1px #ddd2d8;

  cursor:pointer;

  transition:.2s;
}

.color-btn.active{
  transform:scale(1.08);

  box-shadow:
    0 0 0 2px var(--text);
}

.custom-color{
  display:flex;

  align-items:center;

  gap:8px;

  margin-top:10px;

  color:#968c92;

  font-size:9px;
}

#customColor{
  width:42px;
  height:32px;

  padding:2px;

  border:1px solid var(--line);

  border-radius:8px;

  background:white;
}


/* =========================================================
   选择按钮
========================================================= */

.choice-grid{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:7px;
}

.choice{
  height:37px;

  border:1px solid var(--line);

  border-radius:9px;

  background:white;

  color:#8a7f86;

  font-size:9px;

  cursor:pointer;
}

.choice.active{
  border-color:var(--pink-dark);

  background:var(--pink-light);

  color:var(--pink-dark);

  font-weight:900;
}


/* =========================================================
   开关
========================================================= */

.setting-row{
  display:flex;

  justify-content:space-between;
  align-items:center;

  margin-top:14px;
}

.setting-name{
  font-size:10px;

  color:#756b72;
}

.switch{
  position:relative;

  width:39px;
  height:21px;
}

.switch input{
  opacity:0;

  width:0;
  height:0;
}

.slider{
  position:absolute;

  inset:0;

  background:#ddd5d9;

  border-radius:30px;

  cursor:pointer;

  transition:.25s;
}

.slider:before{
  content:"";

  position:absolute;

  width:15px;
  height:15px;

  left:3px;
  top:3px;

  border-radius:50%;

  background:white;

  box-shadow:
    0 1px 4px rgba(0,0,0,.15);

  transition:.25s;
}

.switch input:checked
+ .slider{
  background:var(--pink-dark);
}

.switch input:checked
+ .slider:before{
  transform:translateX(18px);
}


/* =========================================================
   预览
========================================================= */

.preview{
  position:sticky;

  top:20px;
}

.preview-head{
  display:flex;

  justify-content:space-between;
  align-items:center;

  margin-bottom:13px;
}

.preview-title{
  font-size:10px;

  font-weight:900;

  letter-spacing:3px;

  color:#aaa0a6;
}

.preview-ready{
  font-size:9px;

  color:#aaa0a6;
}


/* =========================================================
   娃娃机外层
========================================================= */

.machine-stage{
  padding:32px;

  border-radius:25px;

  background:
    linear-gradient(
      135deg,
      #f4edf0,
      #eee8f2
    );
}


/* =========================================================
   娃娃机
========================================================= */

.machine{
  --machine-color:#ef91ad;

  position:relative;

  width:min(100%,540px);

  height:590px;

  margin:auto;

  overflow:hidden;

  border:
    8px solid var(--machine-color);

  border-radius:
    28px 28px 20px 20px;

  background:
    linear-gradient(
      180deg,
      #fffafa 0%,
      #fff7f9 57%,
      #ead9de 57%,
      #ddc2ca 100%
    );

  box-shadow:
    0 25px 55px
    rgba(80,50,65,.17),

    inset 0 0 0 2px
    rgba(255,255,255,.8);

  transition:.3s;
}

.machine.round{
  border-radius:
    40px 40px 20px 20px;
}

.machine.square{
  border-radius:
    10px;
}


/* =========================================================
   顶部标题
========================================================= */

.machine-title{
  position:absolute;

  top:17px;
  left:50%;

  transform:
    translateX(-50%);

  z-index:8;

  padding:
    7px 18px;

  white-space:nowrap;

  border-radius:30px;

  background:white;

  color:#675b62;

  font-size:9px;

  font-weight:900;

  letter-spacing:1.5px;

  box-shadow:
    0 3px 10px
    rgba(80,50,60,.08);
}


/* =========================================================
   灯
========================================================= */

.lights{
  position:absolute;

  z-index:7;

  top:13px;
  left:20px;
  right:20px;

  display:flex;

  justify-content:space-between;
}

.light{
  width:9px;
  height:9px;

  border-radius:50%;

  background:var(--machine-color);

  box-shadow:
    0 0 0 3px
    rgba(255,255,255,.7),

    0 0 10px
    var(--machine-color);
}


/* =========================================================
   玻璃区域
========================================================= */

.glass{
  position:absolute;

  top:56px;
  left:17px;
  right:17px;

  height:370px;

  overflow:hidden;

  border:
    2px solid
    rgba(255,255,255,.9);

  border-radius:18px;

  background:
    linear-gradient(
      115deg,
      rgba(255,255,255,.4),
      rgba(255,255,255,.08),
      rgba(255,255,255,.22)
    );

  box-shadow:
    inset 0 0 25px
    rgba(255,255,255,.45);
}

.glass:before{
  content:"";

  position:absolute;

  inset:0;

  pointer-events:none;

  background:
    linear-gradient(
      120deg,
      transparent 0 34%,
      rgba(255,255,255,.35) 35%,
      transparent 37%
    );
}


/* =========================================================
   ⭐ 轨道
   保持之前满意的细长感觉
========================================================= */

.rail{
  position:absolute;

  top:22px;

  left:7%;

  width:86%;

  height:9px;

  border-radius:20px;

  background:
    linear-gradient(
      180deg,
      #ffffff,
      #d4ccd0
    );

  box-shadow:
    0 2px 4px
    rgba(70,50,60,.15),

    inset 0 1px 2px
    white;

  z-index:8;
}


/* =========================================================
   ⭐ 小滑块
========================================================= */

.crane{
  position:absolute;

  top:21px;

  left:50%;

  width:54px;

  height:320px;

  transform:
    translateX(-50%);

  z-index:10;

  transition:
    left .35s ease;
}


/* 滑块 */

.crane-head{
  position:absolute;

  top:0;
  left:50%;

  width:42px;
  height:27px;

  transform:
    translateX(-50%);

  border-radius:
    7px 7px 5px 5px;

  background:
    linear-gradient(
      180deg,
      var(--machine-color),
      var(--machine-color)
    );

  box-shadow:
    0 4px 8px
    rgba(80,50,60,.15),

    inset 0 2px 2px
    rgba(255,255,255,.35);
}

.crane-head:after{
  content:"";

  position:absolute;

  left:50%;
  bottom:-4px;

  width:23px;
  height:5px;

  transform:
    translateX(-50%);

  border-radius:5px;

  background:#d1c7cc;
}


/* =========================================================
   ⭐ 绳子
========================================================= */

.cable{
  position:absolute;

  top:25px;
  left:50%;

  width:3px;

  height:45px;

  transform:
    translateX(-50%);

  border-radius:5px;

  background:
    linear-gradient(
      90deg,
      #978d93,
      #f7f4f5,
      #978d93
    );

  transition:
    height .55s ease;
}


/* ⭐ 下降时明显变长 */

.crane.dropping
.cable{
  height:235px;
}


/* =========================================================
   ⭐ 之前的细爪子
========================================================= */

.claw{
  position:absolute;

  top:65px;
  left:50%;

  width:50px;
  height:50px;

  transform:
    translateX(-50%);

  transition:
    top .55s ease;
}


/* 下降 */

.crane.dropping
.claw{
  top:250px;
}


/* 中心 */

.joint{
  position:absolute;

  top:2px;
  left:50%;

  width:12px;
  height:12px;

  transform:
    translateX(-50%);

  border-radius:50%;

  background:#999096;

  border:
    2px solid white;

  z-index:3;
}


/* 爪臂 */

.arm{
  position:absolute;

  top:9px;
  left:50%;

  width:5px;
  height:38px;

  border-radius:8px;

  background:
    linear-gradient(
      90deg,
      #a49a9f,
      #eee9eb,
      #958b91
    );

  transform-origin:
    top center;

  transition:
    transform .3s ease;
}


/* 打开 */

.arm.left1{
  transform:
    translateX(-50%)
    rotate(27deg);
}

.arm.left2{
  transform:
    translateX(-50%)
    rotate(47deg);
}

.arm.right1{
  transform:
    translateX(-50%)
    rotate(-27deg);
}

.arm.right2{
  transform:
    translateX(-50%)
    rotate(-47deg);
}


/* 合上 */

.claw.closed
.left1{
  transform:
    translateX(-50%)
    rotate(13deg);
}

.claw.closed
.left2{
  transform:
    translateX(-50%)
    rotate(30deg);
}

.claw.closed
.right1{
  transform:
    translateX(-50%)
    rotate(-13deg);
}

.claw.closed
.right2{
  transform:
    translateX(-50%)
    rotate(-30deg);
}


/* =========================================================
   奖品
========================================================= */

.prizes{
  position:absolute;

  left:24px;
  right:24px;

  bottom:17px;

  height:170px;

  display:flex;

  align-items:flex-end;

  justify-content:center;

  flex-wrap:wrap;

  gap:8px;

  overflow:hidden;
}

.prize{
  width:74px;
  height:74px;

  flex:none;

  padding:4px;

  border-radius:11px;

  background:
    rgba(255,255,255,.9);

  box-shadow:
    0 5px 10px
    rgba(70,50,60,.12);

  transition:.3s;
}

.prize img{
  width:100%;
  height:100%;

  /*
     ⭐ 保持图片原本比例
     不裁切、不变圆
  */

  object-fit:contain;

  border-radius:7px;
}


/* =========================================================
   底部
========================================================= */

.machine-bottom{
  position:absolute;

  left:0;
  right:0;
  bottom:0;

  height:128px;

  border-top:
    2px solid
    rgba(255,255,255,.55);

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.05),
      rgba(120,90,105,.13)
    );
}


/* 出口 */

.exit{
  position:absolute;

  top:24px;
  left:50%;

  width:150px;
  height:56px;

  transform:
    translateX(-50%);

  display:flex;
  align-items:center;
  justify-content:center;

  border:
    4px solid
    rgba(90,70,80,.17);

  border-radius:13px;

  background:#faf5f6;

  box-shadow:
    inset 0 4px 8px
    rgba(70,50,60,.08),

    0 4px 8px
    rgba(70,50,60,.1);

  color:#786c73;

  font-size:10px;

  letter-spacing:2px;

  font-weight:900;
}


/* =========================================================
   操作按钮
========================================================= */

.actions{
  display:grid;

  grid-template-columns:
    1fr 1.3fr 1fr;

  gap:8px;

  margin-top:14px;
}

.action{
  height:46px;

  border:
    1px solid
    var(--line);

  border-radius:11px;

  background:white;

  color:#756a71;

  font-size:10px;

  font-weight:900;

  cursor:pointer;

  transition:.2s;
}

.action:hover{
  border-color:var(--pink);

  color:var(--pink-dark);

  transform:translateY(-1px);
}

.action.primary{
  background:var(--pink-dark);

  border-color:var(--pink-dark);

  color:white;

  box-shadow:
    0 8px 18px
    rgba(223,113,143,.22);
}

.action:disabled{
  opacity:.45;

  cursor:not-allowed;

  transform:none;
}


/* =========================================================
   底部
========================================================= */

.footer{
  padding:42px 0 32px;

  display:flex;

  justify-content:space-between;

  color:#aaa0a6;

  font-size:9px;

  letter-spacing:2px;
}


/* =========================================================
   成功弹窗
========================================================= */

.result-overlay{
  position:fixed;

  inset:0;

  z-index:100;

  display:none;

  align-items:center;
  justify-content:center;

  padding:20px;

  background:
    rgba(55,40,48,.36);

  backdrop-filter:
    blur(8px);
}

.result-overlay.show{
  display:flex;
}

.result{
  width:min(370px,100%);

  padding:30px;

  text-align:center;

  border-radius:23px;

  background:white;

  box-shadow:
    0 30px 80px
    rgba(40,25,35,.2);

  animation:
    resultPop .3s ease;
}

@keyframes resultPop{

  from{
    opacity:0;

    transform:
      scale(.92)
      translateY(15px);
  }

  to{
    opacity:1;

    transform:
      scale(1)
      translateY(0);
  }

}

.result-icon{
  width:64px;
  height:64px;

  display:flex;
  align-items:center;
  justify-content:center;

  margin:
    0 auto 14px;

  border-radius:50%;

  background:var(--pink-light);

  color:var(--pink-dark);

  font-size:29px;
}

.result h3{
  font-size:22px;
}

.result p{
  margin-top:7px;

  color:#9a9096;

  font-size:11px;

  line-height:1.7;
}

.result img{
  width:140px;
  height:140px;

  display:block;

  margin:
    20px auto;

  object-fit:contain;

  border-radius:12px;

  background:#faf6f8;
}

.result button{
  width:100%;
  height:44px;

  border:0;

  border-radius:11px;

  background:var(--pink-dark);

  color:white;

  font-size:11px;

  font-weight:900;

  cursor:pointer;
}


/* =========================================================
   闪光
========================================================= */

.sparkles{
  position:absolute;

  inset:0;

  overflow:hidden;

  pointer-events:none;
}

.sparkle{
  position:absolute;

  color:white;

  font-size:20px;

  animation:
    sparkleFloat 1.5s ease forwards;
}

@keyframes sparkleFloat{

  0%{
    opacity:0;

    transform:
      translateY(20px)
      scale(.5)
      rotate(0);
  }

  30%{
    opacity:1;
  }

  100%{
    opacity:0;

  }

}

<script>

/* =========================================================
   数据
========================================================= */

let prizes = [];

let position = 50;

let busy = false;

let currentColor = "#ef91ad";

let currentShape = "soft";


/* =========================================================
   获取元素
========================================================= */

const fileInput =
  document.getElementById(
    "fileInput"
  );

const prizeList =
  document.getElementById(
    "prizeList"
  );

const prizesBox =
  document.getElementById(
    "prizes"
  );

const machine =
  document.getElementById(
    "machine"
  );

const crane =
  document.getElementById(
    "crane"
  );

const claw =
  document.getElementById(
    "claw"
  );

const grabBtn =
  document.getElementById(
    "grabBtn"
  );

const moveLeft =
  document.getElementById(
    "moveLeft"
  );

const moveRight =
  document.getElementById(
    "moveRight"
  );

const resultOverlay =
  document.getElementById(
    "resultOverlay"
  );

const resultIcon =
  document.getElementById(
    "resultIcon"
  );

const resultTitle =
  document.getElementById(
    "resultTitle"
  );

const resultMessage =
  document.getElementById(
    "resultMessage"
  );

const resultImage =
  document.getElementById(
    "resultImage"
  );

const closeResult =
  document.getElementById(
    "closeResult"
  );

const sparkles =
  document.getElementById(
    "sparkles"
  );


/* =========================================================
   折叠 / 展开编辑区域
========================================================= */

document
  .querySelectorAll(
    ".section-toggle"
  )
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        const section =
          button.closest(
            ".edit-section"
          );

        section.classList.toggle(
          "open"
        );

      }
    );

  });


/* =========================================================
   保存设置
========================================================= */

function saveSettings(){

  const autoSave =
    document.getElementById(
      "autoSave"
    );

  if(
    autoSave &&
    !autoSave.checked
  ){
    return;
  }


  const settings = {

    color:
      currentColor,

    shape:
      currentShape,

    title:
      document.getElementById(
        "machineTitle"
      ).value,

    exit:
      document.getElementById(
        "exitText"
      ).value,

    success:
      document.getElementById(
        "successText"
      ).value,

    fail:
      document.getElementById(
        "failText"
      ).value,

    rate:
      document.getElementById(
        "successRate"
      ).value,

    successEffect:
      document.getElementById(
        "successEffect"
      ).checked,

    sparkle:
      document.getElementById(
        "sparkleEffect"
      ).checked,

    bg:
      document.getElementById(
        "machineBg"
      ).value

  };


  localStorage.setItem(
    "littleClawSettings",
    JSON.stringify(settings)
  );

}


/* =========================================================
   读取设置
========================================================= */

function loadSettings(){

  try{

    const saved =
      localStorage.getItem(
        "littleClawSettings"
      );

    if(!saved){
      return;
    }

    const data =
      JSON.parse(saved);


    if(data.color){

      applyColor(
        data.color,
        false
      );

    }


    if(data.shape){

      applyShape(
        data.shape,
        false
      );

    }


    if(data.title){

      document.getElementById(
        "machineTitle"
      ).value =
        data.title;

      updateTitle(
        data.title
      );

    }


    if(data.exit){

      document.getElementById(
        "exitText"
      ).value =
        data.exit;

      updateExit(
        data.exit
      );

    }


    if(data.success){

      document.getElementById(
        "successText"
      ).value =
        data.success;

    }


    if(data.fail){

      document.getElementById(
        "failText"
      ).value =
        data.fail;

    }


    if(data.rate){

      document.getElementById(
        "successRate"
      ).value =
        data.rate;

    }


    if(
      typeof data.successEffect
      !== "undefined"
    ){

      document.getElementById(
        "successEffect"
      ).checked =
        data.successEffect;

    }


    if(
      typeof data.sparkle
      !== "undefined"
    ){

      document.getElementById(
        "sparkleEffect"
      ).checked =
        data.sparkle;

    }


    if(data.bg){

      document.getElementById(
        "machineBg"
      ).value =
        data.bg;

      applyBackground(
        data.bg
      );

    }

  }catch(error){

    console.log(
      "无法读取设置"
    );

  }

}


/* =========================================================
   颜色
========================================================= */

function applyColor(
  color,
  save = true
){

  currentColor =
    color;

  machine.style.setProperty(
    "--machine-color",
    color
  );

  document.documentElement.style.setProperty(
    "--pink",
    color
  );

  document.documentElement.style.setProperty(
    "--pink-dark",
    color
  );


  document
    .querySelectorAll(
      ".color-btn"
    )
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.color === color
      );

    });


  document.getElementById(
    "customColor"
  ).value =
    color;


  if(save){

    saveSettings();

  }

}


/* 预设颜色 */

document
  .querySelectorAll(
    ".color-btn"
  )
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        applyColor(
          button.dataset.color
        );

      }
    );

  });


/* 自定义颜色 */

document
  .getElementById(
    "customColor"
  )
  .addEventListener(
    "input",
    event => {

      applyColor(
        event.target.value
      );

    }
  );


/* =========================================================
   形状
========================================================= */

function applyShape(
  shape,
  save = true
){

  currentShape =
    shape;

  machine.classList.remove(
    "soft",
    "round",
    "square"
  );


  if(shape === "soft"){

    machine.classList.add(
      "soft"
    );

  }


  if(shape === "round"){

    machine.classList.add(
      "round"
    );

  }


  if(shape === "square"){

    machine.classList.add(
      "square"
    );

  }


  document
    .querySelectorAll(
      "[data-shape]"
    )
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.shape === shape
      );

    });


  if(save){

    saveSettings();

  }

}


document
  .querySelectorAll(
    "[data-shape]"
  )
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        applyShape(
          button.dataset.shape
        );

      }
    );

  });


/* =========================================================
   背景
========================================================= */

function applyBackground(
  value
){

  if(value === "pink"){

    machine.style.background =
      `
      linear-gradient(
        180deg,
        #fffafa 0%,
        #fff7f9 57%,
        #ead9de 57%,
        #ddc2ca 100%
      )
      `;

  }


  if(value === "purple"){

    machine.style.background =
      `
      linear-gradient(
        180deg,
        #fcfaff 0%,
        #f5f0ff 57%,
        #dfd4eb 57%,
        #cbbdd9 100%
      )
      `;

  }


  if(value === "cream"){

    machine.style.background =
      `
      linear-gradient(
        180deg,
        #fffefa 0%,
        #fff9e9 57%,
        #eadfc9 57%,
        #d9c9ad 100%
      )
      `;

  }


  if(value === "blue"){

    machine.style.background =
      `
      linear-gradient(
        180deg,
        #faffff 0%,
        #eefaff 57%,
        #d4e7ef 57%,
        #bfd5df 100%
      )
      `;

  }

}


document
  .getElementById(
    "machineBg"
  )
  .addEventListener(
    "change",
    event => {

      applyBackground(
        event.target.value
      );

      saveSettings();

    }
  );


/* =========================================================
   文字
========================================================= */

function updateTitle(
  value
){

  document.getElementById(
    "machineTitlePreview"
  ).textContent =
    value ||
    "✦ 我的小小娃娃机 ✦";

}


function updateExit(
  value
){

  document.getElementById(
    "exitTextPreview"
  ).textContent =
    value ||
    "抓住我！";

}


document
  .getElementById(
    "machineTitle"
  )
  .addEventListener(
    "input",
    event => {

      updateTitle(
        event.target.value
      );

      saveSettings();

    }
  );


document
  .getElementById(
    "exitText"
  )
  .addEventListener(
    "input",
    event => {

      updateExit(
        event.target.value
      );

      saveSettings();

    }
  );


[
  "successText",
  "failText",
  "successRate"
].forEach(id => {

  document
    .getElementById(id)
    .addEventListener(
      "input",
      saveSettings
    );

});


[
  "successEffect",
  "sparkleEffect",
  "autoSave"
].forEach(id => {

  document
    .getElementById(id)
    .addEventListener(
      "change",
      saveSettings
    );

});


/* =========================================================
   上传图片
========================================================= */

fileInput.addEventListener(
  "change",
  event => {

    const files =
      Array.from(
        event.target.files
      );


    files.forEach(
      file => {

        if(
          !file.type.startsWith(
            "image/"
          )
        ){

          return;

        }


        const reader =
          new FileReader();


        reader.onload =
          loadEvent => {

            prizes.push(
              loadEvent.target.result
            );

            renderPrizes();

          };


        reader.readAsDataURL(
          file
        );

      }
    );


    fileInput.value =
      "";

  }
);


/* =========================================================
   显示奖品
========================================================= */

function renderPrizes(){

  prizeList.innerHTML =
    "";

  prizesBox.innerHTML =
    "";


  prizes.forEach(
    (src,index) => {


      /* 编辑器里的缩略图 */

      const thumb =
        document.createElement(
          "div"
        );

      thumb.className =
        "prize-thumb";


      const image =
        document.createElement(
          "img"
        );

      image.src =
        src;


      const remove =
        document.createElement(
          "button"
        );

      remove.className =
        "remove-prize";

      remove.textContent =
        "×";


      remove.addEventListener(
        "click",
        () => {

          prizes.splice(
            index,
            1
          );

          renderPrizes();

        }
      );


      thumb.appendChild(
        image
      );

      thumb.appendChild(
        remove
      );

      prizeList.appendChild(
        thumb
      );


      /* 娃娃机里的奖品 */

      const prize =
        document.createElement(
          "div"
        );

      prize.className =
        "prize";


      const machineImage =
        document.createElement(
          "img"
        );

      machineImage.src =
        src;


      prize.appendChild(
        machineImage
      );

      prizesBox.appendChild(
        prize
      );

    }
  );

}


/* =========================================================
   左右移动
========================================================= */

function updateCrane(){

  crane.style.left =
    position + "%";

}


function move(
  amount
){

  if(busy){
    return;
  }


  position +=
    amount;


  position =
    Math.max(
      13,
      Math.min(
        87,
        position
      )
    );


  updateCrane();

}


moveLeft.addEventListener(
  "click",
  () => {

    move(-8);

  }
);


moveRight.addEventListener(
  "click",
  () => {

    move(8);

  }
);


/* =========================================================
   开始抓取
========================================================= */

grabBtn.addEventListener(
  "click",
  grab
);


function grab(){

  if(busy){
    return;
  }


  if(prizes.length === 0){

    showEmpty();

    return;

  }


  busy =
    true;


  grabBtn.disabled =
    true;

  moveLeft.disabled =
    true;

  moveRight.disabled =
    true;


  /* =========================================
     下降
  ========================================= */

  crane.classList.add(
    "dropping"
  );


  /* =========================================
     爪子合拢
  ========================================= */

  setTimeout(
    () => {

      claw.classList.add(
        "closed"
      );

    },
    650
  );


  /* =========================================
     上升
  ========================================= */

  setTimeout(
    () => {

      crane.classList.remove(
        "dropping"
      );

    },
    1350
  );


  /* =========================================
     判定
  ========================================= */

  setTimeout(
    () => {

      let rate =
        Number(
          document.getElementById(
            "successRate"
          ).value
        );


      if(
        isNaN(rate)
      ){

        rate =
          65;

      }


      rate =
        Math.max(
          1,
          Math.min(
            100,
            rate
          )
        );


      const success =
        Math.random() * 100 <
        rate;


      if(success){

        const index =
          Math.floor(
            Math.random() *
            prizes.length
          );


        const prize =
          prizes[index];


        prizes.splice(
          index,
          1
        );


        renderPrizes();


        showSuccess(
          prize
        );

      }else{

        showFail();

      }

    },
    2000
  );

}


/* =========================================================
   成功
========================================================= */

function showSuccess(
  image
){

  resultIcon.textContent =
    "♡";


  resultTitle.textContent =
    document.getElementById(
      "successText"
    ).value ||
    "抓到了！";


  resultMessage.textContent =
    "恭喜你抓到了喜欢的奖品 ♡";


  resultImage.src =
    image;


  resultImage.style.display =
    "block";


  resultOverlay.classList.add(
    "show"
  );


  if(
    document.getElementById(
      "successEffect"
    ).checked
  ){

    createSparkles();

  }

}


/* =========================================================
   失败
========================================================= */

function showFail(){

  resultIcon.textContent =
    "♡";


  resultTitle.textContent =
    document.getElementById(
      "failText"
    ).value ||
    "再试一次 ♡";


  resultMessage.textContent =
    "差一点点，再来一次吧。";


  resultImage.style.display =
    "none";


  resultOverlay.classList.add(
    "show"
  );

}


/* =========================================================
   没有奖品
========================================================= */

function showEmpty(){

  resultIcon.textContent =
    "♡";


  resultTitle.textContent =
    "没有奖品啦";


  resultMessage.textContent =
    "先上传一些喜欢的图片吧。";


  resultImage.style.display =
    "none";


  resultOverlay.classList.add(
    "show"
  );

}


/* =========================================================
   闪光
========================================================= */

function createSparkles(){

  sparkles.innerHTML =
    "";


  const symbols =
    [
      "✦",
      "♡",
      "✧",
      "⋆",
      "✿"
    ];


  for(
    let i=0;
    i<16;
    i++
  ){

    const sparkle =
      document.createElement(
        "span"
      );


    sparkle.className =
      "sparkle";


    sparkle.textContent =
      symbols[
        Math.floor(
          Math.random() *
          symbols.length
        )
      ];


    sparkle.style.left =
      Math.random() *
      100 +
      "%";


    sparkle.style.top =
      45 +
      Math.random() *
      40 +
      "%";


    sparkle.style.animationDelay =
      Math.random() *
      .5 +
      "s";


    sparkles.appendChild(
      sparkle
    );

  }

}


/* =========================================================
   关闭结果
========================================================= */

function closeModal(){

  resultOverlay.classList.remove(
    "show"
  );


  claw.classList.remove(
    "closed"
  );


  busy =
    false;


  grabBtn.disabled =
    false;


  moveLeft.disabled =
    false;


  moveRight.disabled =
    false;

}


closeResult.addEventListener(
  "click",
  closeModal
);


resultOverlay.addEventListener(
  "click",
  event => {

    if(
      event.target ===
      resultOverlay
    ){

      closeModal();

    }

  }
);


/* =========================================================
   键盘操作
========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if(event.key === "ArrowLeft"){

      move(-8);

    }


    if(event.key === "ArrowRight"){

      move(8);

    }


    if(event.key === " "){

      event.preventDefault();

      grab();

    }

  }
);


/* =========================================================
   初始化
========================================================= */

loadSettings();

updateCrane();

renderPrizes();

</script>

</body>
</html>
