<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>我的小小娃娃机 ♡</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --machine-color:#e9a9c4;
    --machine-dark:#d989ad;
    --machine-light:#fff8fb;
    --pink:#e98caf;
    --text:#66525b;
}

body{
    min-height:100vh;
    padding:24px 14px 50px;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;

    color:var(--text);

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(255,220,235,.6),
            transparent 28%
        ),
        radial-gradient(
            circle at 90% 20%,
            rgba(225,215,250,.5),
            transparent 28%
        ),
        linear-gradient(
            135deg,
            #fff5f8,
            #faf2f7
        );
}

.page{
    width:min(1100px,100%);
    margin:auto;
}


/* =========================
   页面标题
========================= */

.page-title{
    text-align:center;
    margin-bottom:24px;
}

.page-title h1{
    font-size:30px;
    color:#745965;
    letter-spacing:1px;
    text-shadow:0 2px 0 white;
}

.page-title p{
    margin-top:7px;
    color:#a1848f;
    font-size:13px;
}


/* =========================
   主体
========================= */

.layout{
    display:grid;
    grid-template-columns:minmax(0,1fr) 330px;
    gap:24px;
    align-items:start;
}

@media(max-width:800px){
    .layout{
        grid-template-columns:1fr;
    }
}


/* =========================
   娃娃机
========================= */

.machine-wrap{
    position:relative;
}

.machine{
    position:relative;

    width:100%;
    max-width:620px;

    margin:auto;

    padding:15px 15px 20px;

    background:
        linear-gradient(
            135deg,
            var(--machine-light),
            #fff
        );

    border:9px solid var(--machine-color);

    border-radius:32px 32px 22px 22px;

    box-shadow:
        0 20px 45px rgba(100,65,85,.17),
        inset 0 2px 0 rgba(255,255,255,.9);

    overflow:hidden;

    transition:
        border-radius .3s ease,
        border-color .3s ease;
}


/* 顶部 */

.machine-top{
    position:relative;

    height:58px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:
        20px
        20px
        11px
        11px;

    background:
        linear-gradient(
            180deg,
            var(--machine-color),
            var(--machine-dark)
        );

    box-shadow:
        inset 0 2px 3px rgba(255,255,255,.4);
}

.machine-title{
    color:white;

    font-size:17px;
    font-weight:900;

    letter-spacing:2px;

    text-shadow:
        0 2px 3px rgba(100,50,70,.2);
}

.lights{
    position:absolute;

    top:7px;
    left:13px;
    right:13px;

    display:flex;
    justify-content:space-between;
}

.light{
    width:7px;
    height:7px;

    border-radius:50%;

    background:white;

    box-shadow:
        0 0 8px rgba(255,255,255,.95);
}


/* =========================
   玻璃
========================= */

.glass{
    position:relative;

    height:390px;

    margin-top:12px;

    overflow:hidden;

    border:4px solid var(--machine-color);

    border-radius:18px;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.8),
            rgba(255,246,250,.96)
        );

    box-shadow:
        inset 0 0 25px rgba(180,130,155,.1);
}


/* 玻璃高光 */

.glass:before{
    content:"";

    position:absolute;

    left:-5%;
    top:0;

    width:38%;
    height:100%;

    transform:skewX(-10deg);

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.42),
            transparent
        );

    pointer-events:none;

    z-index:30;
}


/* =========================
   长滑轨
========================= */

.rail{
    position:absolute;

    top:23px;
    left:7%;

    width:86%;
    height:9px;

    border-radius:20px;

    background:
        linear-gradient(
            180deg,
            #ffffff,
            #d0c9cd
        );

    border:1px solid #c5bdc1;

    box-shadow:
        0 2px 4px rgba(70,50,60,.16),
        inset 0 1px 2px white;

    z-index:8;
}


/* =========================
   小紫色滑块
========================= */

.slider{
    position:absolute;

    top:17px;
    left:50%;

    width:34px;
    height:20px;

    transform:translateX(-50%);

    border-radius:8px;

    background:
        linear-gradient(
            180deg,
            #d7a0c7,
            #a96f9f
        );

    border:2px solid white;

    box-shadow:
        0 3px 7px rgba(90,50,90,.22);

    z-index:9;

    transition:left .35s ease;
}

.slider:after{
    content:"";

    position:absolute;

    left:50%;
    top:4px;

    width:11px;
    height:4px;

    transform:translateX(-50%);

    border-radius:5px;

    background:rgba(255,255,255,.6);
}


/* =========================
   吊机
========================= */

.crane{
    position:absolute;

    top:21px;
    left:50%;

    width:54px;
    height:320px;

    transform:translateX(-50%);

    z-index:12;

    transition:left .35s ease;
}


/* 吊机头 */

.crane-head{
    position:absolute;

    top:0;
    left:50%;

    width:42px;
    height:27px;

    transform:translateX(-50%);

    border-radius:
        7px
        7px
        5px
        5px;

    background:
        linear-gradient(
            180deg,
            var(--machine-color),
            var(--machine-dark)
        );

    box-shadow:
        0 4px 8px rgba(80,50,60,.15),
        inset 0 2px 2px rgba(255,255,255,.35);
}

.crane-head:after{
    content:"";

    position:absolute;

    left:50%;
    bottom:-4px;

    width:23px;
    height:5px;

    transform:translateX(-50%);

    border-radius:5px;

    background:#d1c7cc;
}


/* =========================
   绳索
========================= */

.cable{
    position:absolute;

    top:25px;
    left:50%;

    width:3px;
    height:45px;

    transform:translateX(-50%);

    border-radius:5px;

    background:
        linear-gradient(
            90deg,
            #978d93,
            #f7f4f5,
            #978d93
        );

    transition:
        height .55s ease;

    z-index:4;
}


/* 下降时变长 */

.crane.dropping .cable{
    height:235px;
}


/* =========================
   ★ 两爪
========================= */

.claw{
    position:absolute;

    top:65px;
    left:50%;

    width:56px;
    height:62px;

    transform:translateX(-50%);

    transition:
        top .55s ease;

    z-index:6;
}


/* 下降 */

.crane.dropping .claw{
    top:250px;
}


/* 中间连接球 */

.joint{
    position:absolute;

    top:1px;
    left:50%;

    width:13px;
    height:13px;

    transform:translateX(-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #faf8f9,
            #b9b0b5 55%,
            #817a80
        );

    border:2px solid white;

    box-shadow:
        0 2px 5px rgba(60,45,52,.22);

    z-index:5;
}


/* 两根金属爪 */

.arm{
    position:absolute;

    top:10px;
    left:50%;

    width:6px;
    height:40px;

    transform-origin:
        50% 4px;

    border-radius:
        5px
        5px
        7px
        7px;

    background:
        linear-gradient(
            90deg,
            #898186,
            #faf8f9 48%,
            #91898e
        );

    box-shadow:
        0 2px 3px rgba(70,55,65,.2);

    transition:
        transform .32s ease;

    z-index:3;
}


/* 两个爪子的弯钩 */

.arm:after{
    content:"";

    position:absolute;

    left:50%;
    bottom:-4px;

    width:10px;
    height:13px;

    transform:
        translateX(-50%)
        rotate(28deg);

    border-left:4px solid #8d858a;
    border-bottom:4px solid #8d858a;

    border-radius:
        0 0 0 5px;
}


/* 左爪 */

.claw-left{
    transform:
        translateX(-50%)
        rotate(38deg);
}


/* 右爪 */

.claw-right{
    transform:
        translateX(-50%)
        rotate(-38deg);
}


/* 合爪 */

.claw.closed .claw-left{
    transform:
        translateX(-50%)
        rotate(14deg);
}

.claw.closed .claw-right{
    transform:
        translateX(-50%)
        rotate(-14deg);
}


/* =========================
   奖品
========================= */

.prizes{
    position:absolute;

    left:18px;
    right:18px;
    bottom:25px;

    min-height:130px;

    display:flex;

    align-items:flex-end;
    justify-content:center;

    flex-wrap:wrap;

    gap:10px;

    z-index:3;
}


/*
   图片保持自己的长宽比例
   不会变成圆形
*/

.prize{
    width:88px;
    height:auto;

    max-height:100px;

    object-fit:contain;

    flex:none;

    border-radius:8px;

    background:white;

    box-shadow:
        0 5px 12px rgba(100,70,85,.15);

    animation:
        prizeFloat 2.4s ease-in-out infinite;
}

@keyframes prizeFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-4px);
    }
}


/* 空机器 */

.empty{
    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    color:#b49ca6;

    text-align:center;

    font-size:14px;

    line-height:1.8;

    pointer-events:none;

    z-index:2;
}


/* =========================
   出口
========================= */

.exit{
    position:absolute;

    left:50%;
    bottom:0;

    width:150px;
    height:35px;

    transform:translateX(-50%);

    border-radius:
        15px
        15px
        0
        0;

    background:
        linear-gradient(
            180deg,
            #d2c9ce,
            #a9a0a5
        );

    display:flex;

    align-items:center;
    justify-content:center;

    color:white;

    font-size:11px;
    font-weight:900;

    letter-spacing:2px;

    box-shadow:
        inset 0 2px 3px rgba(255,255,255,.5);
}


/* =========================
   操作按钮
========================= */

.controls{
    display:flex;

    align-items:center;
    justify-content:center;

    gap:10px;

    margin-top:14px;
}

.move-btn,
.grab-btn{
    border:0;

    font-family:inherit;

    cursor:pointer;

    transition:
        transform .15s ease,
        box-shadow .15s ease;
}

.move-btn{
    width:43px;
    height:43px;

    border-radius:13px;

    background:white;

    color:#9d7585;

    box-shadow:
        0 5px 12px rgba(100,70,85,.12);
}

.grab-btn{
    min-width:135px;

    height:46px;

    border-radius:16px;

    color:white;

    font-size:14px;
    font-weight:900;

    background:
        linear-gradient(
            135deg,
            var(--machine-color),
            var(--machine-dark)
        );

    box-shadow:
        0 7px 14px rgba(190,110,145,.2);
}

.move-btn:hover,
.grab-btn:hover{
    transform:translateY(-2px);
}

.move-btn:active,
.grab-btn:active{
    transform:translateY(1px);
}

.grab-btn:disabled{
    opacity:.55;
    cursor:not-allowed;
}


/* =========================
   编辑器
========================= */

.editor{
    background:rgba(255,255,255,.86);

    border-radius:22px;

    padding:14px;

    box-shadow:
        0 12px 30px rgba(110,75,95,.1);

    border:1px solid rgba(255,255,255,.8);
}

.editor-title{
    text-align:center;

    margin:3px 0 13px;

    color:#765d68;

    font-size:17px;
    font-weight:900;
}


/* 编辑器区块 */

.section{
    margin-bottom:9px;

    border-radius:14px;

    background:white;

    overflow:hidden;

    border:1px solid #f1e4e9;
}

.section-head{
    width:100%;

    padding:13px 14px;

    border:0;

    background:white;

    color:#765d68;

    font-family:inherit;

    font-size:13px;
    font-weight:900;

    text-align:left;

    cursor:pointer;

    display:flex;

    justify-content:space-between;
    align-items:center;
}

.section-head span:last-child{
    transition:
        transform .25s ease;
}

.section.open
.section-head
span:last-child{
    transform:rotate(180deg);
}

.section-body{
    display:none;

    padding:
        0
        14px
        14px;
}

.section.open .section-body{
    display:block;
}


/* 输入 */

.label{
    display:block;

    margin:9px 0 6px;

    color:#927b85;

    font-size:11px;
    font-weight:900;
}

input[type="text"],
input[type="number"],
input[type="color"]{
    width:100%;

    height:38px;

    border:1px solid #eadde3;

    border-radius:10px;

    background:white;

    padding:0 10px;

    font-family:inherit;

    color:#6d5962;

    outline:none;
}

input:focus{
    border-color:#dda6bb;
}


/* 上传 */

.upload-label{
    display:flex;

    align-items:center;
    justify-content:center;

    min-height:47px;

    border-radius:12px;

    background:#fff2f7;

    color:#b46785;

    border:1px dashed #e3a5bc;

    cursor:pointer;

    font-size:13px;
    font-weight:900;
}

.upload-label:hover{
    background:#ffedf4;
}

#imageInput{
    display:none;
}

.tip{
    margin-top:8px;

    color:#ae969f;

    font-size:10px;

    line-height:1.6;

    text-align:center;
}


/* 上传图片列表 */

.upload-list{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:7px;

    margin-top:10px;
}

.upload-item{
    position:relative;

    aspect-ratio:1/1;

    overflow:hidden;

    border-radius:10px;

    background:#faf5f7;

    border:1px solid #eee0e6;
}

.upload-item img{
    width:100%;
    height:100%;

    object-fit:contain;
}

.remove-img{
    position:absolute;

    right:3px;
    top:3px;

    width:21px;
    height:21px;

    border:0;

    border-radius:50%;

    background:rgba(80,60,70,.65);

    color:white;

    cursor:pointer;
}


/* 颜色 */

.color-grid{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:7px;
}

.color-btn{
    height:34px;

    border:2px solid transparent;

    border-radius:10px;

    cursor:pointer;
}

.color-btn.active{
    border-color:#6d5962;

    box-shadow:
        0 0 0 2px white inset;
}


/* 机器形状 */

.choice-grid{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:7px;
}

.choice{
    padding:9px 5px;

    border:1px solid #eadde3;

    background:white;

    border-radius:10px;

    color:#806c75;

    cursor:pointer;

    font-family:inherit;

    font-size:11px;
}

.choice.active{
    background:#fff0f5;

    border-color:#dfa5bb;

    color:#ad6580;
}


/* 清空/随机 */

.small-buttons{
    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:7px;

    margin-top:8px;
}

.small-btn{
    height:36px;

    border:0;

    border-radius:10px;

    background:#f8eef3;

    color:#876b77;

    font-family:inherit;

    cursor:pointer;

    font-size:11px;
}

.small-btn:hover{
    background:#f5e4eb;
}


/* 开关 */

.switch-row{
    display:flex;

    justify-content:space-between;
    align-items:center;

    margin-top:11px;

    color:#806c75;

    font-size:11px;
}

.switch{
    position:relative;

    width:42px;
    height:23px;
}

.switch input{
    opacity:0;

    width:0;
    height:0;
}

.switch-track{
    position:absolute;

    inset:0;

    background:#ddd2d7;

    border-radius:20px;

    cursor:pointer;

    transition:.25s;
}

.switch-track:before{
    content:"";

    position:absolute;

    width:17px;
    height:17px;

    left:3px;
    top:3px;

    border-radius:50%;

    background:white;

    transition:.25s;
}

.switch input:checked
+ .switch-track{
    background:#dda0b8;
}

.switch input:checked
+ .switch-track:before{
    transform:translateX(19px);
}


/* =========================
   弹窗
========================= */

.success-modal{
    position:fixed;

    inset:0;

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:rgba(60,40,50,.28);

    backdrop-filter:blur(5px);

    z-index:100;
}

.success-modal.show{
    display:flex;
}

.success-card{
    width:min(330px,100%);

    padding:25px 20px 22px;

    border-radius:25px;

    background:white;

    text-align:center;

    box-shadow:
        0 20px 60px rgba(70,40,55,.25);

    animation:
        modalIn .35s ease;
}

@keyframes modalIn{

    from{
        transform:scale(.8);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }

}

.success-icon{
    width:76px;
    height:76px;

    margin:0 auto 12px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:42px;

    background:#fff0f5;

    box-shadow:
        0 8px 20px rgba(220,140,170,.18);
}

.success-card h2{
    margin:7px 0;

    color:#785d68;

    font-size:21px;
}

.success-card p{
    margin:5px 0 17px;

    color:#a1848f;

    font-size:13px;
}

.close-modal{
    width:100%;

    height:42px;

    border:0;

    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            var(--machine-color),
            var(--machine-dark)
        );

    color:white;

    font-family:inherit;

    font-weight:900;

    cursor:pointer;
}


/* =========================
   闪闪特效
========================= */

.sparkle{
    position:fixed;

    pointer-events:none;

    z-index:150;

    animation:
        sparkle .8s ease forwards;
}

@keyframes sparkle{

    0%{
        transform:
            scale(.3)
            rotate(0deg);

        opacity:1;
    }

    100%{
        transform:
            scale(1.5)
            rotate(90deg);

        opacity:0;
    }
}


/* =========================
   机器形状
========================= */

.machine.round{
    border-radius:42px;
}

.machine.round .glass{
    border-radius:25px;
}

.machine.soft{
    border-radius:36px 36px 22px 22px;
}

.machine.soft .machine-top{
    border-radius:
        23px
        23px
        12px
        12px;
}


/* =========================
   手机
========================= */

@media(max-width:500px){

    body{
        padding:
            15px
            9px
            35px;
    }

    .page-title h1{
        font-size:23px;
    }

    .machine{
        border-width:7px;

        padding:
            10px
            10px
            15px;
    }

    .glass{
        height:360px;
    }

    .prize{
        width:76px;
        max-height:88px;
    }

    .grab-btn{
        min-width:115px;
    }
}

</style>
</head>


<body>

<div class="page">

    <div class="page-title">

        <h1>
            🧸 我的小小娃娃机 ♡
        </h1>

        <p>
            上传你喜欢的图片，开始抓取吧 ✦
        </p>

    </div>


    <div class="layout">


        <!-- =====================
             娃娃机
        ====================== -->

        <div class="machine-wrap">

            <div
                class="machine"
                id="machine"
            >

                <div class="machine-top">

                    <div class="lights">
                        <span class="light"></span>
                        <span class="light"></span>
                        <span class="light"></span>
                        <span class="light"></span>
                        <span class="light"></span>
                        <span class="light"></span>
                        <span class="light"></span>
                    </div>

                    <div
                        class="machine-title"
                        id="machineTitle"
                    >
                        ✦ MY CLAW MACHINE ✦
                    </div>

                </div>


                <div
                    class="glass"
                    id="glass"
                >

                    <!-- 长滑轨 -->

                    <div class="rail"></div>

                    <!-- 小滑块 -->

                    <div
                        class="slider"
                        id="slider"
                    ></div>


                    <!-- 吊机 -->

                    <div
                        class="crane"
                        id="crane"
                    >

                        <div class="crane-head"></div>

                        <div class="cable"></div>


                        <!-- ★ 两爪 -->

                        <div
                            class="claw"
                            id="claw"
                        >

                            <div class="joint"></div>

                            <div
                                class="arm claw-left"
                            ></div>

                            <div
                                class="arm claw-right"
                            ></div>

                        </div>

                    </div>


                    <!-- 奖品 -->

                    <div
                        class="prizes"
                        id="prizes"
                    ></div>


                    <div
                        class="empty"
                        id="empty"
                    >
                        ♡<br>
                        先上传一些娃娃吧
                    </div>


                    <!-- 出口 -->

                    <div
                        class="exit"
                        id="exitText"
                    >
                        PRIZE EXIT
                    </div>

                </div>


                <!-- 操作 -->

                <div class="controls">

                    <button
                        class="move-btn"
                        id="leftBtn"
                    >
                        ◀
                    </button>

                    <button
                        class="grab-btn"
                        id="grabBtn"
                    >
                        ✦ 抓取 ✦
                    </button>

                    <button
                        class="move-btn"
                        id="rightBtn"
                    >
                        ▶
                    </button>

                </div>

            </div>

        </div>



        <!-- =====================
             编辑器
        ====================== -->

        <div class="editor">

            <div class="editor-title">
                ♡ 娃娃机设置 ♡
            </div>


            <!-- 奖品 -->

            <div class="section open">

                <button class="section-head">

                    <span>
                        01　我的奖品
                    </span>

                    <span>
                        ⌄
                    </span>

                </button>


                <div class="section-body">

                    <label
                        class="upload-label"
                        for="imageInput"
                    >
                        ＋ 选择图片
                    </label>

                    <input
                        type="file"
                        id="imageInput"
                        accept="image/png,image/jpeg,image/webp"
                        multiple
                    >

                    <div class="tip">
                        可以一次选择多张图片，每次抓取随机抽取
                    </div>

                    <div
                        class="upload-list"
                        id="uploadList"
                    ></div>


                    <div class="small-buttons">

                        <button
                            class="small-btn"
                            id="randomBtn"
                        >
                            🎲 随机摆放
                        </button>

                        <button
                            class="small-btn"
                            id="clearBtn"
                        >
                            🗑 清空
                        </button>

                    </div>

                </div>

            </div>



            <!-- 外观 -->

            <div class="section">

                <button class="section-head">

                    <span>
                        02　娃娃机外观
                    </span>

                    <span>
                        ⌄
                    </span>

                </button>


                <div class="section-body">

                    <label class="label">
                        机器颜色
                    </label>

                    <div class="color-grid">

                        <button
                            class="color-btn active"
                            data-color="#e9a9c4"
                            style="background:#e9a9c4"
                        ></button>

                        <button
                            class="color-btn"
                            data-color="#b9b5df"
                            style="background:#b9b5df"
                        ></button>

                        <button
                            class="color-btn"
                            data-color="#a9d7cf"
                            style="background:#a9d7cf"
                        ></button>

                        <button
                            class="color-btn"
                            data-color="#f0c48c"
                            style="background:#f0c48c"
                        ></button>

                        <button
                            class="color-btn"
                            data-color="#d7b6a8"
                            style="background:#d7b6a8"
                        ></button>

                        <button
                            class="color-btn"
                            data-color="#a9c6e8"
                            style="background:#a9c6e8"
                        ></button>

                    </div>


                    <label class="label">
                        自定义颜色
                    </label>

                    <input
                        type="color"
                        id="customColor"
                        value="#e9a9c4"
                    >


                    <label class="label">
                        机器形状
                    </label>

                    <div class="choice-grid">

                        <button
                            class="choice active"

                        >

                        </button>

                        <button

                        >

                        </button>

                            class="choice"

                        </button>

                    </div>

                </div>

            </div>



            <!-- 文字 -->

            <div class="section">

                <button class="section-head">

                    <span>
                        03　文字设置
                    </span>

                    <span>
                        ⌄
                    </span>

                </button>


                <div class="section-body">

                    <label class="label">
                        机器标题
                    </label>

                    <input

                        value="✦ MY CLAW MACHINE ✦"
                    >


                    <label class="label">
                        出口文字
                    </label>

                    <input
                        type="text"
                        id="exitInput"
                        value="PRIZE EXIT"
                    >


                    <label class="label">
                        成功提示
                    </label>

                    <input
                        type="text"
                        id="successInput"
                        value="抓取成功啦！♡"
                    >


                    <label class="label">
                        失败提示
                    </label>

                    <input
                        type="text"
                        id="failInput"
                        value="差一点点，再试一次吧！"
                    >

                </div>

            </div>



            <!-- 游戏 -->

            <div class="section">

                <button class="section-head">

                    <span>
                        04　游戏设置
                    </span>

                    <span>
                        ⌄
                    </span>

                </button>


                <div class="section-body">

                    <label class="label">
                        抓取成功概率（1～100）
                    </label>

                    <input
                        type="number"
                        id="successRate"
                        value="70"
                        min="1"
                        max="100"
                    >


                    <div class="switch-row">

                        <span>
                            ✨ 成功特效
                        </span>

                        <label class="switch">

                            <input
                                type="checkbox"
                                id="effectSwitch"
                                checked
                            >

                            <span
                                class="switch-track"
                            ></span>

                        </label>

                    </div>


                    <div class="switch-row">

                        <span>
                            💾 自动保存
                        </span>

                        <label class="switch">

                            <input
                                type="checkbox"
                                id="saveSwitch"
                                checked
                            >

                            <span
                                class="switch-track"
                            ></span>

                        </label>

            </div>

        </div>

    </div>

</div>



<!-- =====================
     结果弹窗
====================== -->

<div
    class="success-modal"
    id="successModal"
>

    <div class="success-card">

        <div
            class="success-icon"
            id="successIcon"
        >
            🧸
        </div>

        <h2 id="resultTitle">
            抓取成功啦！♡
        </h2>

        <p id="resultText">
            恭喜你抓到了一个喜欢的娃娃！
        </p>

        <button
            class="close-modal"
            id="closeModal"
        >
            好耶！♡
        </button>

    </div>

</div>



<script>

/* =========================
   元素
========================= */

const machine =
    document.getElementById("machine");

const crane =
    document.getElementById("crane");

const claw =
    document.getElementById("claw");

const slider =
    document.getElementById("slider");

const grabBtn =
    document.getElementById("grabBtn");

const leftBtn =
    document.getElementById("leftBtn");

const rightBtn =
    document.getElementById("rightBtn");

const imageInput =
    document.getElementById("imageInput");

const uploadList =
    document.getElementById("uploadList");

const prizes =
    document.getElementById("prizes");

const empty =
    document.getElementById("empty");

const successModal =
    document.getElementById("successModal");

const closeModal =
    document.getElementById("closeModal");

const resultTitle =
    document.getElementById("resultTitle");

const resultText =
    document.getElementById("resultText");

const successIcon =
    document.getElementById("successIcon");

const titleInput =
    document.getElementById("titleInput");

const exitInput =
    document.getElementById("exitInput");

const successInput =
    document.getElementById("successInput");

const failInput =
    document.getElementById("failInput");

const machineTitle =
    document.getElementById("machineTitle");

const exitText =
    document.getElementById("exitText");

const successRate =
    document.getElementById("successRate");

const effectSwitch =
    document.getElementById("effectSwitch");

const saveSwitch =
    document.getElementById("saveSwitch");

const customColor =
    document.getElementById("customColor");


/* =========================
   数据
========================= */

let uploadedImages = [];

let cranePosition = 50;

let isPlaying = false;


/* =========================
   折叠
========================= */

document
.querySelectorAll(".section-head")
.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            const section =
                button.parentElement;

            section.classList.toggle(
                "open"
            );

        }
    );

});


/* =========================
   上传
========================= */

imageInput.addEventListener(
    "change",
    event => {

        const files =
            Array.from(
                event.target.files
            );

        files.forEach(file => {

            if(
                !file.type.startsWith(
                    "image/"
                )
            ){
                return;
            }

            const reader =
                new FileReader();

            reader.onload = e => {

                uploadedImages.push(
                    e.target.result
                );

                renderUploadList();

                renderPrizes();

                saveData();

            };

            reader.readAsDataURL(file);

        });

        imageInput.value = "";

    }
);


/* =========================
   上传列表
========================= */

function renderUploadList(){

    uploadList.innerHTML = "";

    uploadedImages.forEach(
        (src,index) => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "upload-item";

            item.innerHTML = `

                <img src="${src}">

                <button
                    class="remove-img"
                    data-index="${index}"
                >
                    ×
                </button>

            `;

            uploadList.appendChild(
                item
            );

        }
    );


    document
    .querySelectorAll(".remove-img")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                const index =
                    Number(
                        button.dataset.index
                    );

                uploadedImages.splice(
                    index,
                    1
                );

                renderUploadList();

                renderPrizes();

                saveData();

            }
        );

    });

}


/* =========================
   奖品显示
========================= */

function renderPrizes(){

    prizes.innerHTML = "";

    if(
        uploadedImages.length === 0
    ){

        empty.style.display =
            "block";

        return;

    }

    empty.style.display =
        "none";


    uploadedImages
    .slice(0,7)
    .forEach(
        (src,index) => {

            const img =
                document.createElement(
                    "img"
                );

            img.className =
                "prize";

            img.src =
                src;

            img.style.animationDelay =
                `${index * .12}s`;

            prizes.appendChild(
                img
            );

        }
    );

}


/* =========================
   随机
========================= */

document
.getElementById("randomBtn")
.addEventListener(
    "click",
    () => {

        uploadedImages.sort(
            () =>
                Math.random() - .5
        );

        renderUploadList();

        renderPrizes();

        saveData();

    }
);


/* =========================
   清空
========================= */

document
.getElementById("clearBtn")
.addEventListener(
    "click",
    () => {

        if(
            !confirm(
                "确定要清空所有娃娃吗？"
            )
        ){
            return;
        }

        uploadedImages = [];

        renderUploadList();

        renderPrizes();

        saveData();

    }
);


/* =========================
   移动
========================= */

function moveCrane(amount){

    if(isPlaying){
        return;
    }

    cranePosition += amount;

    cranePosition =
        Math.max(
            12,
            Math.min(
                88,
                cranePosition
            )
        );

    crane.style.left =
        cranePosition + "%";

    slider.style.left =
        cranePosition + "%";

}

leftBtn.addEventListener(
    "click",
    () => moveCrane(-7)
);

rightBtn.addEventListener(
    "click",
    () => moveCrane(7)
);


/* =========================
   抓取
========================= */

async function grab(){

    if(isPlaying){
        return;
    }

    if(
        uploadedImages.length === 0
    ){

        resultTitle.textContent =
            "还没有娃娃哦 ♡";

        resultText.textContent =
            "先上传一些喜欢的图片吧！";

        successIcon.textContent =
            "🧸";

        successModal.classList.add(
            "show"
        );

        return;

    }


    isPlaying = true;

    grabBtn.disabled = true;


    /* 下落 */

    crane.classList.add(
        "dropping"
    );

    await wait(650);


    /* 两爪合拢 */

    claw.classList.add(
        "closed"
    );

    await wait(450);


    await wait(250);


    /* 上升 */

    crane.classList.remove(
        "dropping"
    );

    await wait(700);


    /* 判断成功 */

    let rate =
        Number(
            successRate.value
        );

    if(
        Number.isNaN(rate)
    ){
        rate = 70;
    }

    rate =
        Math.max(
            1,
            Math.min(
                100,
                rate
            )
        );


    const success =
        Math.random() * 100 <
        rate;


    if(success){

        showSuccess();

    }else{

        showFail();

    }


    await wait(500);


    claw.classList.remove(
        "closed"
    );

    isPlaying = false;

    grabBtn.disabled = false;

}


/* =========================
   抓取按钮
========================= */

grabBtn.addEventListener(
    "click",
    grab
);


/* =========================
   成功
========================= */

function showSuccess(){

    resultTitle.textContent =
        successInput.value ||
        "抓取成功啦！♡";

    resultText.textContent =
        "恭喜你抓到了一个喜欢的娃娃！";

    successIcon.textContent =
        "🧸";

    successModal.classList.add(
        "show"
    );


    /*
       成功后随机拿掉一个奖品
    */

    if(
        uploadedImages.length > 0
    ){

        const index =
            Math.floor(
                Math.random() *
                uploadedImages.length
            );

        uploadedImages.splice(
            index,
            1
        );

        renderUploadList();

        renderPrizes();

        saveData();

    }


    if(
        effectSwitch.checked
    ){

        createSparkles();

    }

}


/* =========================
   失败
========================= */

function showFail(){

    resultTitle.textContent =
        "差一点点！";

    resultText.textContent =
        failInput.value ||
        "再试一次吧！";

    successIcon.textContent =
        "🥺";

    successModal.classList.add(
        "show"
    );

}


/* =========================
   关闭弹窗
========================= */

closeModal.addEventListener(
    "click",
    () => {

        successModal.classList.remove(
            "show"
        );

    }
);


successModal.addEventListener(
    "click",
    event => {

        if(
            event.target ===
            successModal
        ){

            successModal.classList.remove(
                "show"
            );

        }

    }
);


/* =========================
   闪闪
========================= */

function createSparkles(){

    const symbols = [
        "✦",
        "✧",
        "♡",
        "⋆",
        "✿"
    ];

    for(
        let i=0;
        i<14;
        i++
    ){

        const sparkle =
            document.createElement(
                "div"
            );

        sparkle.className =
            "sparkle";

        sparkle.textContent =
            symbols[
                Math.floor(
                    Math.random() *
                    symbols.length
                )
            ];

        sparkle.style.left =
            Math.random() * 100 +
            "vw";

        sparkle.style.top =
            Math.random() * 100 +
            "vh";

        sparkle.style.fontSize =
            (
                12 +
                Math.random()*18
            ) +
            "px";

        document.body.appendChild(
            sparkle
        );

        setTimeout(
            () => sparkle.remove(),
            850
        );

    }

}


/* =========================
   颜色
========================= */

document
.querySelectorAll(".color-btn")
.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            const color =
                button.dataset.color;

            setMachineColor(
                color
            );

            document
            .querySelectorAll(
                ".color-btn"
            )
            .forEach(btn =>
                btn.classList.remove(
                    "active"
                )
            );

            button.classList.add(
                "active"
            );

            customColor.value =
                color;

            saveData();

        }
    );

});


customColor.addEventListener(
    "input",
    () => {

        setMachineColor(
            customColor.value
        );

        saveData();

    }
);


function setMachineColor(color){

    document.documentElement
    .style
    .setProperty(
        "--machine-color",
        color
    );

    document.documentElement
    .style
    .setProperty(
        "--machine-dark",
        shadeColor(
            color,
            -12
        )
    );

}


/* =========================
   颜色变暗
========================= */

function shadeColor(
    color,
    percent
){

    let num =
        parseInt(
            color.replace("#",""),
            16
        );

    let r =
        (num >> 16) +
        percent;

    let g =
        ((num >> 8) & 255) +
        percent;

    let b =
        (num & 255) +
        percent;

    r =
        Math.max(
            0,
            Math.min(
                255,
                r
            )
        );

    g =
        Math.max(
            0,
            Math.min(
                255,
                g
            )
        );

    b =
        Math.max(
            0,
            Math.min(
                255,
                b
            )
        );

    return "#" +
        (
            0x1000000 +
            (r << 16) +
            (g << 8) +
            b
        )
        .toString(16)
        .slice(1);

}


/* =========================
   机器形状
========================= */

document
.querySelectorAll(".choice")
.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            document
            .querySelectorAll(
                ".choice"
            )
            .forEach(
                btn =>
                btn.classList.remove(
                    "active"
                )
            );

            button.classList.add(
                "active"
            );


            machine.classList.remove(
                "round",
                "soft"
            );


            const shape =
                button.dataset.shape;

            if(
                shape !== "normal"
            ){

                machine.classList.add(
                    shape
                );

            }

        }
    );

});


/* =========================
   文字
========================= */

titleInput.addEventListener(
    "input",
    () => {

        machineTitle.textContent =
            titleInput.value;

        saveData();

    }
);


exitInput.addEventListener(
    "input",
    () => {

        exitText.textContent =
            exitInput.value;

        saveData();

    }
);


/* =========================
   等待
========================= */

function wait(ms){

    return new Promise(
        resolve =>
        setTimeout(
            resolve,
            ms
        )
    );

}


/* =========================
   保存
========================= */

function saveData(){

    if(
        !saveSwitch.checked
    ){
        return;
    }

    try{

        localStorage.setItem(
            "myClawImages",
            JSON.stringify(
                uploadedImages
            )
        );

        localStorage.setItem(
            "myClawColor",
            customColor.value
        );

        localStorage.setItem(
            "myClawTitle",
            titleInput.value
        );

        localStorage.setItem(
            "myClawExit",
            exitInput.value
        );

    }catch(error){

        console.log(
            "保存失败",
            error
        );

    }

}


/* =========================
   读取
========================= */

function loadData(){

    try{

        const savedImages =
            localStorage.getItem(
                "myClawImages"
            );

        if(savedImages){

            uploadedImages =
                JSON.parse(
                    savedImages
                );

        }


        const savedColor =
            localStorage.getItem(
                "myClawColor"
            );

        if(savedColor){

            customColor.value =
                savedColor;

            setMachineColor(
                savedColor
            );

        }


        const savedTitle =
            localStorage.getItem(
                "myClawTitle"
            );

        if(savedTitle){

            titleInput.value =
                savedTitle;

            machineTitle.textContent =
                savedTitle;

        }


        const savedExit =
            localStorage.getItem(
                "myClawExit"
            );

        if(savedExit){

            exitInput.value =
                savedExit;

            exitText.textContent =
                savedExit;

        }


        renderUploadList();

        renderPrizes();

    }catch(error){

        console.log(
            "读取设置失败",
            error
        );

    }

}


/* =========================
   初始化
========================= */

loadData();

crane.style.left =
    cranePosition + "%";

slider.style.left =
    cranePosition + "%";

</script>
