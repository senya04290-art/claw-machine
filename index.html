<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>我的小小娃娃机 ♡</title>


<style>

/* =========================================================
   基础
========================================================= */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{

  min-height:100vh;

  background:
    linear-gradient(
      135deg,
      #fff5f8,
      #f5efff
    );

  font-family:
    Arial,
    "Noto Sans SC",
    sans-serif;

  color:#66536d;

  overflow-x:hidden;
}


/* =========================================================
   顶部
========================================================= */

header{

  text-align:center;

  padding:
    24px
    15px
    12px;

}

h1{

  margin:0;

  font-size:28px;

  color:#9b6fa8;

  font-weight:900;

}

.subtitle{

  margin-top:7px;

  font-size:13px;

  color:#aa94b1;

}


/* =========================================================
   页面容器
========================================================= */

.container{

  width:min(94%,520px);

  margin:auto;

}


/* =========================================================
   娃娃机主体
========================================================= */

.machine{

  position:relative;

  height:560px;

  overflow:hidden;

  border:
    8px solid
    #d29abb;

  border-radius:30px;

  background:

    linear-gradient(
      to bottom,

      #dff7ff 0%,

      #f5fcff 67%,

      #e0a36f 67%,

      #c98f60 100%
    );

  box-shadow:

    0 15px 35px
    rgba(120,90,130,.18),

    inset 0 0 30px
    rgba(255,255,255,.65);

}


/* =========================================================
   机器顶部标题
========================================================= */

.machine-title{

  position:absolute;

  top:18px;

  left:50%;

  transform:
    translateX(-50%);

  background:
    rgba(255,255,255,.86);

  padding:
    8px 24px;

  border-radius:20px;

  color:#a06da0;

  font-weight:bold;

  z-index:20;

  white-space:nowrap;

}


/* =========================================================
   顶部灯
========================================================= */

.light{

  position:absolute;

  top:4px;

  width:12px;

  height:12px;

  border-radius:50%;

  background:#fff;

  box-shadow:
    0 0 12px #fff;

  z-index:5;

}

.light:nth-child(1){
  left:25px;
}

.light:nth-child(2){
  left:55px;
}

.light:nth-child(3){
  right:55px;
}

.light:nth-child(4){
  right:25px;
}


/* =========================================================
   横向轨道
========================================================= */

.rail{

  position:absolute;

  top:78px;

  left:14%;

  width:72%;

  height:7px;

  border-radius:10px;

  background:#a984b4;

  box-shadow:

    inset 0 2px 3px
    rgba(255,255,255,.3),

    0 2px 4px
    rgba(120,80,130,.15);

  z-index:6;

}


/* =========================================================
   吊车整体
========================================================= */

.crane{

  position:absolute;

  top:77px;

  left:50%;

  width:58px;

  height:auto;

  transform:
    translateX(-50%);

  transition:
    left .35s ease;

  z-index:10;

}


/* =========================================================
   🟣 紫色滑块
   ★ 这次只缩小这里
========================================================= */

.crane-head{

  position:relative;

  width:52px;

  height:34px;

  margin-left:3px;

  background:
    linear-gradient(
      to bottom,
      #c995cf,
      #b77fc0
    );

  border-radius:
    11px
    11px
    8px
    8px;

  box-shadow:

    0 4px 8px
    rgba(130,90,140,.18),

    inset 0 4px 6px
    rgba(255,255,255,.25);

  z-index:15;

}


/* 紫色滑块顶部高光 */

.crane-head::before{

  content:"";

  position:absolute;

  left:9px;

  top:5px;

  width:34px;

  height:4px;

  border-radius:10px;

  background:
    rgba(255,255,255,.25);

}


/* =========================================================
   绳索
========================================================= */

.cable{

  position:relative;

  width:3px;

  height:68px;

  margin-left:27px;

  background:
    linear-gradient(
      to right,
      #e49ab6,
      #f3b5cb,
      #e49ab6
    );

  border-radius:5px;

  box-shadow:

    0 0 2px
    rgba(255,255,255,.95),

    1px 0 3px
    rgba(190,120,150,.2);

  z-index:8;

  transition:
    height .5s
    cubic-bezier(.4,0,.2,1);

}


/* 绳索底部连接点 */

.cable::after{

  content:"";

  position:absolute;

  left:50%;

  bottom:-3px;

  transform:
    translateX(-50%);

  width:6px;

  height:6px;

  border-radius:50%;

  background:#efa4c0;

}


/* =========================================================
   抓取下降
========================================================= */

.crane.dropping .cable{

  height:135px;

}


/* =========================================================
   🪝 爪子主体
========================================================= */

.claw{

  position:relative;

  width:58px;

  height:58px;

  margin-left:0;

  margin-top:0;

  transform-origin:
    29px 0;

  filter:
    drop-shadow(
      0 3px 3px
      rgba(180,100,145,.18)
    );

  z-index:12;

}


/* =========================================================
   中央连接圆
========================================================= */

.joint{

  position:absolute;

  left:50%;

  top:0;

  width:21px;

  height:21px;

  transform:
    translateX(-50%);

  background:#fff8fc;

  border:
    3px solid
    #e39ab9;

  border-radius:50%;

  box-shadow:

    0 2px 4px
    rgba(180,100,145,.18),

    inset
    1px 1px 2px
    rgba(255,255,255,.9);

  z-index:20;

}


/* 中央内圈 */

.joint::after{

  content:"";

  position:absolute;

  left:50%;

  top:50%;

  width:8px;

  height:8px;

  transform:
    translate(-50%,-50%);

  border-radius:50%;

  background:#fff4f9;

  border:
    2px solid
    #e7a7c1;

}


/* =========================================================
   左爪 —— 上半段
========================================================= */

.arm-left-upper{

  position:absolute;

  left:16px;

  top:17px;

  width:7px;

  height:27px;

  background:
    linear-gradient(
      90deg,
      #f3b5cf,
      #fff6fa,
      #eaa4c2
    );

  border:
    2px solid
    #df94b5;

  border-radius:6px;

  transform:
    rotate(35deg);

  transform-origin:
    top center;

  box-shadow:

    0 2px 3px
    rgba(180,100,145,.15),

    inset
    1px 1px 2px
    rgba(255,255,255,.9);

  transition:
    transform .35s ease;

  z-index:8;

}


/* =========================================================
   左爪 —— 下半段
========================================================= */

.arm-left-lower{

  position:absolute;

  left:4px;

  top:39px;

  width:7px;

  height:24px;

  background:
    linear-gradient(
      90deg,
      #efafd0,
      #fff6fa,
      #eaa2c1
    );

  border:
    2px solid
    #df94b5;

  border-radius:6px;

  transform:
    rotate(-32deg);

  transform-origin:
    top center;

  box-shadow:

    0 2px 3px
    rgba(180,100,145,.15),

    inset
    1px 1px 2px
    rgba(255,255,255,.9);

  transition:
    transform .35s ease;

  z-index:7;

}


/* =========================================================
   右爪 —— 上半段
========================================================= */

.arm-right-upper{

  position:absolute;

  right:16px;

  top:17px;

  width:7px;

  height:27px;

  background:
    linear-gradient(
      90deg,
      #eaa4c2,
      #fff6fa,
      #f3b5cf
    );

  border:
    2px solid
    #df94b5;

  border-radius:6px;

  transform:
    rotate(-35deg);

  transform-origin:
    top center;

  box-shadow:

    0 2px 3px
    rgba(180,100,145,.15),

    inset
    1px 1px 2px
    rgba(255,255,255,.9);

  transition:
    transform .35s ease;

  z-index:8;

}


/* =========================================================
   右爪 —— 下半段
========================================================= */

.arm-right-lower{

  position:absolute;

  right:4px;

  top:39px;

  width:7px;

  height:24px;

  background:
    linear-gradient(
      90deg,
      #eaa2c1,
      #fff6fa,
      #efafd0
    );

  border:
    2px solid
    #df94b5;

  border-radius:6px;

  transform:
    rotate(32deg);

  transform-origin:
    top center;

  box-shadow:

    0 2px 3px
    rgba(180,100,145,.15),

    inset
    1px 1px 2px
    rgba(255,255,255,.9);

  transition:
    transform .35s ease;

  z-index:7;

}


/* =========================================================
   爪子默认张开
========================================================= */

.claw.open .arm-left-upper{

  transform:
    rotate(43deg);

}

.claw.open .arm-left-lower{

  transform:
    rotate(-38deg);

}

.claw.open .arm-right-upper{

  transform:
    rotate(-43deg);

}

.claw.open .arm-right-lower{

  transform:
    rotate(38deg);

}


/* =========================================================
   爪子闭合
========================================================= */

.claw.closed .arm-left-upper{

  transform:
    rotate(24deg);

}

.claw.closed .arm-left-lower{

  transform:
    rotate(-12deg);

}

.claw.closed .arm-right-upper{

  transform:
    rotate(-24deg);

}

.claw.closed .arm-right-lower{

  transform:
    rotate(12deg);

}


/* =========================================================
   奖品区域
========================================================= */

.prizes{

  position:absolute;

  left:7%;

  right:7%;

  bottom:14%;

  height:52%;

  display:flex;

  flex-wrap:wrap;

  align-items:flex-end;

  justify-content:center;

  gap:9px;

  z-index:4;

}


/* =========================================================
   奖品
========================================================= */

.prize{

  width:76px;

  height:76px;

  overflow:hidden;

  background:
    rgba(255,255,255,.72);

  border:
    3px solid white;

  border-radius:12px;

  box-shadow:
    0 5px 10px
    rgba(80,50,80,.2);

  display:flex;

  align-items:center;

  justify-content:center;

}


.prize img{

  width:100%;

  height:100%;

  object-fit:contain;

  display:block;

}


/* =========================================================
   没有奖品
========================================================= */

.empty{

  color:#aa94b1;

  font-size:14px;

  text-align:center;

  padding-top:130px;

}


/* =========================================================
   出奖口
========================================================= */

.exit{

  position:absolute;

  bottom:12px;

  left:50%;

  transform:
    translateX(-50%);

  width:145px;

  height:55px;

  border-radius:
    15px
    15px
    5px
    5px;

  background:#725d76;

  border:
    5px solid
    #aa8bb0;

  color:white;

  text-align:center;

  padding-top:13px;

  font-weight:bold;

  z-index:8;

}


/* =========================================================
   按钮
========================================================= */

.controls{

  display:grid;

  grid-template-columns:
    1fr
    1.2fr
    1fr;

  gap:9px;

  margin-top:14px;

}


button,
.upload{

  border:none;

  border-radius:15px;

  padding:
    13px
    8px;

  font-size:15px;

  font-weight:bold;

  color:white;

  background:#ad83b9;

  box-shadow:
    0 4px 8px
    rgba(100,70,110,.15);

  cursor:pointer;

  text-align:center;

  transition:
    transform .12s ease;

}


button:active,
.upload:active{

  transform:
    scale(.96);

}


.grab{

  background:#df8fac;

}


.upload{

  background:#91a7c9;

}


input{

  display:none;

}


/* =========================================================
   信息
========================================================= */

.info{

  margin-top:12px;

  padding:13px;

  background:
    rgba(255,255,255,.78);

  border-radius:15px;

  text-align:center;

  font-size:14px;

}


/* =========================================================
   抓取结果弹窗
========================================================= */

.result{

  display:none;

  position:fixed;

  inset:0;

  z-index:50;

  background:
    rgba(82,60,90,.28);

  backdrop-filter:
    blur(4px);

  align-items:center;

  justify-content:center;

  padding:22px;

}


.result.show{

  display:flex;

}


.result-card{

  width:min(92vw,390px);

  padding:
    24px
    20px
    20px;

  background:#fff;

  border:
    3px solid
    #f0c7d7;

  border-radius:28px;

  text-align:center;

  box-shadow:
    0 20px 55px
    rgba(70,45,80,.25);

  position:relative;

  overflow:hidden;

}


.result-title{

  font-size:25px;

  font-weight:900;

  color:#d27f9d;

}


.result-icon{

  font-size:54px;

  line-height:1;

  margin:
    6px 0
    2px;

  animation:
    pop .55s ease;

}


@keyframes pop{

  0%{

    transform:
      scale(.3)
      rotate(-12deg);

    opacity:0;

  }

  70%{

    transform:
      scale(1.15);

  }

  100%{

    transform:
      scale(1);

  }

}


.result-img-wrap{

  width:190px;

  height:190px;

  margin:
    12px auto;

  border-radius:20px;

  background:#faf6fb;

  border:
    3px solid
    #ead9ee;

  display:flex;

  align-items:center;

  justify-content:center;

  overflow:hidden;

}


.result-img{

  max-width:100%;

  max-height:100%;

  width:auto;

  height:auto;

  object-fit:contain;

}


.result-text{

  font-size:14px;

  color:#8e7893;

  margin-bottom:10px;

}


.result button{

  background:#df8fac;

  padding:
    12px
    25px;

}


/* =========================================================
   星星
========================================================= */

.sparkles{

  position:absolute;

  inset:0;

  pointer-events:none;

  font-size:22px;

}


.sparkles span{

  position:absolute;

  animation:
    spark 1.5s ease-out
    forwards;

}


.sparkles span:nth-child(1){

  left:10%;

  top:15%;

}


.sparkles span:nth-child(2){

  right:12%;

  top:20%;

}


.sparkles span:nth-child(3){

  left:18%;

  bottom:18%;

}


.sparkles span:nth-child(4){

  right:17%;

  bottom:15%;

}


@keyframes spark{

  0%{

    transform:
      scale(.3);

    opacity:0;

  }

  35%{

    opacity:1;

  }

  100%{

    transform:
      translateY(-25px)
      scale(1.3)
      rotate(180deg);

    opacity:0;

  }

}


/* =========================================================
   手机屏幕微调
========================================================= */

@media(max-width:380px){

  .machine{

    height:540px;

  }

  .prize{

    width:68px;

    height:68px;

  }

  h1{

    font-size:25px;

  }

}

</style>

</head>


<body>


<header>

  <h1>
    🧸 我的小小娃娃机 ♡
  </h1>

  <div class="subtitle">
    上传你喜欢的图片，开始抓取吧 ✦
  </div>

</header>



<div class="container">


  <div class="machine">


    <div class="light"></div>
    <div class="light"></div>
    <div class="light"></div>
    <div class="light"></div>


    <div class="machine-title">
      ✦ MY CLAW MACHINE ✦
    </div>


    <div class="rail"></div>


    <div
      class="crane"
      id="crane"
    >


      <div class="crane-head"></div>


      <div class="cable"></div>


      <div
        class="claw open"
        id="claw"
      >


        <div class="joint"></div>


        <div
          class="arm-left-upper"
        ></div>

        <div
          class="arm-left-lower"
        ></div>


        <div
          class="arm-right-upper"
        ></div>

        <div
          class="arm-right-lower"
        ></div>


      </div>


    </div>



    <div
      class="prizes"
      id="prizes"
    ></div>



    <div class="exit">
      🎁 出奖口
    </div>


  </div>



  <div class="controls">


    <button onclick="move(-1)">
      ← 左
    </button>


    <button
      class="grab"
      onclick="grab()"
    >
      🪝 抓取
    </button>


    <button onclick="move(1)">
      右 →
    </button>



    <label class="upload">

      ＋ 上传图片

      <input
        type="file"
        id="upload"
        accept="image/*"
        multiple
      >

    </label>


    <button onclick="newGame()">
      🔀 重新摆放
    </button>


    <button onclick="clearPrizes()">
      🗑 清空
    </button>


  </div>



  <div class="info">

    当前奖品：
    <b id="count">0</b>
    个

  </div>


</div>



<div
  class="result"
  id="result"
>


  <div class="result-card">


    <div class="sparkles">

      <span>✦</span>
      <span>♡</span>
      <span>✧</span>
      <span>✦</span>

    </div>


    <div
      class="result-icon"
      id="resultIcon"
    >
      🎉
    </div>


    <div
      class="result-title"
      id="resultTitle"
    >
      抓取成功！
    </div>


    <div
      class="result-img-wrap"
      id="resultImgWrap"
    >

      <img
        class="result-img"
        id="resultImg"
        alt=""
      >

    </div>


    <div
      class="result-text"
      id="resultText"
    >
      恭喜你获得了这个奖品 ♡
    </div>


    <button onclick="closeResult()">
      再抓一次 ♡
    </button>


  </div>


</div>



<script>


/* =========================================================
   数据
========================================================= */

let prizes = [];

let position = 50;

let busy = false;



/* =========================================================
   获取元素
========================================================= */

const crane =
  document.getElementById("crane");

const claw =
  document.getElementById("claw");

const prizeBox =
  document.getElementById("prizes");

const count =
  document.getElementById("count");

const upload =
  document.getElementById("upload");

const result =
  document.getElementById("result");



/* =========================================================
   上传图片
========================================================= */

upload.addEventListener(
  "change",
  function(e){

    const files =
      [...e.target.files];


    files.forEach(
      function(file){

        const reader =
          new FileReader();


        reader.onload =
          function(event){

            prizes.push({

              image:
                event.target.result,

              name:
                file.name

            });


            renderPrizes();

          };


        reader.readAsDataURL(file);

      }
    );


    upload.value = "";

  }
);



/* =========================================================
   显示奖品
========================================================= */

function renderPrizes(){

  prizeBox.innerHTML = "";


  if(!prizes.length){

    prizeBox.innerHTML =
      '<div class="empty">' +
      '还没有奖品 ♡<br>' +
      '请先上传图片' +
      '</div>';

  }

  else{

    prizes.forEach(
      function(prize){

        const div =
          document.createElement("div");


        div.className =
          "prize";


        const img =
          document.createElement("img");


        img.src =
          prize.image;


        img.alt =
          prize.name;


        div.appendChild(img);


        prizeBox.appendChild(div);

      }
    );

  }


  count.textContent =
    prizes.length;

}



/* =========================================================
   左右移动
========================================================= */

function move(direction){

  if(busy)return;


  position +=
    direction * 10;


  position =
    Math.max(
      12,
      Math.min(
        88,
        position
      )
    );


  crane.style.left =
    position + "%";

}



/* =========================================================
   抓取
========================================================= */

function grab(){

  if(busy)return;


  if(!prizes.length){

    alert(
      "请先上传一些图片作为奖品 ♡"
    );

    return;

  }


  busy = true;


  /* 爪子先张开 */

  claw.className =
    "claw open";


  /* 绳索下降 */

  setTimeout(
    function(){

      crane.classList.add(
        "dropping"
      );

    },
    100
  );


  /* 爪子闭合 */

  setTimeout(
    function(){

      claw.className =
        "claw closed";

    },
    650
  );


  /* 绳索收回 */

  setTimeout(
    function(){

      crane.classList.remove(
        "dropping"
      );

    },
    1000
  );


  /* 判断结果 */

  setTimeout(
    function(){

      const success =
        Math.random() < 0.65;


      if(success){

        const index =
          Math.floor(
            Math.random() *
            prizes.length
          );


        const prize =
          prizes[index];


        showSuccess(prize);


        prizes.splice(
          index,
          1
        );


        renderPrizes();

      }

      else{

        showFail();

      }


      claw.className =
        "claw open";


      busy = false;

    },
    1450
  );

}



/* =========================================================
   抓取成功
========================================================= */

function showSuccess(prize){

  document.getElementById(
    "resultIcon"
  ).textContent =
    "🎉";


  document.getElementById(
    "resultTitle"
  ).textContent =
    "抓取成功！";


  document.getElementById(
    "resultImg"
  ).src =
    prize.image;


  document.getElementById(
    "resultImg"
  ).alt =
    prize.name;


  document.getElementById(
    "resultImgWrap"
  ).style.display =
    "flex";


  document.getElementById(
    "resultText"
  ).textContent =
    "恭喜你获得了这个奖品 ♡";


  result.classList.add(
    "show"
  );

}



/* =========================================================
   没抓到
========================================================= */

function showFail(){

  document.getElementById(
    "resultIcon"
  ).textContent =
    "💦";


  document.getElementById(
    "resultTitle"
  ).textContent =
    "差一点点！";


  document.getElementById(
    "resultImgWrap"
  ).style.display =
    "none";


  document.getElementById(
    "resultText"
  ).textContent =
    "这次没有抓到，再试一次吧 ♡";


  result.classList.add(
    "show"
  );

}



/* =========================================================
   关闭结果
========================================================= */

function closeResult(){

  result.classList.remove(
    "show"
  );


  document.getElementById(
    "resultImgWrap"
  ).style.display =
    "flex";

}



/* =========================================================
   随机摆放
========================================================= */

function newGame(){

  prizes.sort(
    function(){

      return Math.random() - 0.5;

    }
  );


  renderPrizes();


  position =
    20 +
    Math.random() * 60;


  crane.style.left =
    position + "%";

}



/* =========================================================
   清空奖品
========================================================= */

function clearPrizes(){

  if(
    !confirm(
      "确定要清空所有奖品吗？"
    )
  ){

    return;

  }


  prizes = [];

  renderPrizes();

}



/* =========================================================
   初始
========================================================= */

renderPrizes();


</script>


</body>

</html>
