<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>我的小小娃娃机 ♡</title>

<style>

/* =========================================================
   全局变量
========================================================= */

:root{

  --main:#d89ab8;
  --main-dark:#bd789c;
  --main-light:#f3d4e2;

  --accent:#9b82b5;
  --accent-light:#ddd1ea;

  --cream:#fffaf7;

  --text:#66586a;
  --sub:#a493a8;

  --machine-border:#d89ab8;

  --glass-top:#e9f9ff;
  --glass-bottom:#f9fdff;

  --wood:#d29a68;
  --wood-dark:#b97e51;

  --button:#ae8bbb;
  --grab:#dc8eaa;
  --upload:#91a8c9;

}


/* =========================================================
   基础
========================================================= */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{

  min-height:100vh;

  background:
    radial-gradient(
      circle at 10% 10%,
      rgba(255,255,255,.95),
      transparent 30%
    ),

    radial-gradient(
      circle at 90% 20%,
      rgba(231,215,245,.65),
      transparent 28%
    ),

    linear-gradient(
      135deg,
      #fff5f8,
      #f4efff
    );

  font-family:
    Arial,
    "Noto Sans SC",
    sans-serif;

  color:var(--text);

  overflow-x:hidden;

}


/* =========================================================
   页面装饰
========================================================= */

body::before{

  content:"";

  position:fixed;

  width:180px;
  height:180px;

  left:-80px;
  bottom:60px;

  border-radius:50%;

  background:
    rgba(255,255,255,.45);

  filter:blur(5px);

  pointer-events:none;

}


body::after{

  content:"";

  position:fixed;

  width:220px;
  height:220px;

  right:-110px;
  top:120px;

  border-radius:50%;

  background:
    rgba(231,211,243,.35);

  filter:blur(8px);

  pointer-events:none;

}


/* =========================================================
   顶部
========================================================= */

header{

  text-align:center;

  padding:
    30px
    15px
    15px;

}


.logo-small{

  font-size:11px;

  letter-spacing:
    4px;

  color:
    var(--main-dark);

  font-weight:bold;

  opacity:.8;

  margin-bottom:7px;

}


h1{

  margin:0;

  font-size:29px;

  color:
    var(--main-dark);

  font-weight:900;

  letter-spacing:
    1px;

}


.subtitle{

  margin-top:8px;

  font-size:13px;

  color:var(--sub);

}


.header-line{

  width:65px;

  height:3px;

  margin:
    12px
    auto
    0;

  border-radius:10px;

  background:
    var(--main);

  opacity:.5;

}


/* =========================================================
   页面容器
========================================================= */

.container{

  width:
    min(94%,540px);

  margin:auto;

}


/* =========================================================
   自定义面板
========================================================= */

.custom-panel{

  background:
    rgba(255,255,255,.78);

  border:
    1px solid
    rgba(255,255,255,.9);

  border-radius:22px;

  padding:17px;

  margin-bottom:14px;

  box-shadow:
    0 8px 25px
    rgba(110,80,120,.08);

  backdrop-filter:
    blur(10px);

}


.custom-head{

  display:flex;

  align-items:center;

  justify-content:space-between;

  cursor:pointer;

}


.custom-head-left{

  display:flex;

  align-items:center;

  gap:8px;

}


.custom-number{

  font-size:10px;

  letter-spacing:2px;

  color:var(--main-dark);

}


.custom-title{

  font-size:15px;

  font-weight:900;

  color:#755f78;

}


.custom-arrow{

  font-size:14px;

  color:var(--sub);

  transition:
    transform .25s ease;

}


.custom-panel.open
.custom-arrow{

  transform:
    rotate(180deg);

}


.custom-content{

  display:none;

  margin-top:16px;

}


.custom-panel.open
.custom-content{

  display:block;

}


/* =========================================================
   自定义项目
========================================================= */

.setting{

  margin-bottom:15px;

}


.setting:last-child{

  margin-bottom:0;

}


.setting-label{

  display:block;

  font-size:11px;

  letter-spacing:1px;

  color:#9b899f;

  margin-bottom:7px;

}


.text-input{

  width:100%;

  border:
    1px solid
    #eaddea;

  background:
    #fffafd;

  border-radius:12px;

  padding:
    10px
    12px;

  outline:none;

  color:#6d5a70;

  font-size:13px;

  transition:
    border .2s,
    box-shadow .2s;

}


.text-input:focus{

  border-color:
    var(--main);

  box-shadow:
    0 0 0 3px
    rgba(216,154,184,.12);

}


/* =========================================================
   主题颜色
========================================================= */

.colors{

  display:flex;

  gap:9px;

  flex-wrap:wrap;

}


.color-choice{

  width:31px;
  height:31px;

  border-radius:50%;

  border:
    3px solid
    white;

  box-shadow:
    0 2px 7px
    rgba(80,50,80,.15);

  cursor:pointer;

  transition:
    transform .15s ease,
    box-shadow .15s ease;

}


.color-choice:hover{

  transform:
    translateY(-2px);

}


.color-choice.active{

  transform:
    scale(1.12);

  box-shadow:
    0 0 0 2px
    var(--main),
    0 3px 8px
    rgba(80,50,80,.18);

}


.color-pink{
  background:#d89ab8;
}

.color-lavender{
  background:#ad93c5;
}

.color-blue{
  background:#8fb8cf;
}

.color-mint{
  background:#8fbfae;
}

.color-yellow{
  background:#e1b56f;
}


/* =========================================================
   娃娃机主体
========================================================= */

.machine{

  position:relative;

  height:560px;

  overflow:hidden;

  border:
    8px solid
    var(--machine-border);

  border-radius:32px;

  background:

    linear-gradient(
      to bottom,
      var(--glass-top) 0%,
      var(--glass-bottom) 67%,
      var(--wood) 67%,
      var(--wood-dark) 100%
    );

  box-shadow:

    0 18px 40px
    rgba(100,70,110,.16),

    0 5px 10px
    rgba(100,70,110,.08),

    inset
    0 0 30px
    rgba(255,255,255,.7);

}


/* =========================================================
   玻璃高光
========================================================= */

.machine::before{

  content:"";

  position:absolute;

  top:80px;
  left:-30px;

  width:55%;

  height:60%;

  background:
    linear-gradient(
      115deg,
      rgba(255,255,255,.32),
      transparent 65%
    );

  transform:
    skewX(-10deg);

  pointer-events:none;

  z-index:3;

}


.machine::after{

  content:"";

  position:absolute;

  top:0;
  right:0;

  width:100%;
  height:100%;

  border-radius:24px;

  box-shadow:
    inset
    -12px 0 25px
    rgba(255,255,255,.18);

  pointer-events:none;

  z-index:3;

}


/* =========================================================
   机器顶部装饰
========================================================= */

.machine-top-label{

  position:absolute;

  left:15px;

  top:17px;

  font-size:8px;

  letter-spacing:2px;

  color:
    rgba(100,80,110,.35);

  z-index:20;

}


.machine-number{

  position:absolute;

  right:15px;

  top:17px;

  font-size:8px;

  letter-spacing:2px;

  color:
    rgba(100,80,110,.35);

  z-index:20;

}


/* =========================================================
   机器标题
========================================================= */

.machine-title{

  position:absolute;

  top:17px;
  left:50%;

  transform:
    translateX(-50%);

  background:
    rgba(255,255,255,.9);

  padding:
    9px
    24px;

  border:
    1px solid
    rgba(255,255,255,.95);

  border-radius:20px;

  color:
    var(--main-dark);

  font-weight:900;

  font-size:12px;

  letter-spacing:1px;

  box-shadow:
    0 4px 12px
    rgba(100,70,110,.08);

  z-index:20;

  white-space:nowrap;

}


/* =========================================================
   顶部灯
========================================================= */

.light{

  position:absolute;

  top:5px;

  width:12px;
  height:12px;

  border-radius:50%;

  background:#fff;

  box-shadow:
    0 0 10px
    rgba(255,255,255,.95);

  z-index:21;

  animation:
    lightPulse 2.4s
    ease-in-out
    infinite;

}


.light:nth-child(1){
  left:25px;
  animation-delay:0s;
}

.light:nth-child(2){
  left:55px;
  animation-delay:.4s;
}

.light:nth-child(3){
  right:55px;
  animation-delay:.8s;
}

.light:nth-child(4){
  right:25px;
  animation-delay:1.2s;
}


@keyframes lightPulse{

  0%,
  100%{

    opacity:.65;

    transform:
      scale(.85);

  }

  50%{

    opacity:1;

    transform:
      scale(1.12);

  }

}


/* =========================================================
   横向滑轨
   保持原来的尺寸
========================================================= */

.rail{

  position:absolute;

  top:78px;

  left:7%;

  width:86%;

  height:9px;

  border-radius:10px;

  background:
    linear-gradient(
      to bottom,
      #b79ac1,
      #9f7fab
    );

  box-shadow:

    inset
    0 2px 3px
    rgba(255,255,255,.35),

    0 3px 5px
    rgba(100,70,110,.15);

  z-index:6;

}


/* =========================================================
   吊车
========================================================= */

.crane{

  position:absolute;

  top:77px;

  left:50%;

  width:58px;

  height:auto;

  transform:
    translateX(-50%);

  transition:
    left .35s ease;

  z-index:10;

}


/* =========================================================
   紫色滑块
========================================================= */

.crane-head{

  position:relative;

  width:46px;

  height:30px;

  margin-left:6px;

  background:

    linear-gradient(
      to bottom,
      #c995cf,
      #b77fc0
    );

  border-radius:
    10px
    10px
    7px
    7px;

  box-shadow:

    0 4px 8px
    rgba(130,90,140,.18),

    inset
    0 4px 6px
    rgba(255,255,255,.25);

  z-index:15;

}


/* 滑块高光 */

.crane-head::before{

  content:"";

  position:absolute;

  left:8px;
  top:5px;

  width:30px;
  height:3px;

  border-radius:10px;

  background:
    rgba(255,255,255,.28);

}


/* =========================================================
   绳索
========================================================= */

.cable{

  position:relative;

  width:3px;

  height:45px;

  margin-left:27px;

  background:

    linear-gradient(
      to right,
      #e49ab6,
      #f3b5cb,
      #e49ab6
    );

  border-radius:5px;

  box-shadow:

    0 0 2px
    rgba(255,255,255,.95),

    1px 0 3px
    rgba(190,120,150,.2);

  z-index:8;

  transition:

    height .5s
    cubic-bezier(.4,0,.2,1);

}


/* 绳索连接点 */

.cable::after{

  content:"";

  position:absolute;

  left:50%;
  bottom:-3px;

  transform:
    translateX(-50%);

  width:6px;
  height:6px;

  border-radius:50%;

  background:#efa4c0;

}


/* =========================================================
   绳索下降
========================================================= */

.crane.dropping .cable{

  height:220px;

}


/* =========================================================
   爪子
   保持你之前调好的尺寸
========================================================= */

.claw{

  position:relative;

  width:52px;
  height:52px;

  margin-left:3px;
  margin-top:0;

  transform-origin:
    26px 0;

  filter:
    drop-shadow(
      0 3px 3px
      rgba(180,100,145,.18)
    );

  z-index:12;

}


/* =========================================================
   中央连接圆
========================================================= */

.joint{

  position:absolute;

  left:50%;
  top:0;

  width:19px;
  height:19px;

  transform:
    translateX(-50%);

  background:#fff8fc;

  border:
    3px solid
    #e39ab9;

  border-radius:50%;

  box-shadow:

    0 2px 4px
    rgba(180,100,145,.18),

    inset
    1px 1px 2px
    rgba(255,255,255,.9);

  z-index:20;

}


.joint::after{

  content:"";

  position:absolute;

  left:50%;
  top:50%;

  width:7px;
  height:7px;

  transform:
    translate(-50%,-50%);

  border-radius:50%;

  background:#fff4f9;

  border:
    2px solid
    #e7a7c1;

}


/* =========================================================
   爪子
========================================================= */

.arm-left-upper,
.arm-left-lower,
.arm-right-upper,
.arm-right-lower{

  background:
    linear-gradient(
      90deg,
      #f3b5cf,
      #fff6fa,
      #eaa4c2
    );

  border:
    2px solid
    #df94b5;

  border-radius:6px;

  box-shadow:

    0 2px 3px
    rgba(180,100,145,.15),

    inset
    1px 1px 2px
    rgba(255,255,255,.9);

  transition:
    transform .35s ease;

}


/* 左上 */

.arm-left-upper{

  position:absolute;

  left:15px;
  top:16px;

  width:6px;
  height:24px;

  transform:
    rotate(35deg);

  transform-origin:
    top center;

  z-index:8;

}


/* 左下 */

.arm-left-lower{

  position:absolute;

  left:4px;
  top:36px;

  width:6px;
  height:22px;

  transform:
    rotate(-32deg);

  transform-origin:
    top center;

  z-index:7;

}


/* 右上 */

.arm-right-upper{

  position:absolute;

  right:15px;
  top:16px;

  width:6px;
  height:24px;

  transform:
    rotate(-35deg);

  transform-origin:
    top center;

  z-index:8;

}


/* 右下 */

.arm-right-lower{

  position:absolute;

  right:4px;
  top:36px;

  width:6px;
  height:22px;

  transform:
    rotate(32deg);

  transform-origin:
    top center;

  z-index:7;

}


/* =========================================================
   爪子张开
========================================================= */

.claw.open .arm-left-upper{
  transform:rotate(43deg);
}

.claw.open .arm-left-lower{
  transform:rotate(-38deg);
}

.claw.open .arm-right-upper{
  transform:rotate(-43deg);
}

.claw.open .arm-right-lower{
  transform:rotate(38deg);
}


/* =========================================================
   爪子闭合
========================================================= */

.claw.closed .arm-left-upper{
  transform:rotate(24deg);
}

.claw.closed .arm-left-lower{
  transform:rotate(-12deg);
}

.claw.closed .arm-right-upper{
  transform:rotate(-24deg);
}

.claw.closed .arm-right-lower{
  transform:rotate(12deg);
}


/* =========================================================
   奖品区域
========================================================= */

.prizes{

  position:absolute;

  left:7%;
  right:7%;

  bottom:14%;

  height:52%;

  display:flex;

  flex-wrap:wrap;

  align-items:flex-end;

  justify-content:center;

  gap:10px;

  z-index:4;

}


/* =========================================================
   奖品
========================================================= */

.prize{

  width:76px;
  height:76px;

  overflow:hidden;

  background:
    rgba(255,255,255,.82);

  border:
    3px solid white;

  border-radius:13px;

  box-shadow:

    0 6px 12px
    rgba(80,50,80,.16),

    0 2px 4px
    rgba(80,50,80,.08);

  display:flex;

  align-items:center;
  justify-content:center;

  transition:
    transform .18s ease,
    box-shadow .18s ease;

}


.prize:hover{

  transform:
    translateY(-4px)
    rotate(-1deg);

  box-shadow:

    0 10px 18px
    rgba(80,50,80,.2);

}


.prize img{

  width:100%;
  height:100%;

  object-fit:contain;

  display:block;

}


/* =========================================================
   空奖品
========================================================= */

.empty{

  color:#aa94b1;

  font-size:14px;

  text-align:center;

  padding-top:130px;

  line-height:1.8;

}


/* =========================================================
   出奖口
========================================================= */

.exit{

  position:absolute;

  bottom:12px;
  left:50%;

  transform:
    translateX(-50%);

  width:145px;
  height:55px;

  border-radius:
    15px
    15px
    5px
    5px;

  background:
    linear-gradient(
      to bottom,
      #806783,
      #66516a
    );

  border:
    5px solid
    #aa8bb0;

  color:white;

  text-align:center;

  padding-top:13px;

  font-weight:bold;

  font-size:13px;

  letter-spacing:.5px;

  box-shadow:

    inset
    0 3px 5px
    rgba(255,255,255,.12),

    0 4px 7px
    rgba(70,50,80,.16);

  z-index:8;

}


/* =========================================================
   操作按钮
========================================================= */

.controls{

  display:grid;

  grid-template-columns:
    1fr
    1.2fr
    1fr;

  gap:9px;

  margin-top:14px;

}


button,
.upload{

  border:none;

  border-radius:15px;

  padding:
    13px
    8px;

  font-size:14px;

  font-weight:bold;

  color:white;

  background:
    linear-gradient(
      135deg,
      #b99ac3,
      #a783b4
    );

  box-shadow:

    0 5px 10px
    rgba(100,70,110,.13),

    inset
    0 1px 0
    rgba(255,255,255,.25);

  cursor:pointer;

  text-align:center;

  transition:
    transform .12s ease,
    box-shadow .12s ease;

}


button:hover,
.upload:hover{

  box-shadow:

    0 7px 14px
    rgba(100,70,110,.17),

    inset
    0 1px 0
    rgba(255,255,255,.3);

}


button:active,
.upload:active{

  transform:
    translateY(2px)
    scale(.97);

  box-shadow:
    0 2px 5px
    rgba(100,70,110,.12);

}


.grab{

  background:
    linear-gradient(
      135deg,
      #e9a4ba,
      #d882a1
    );

}


.upload{

  background:
    linear-gradient(
      135deg,
      #a8bddc,
      #8da5c7
    );

}


input{

  display:none;

}


/* =========================================================
   信息
========================================================= */

.info{

  margin-top:13px;

  padding:12px;

  background:
    rgba(255,255,255,.72);

  border:
    1px solid
    rgba(255,255,255,.85);

  border-radius:15px;

  text-align:center;

  font-size:13px;

  color:#8c7b91;

  box-shadow:
    0 5px 15px
    rgba(100,70,110,.06);

}


.info b{

  color:
    var(--main-dark);

  font-size:15px;

}


/* =========================================================
   小提示
========================================================= */

.tip{

  text-align:center;

  margin:
    13px
    0
    28px;

  color:#a493a8;

  font-size:10px;

  letter-spacing:1px;

}


/* =========================================================
   抓取结果弹窗
========================================================= */

.result{

  display:none;

  position:fixed;

  inset:0;

  z-index:50;

  background:
    rgba(82,60,90,.28);

  backdrop-filter:
    blur(7px);

  align-items:center;

  justify-content:center;

  padding:22px;

}


.result.show{

  display:flex;

  animation:
    fadeIn .25s ease;

}


@keyframes fadeIn{

  from{
    opacity:0;
  }

  to{
    opacity:1;
  }

}


/* =========================================================
   结果卡片
========================================================= */

.result-card{

  width:
    min(92vw,390px);

  padding:
    24px
    20px
    20px;

  background:
    linear-gradient(
      145deg,
      #fff,
      #fff9fc
    );

  border:
    3px solid
    var(--main-light);

  border-radius:28px;

  text-align:center;

  box-shadow:
    0 20px 55px
    rgba(70,45,80,.25);

  position:relative;

  overflow:hidden;

  animation:
    resultCard .4s
    cubic-bezier(.2,.8,.2,1);

}


@keyframes resultCard{

  0%{

    opacity:0;

    transform:
      translateY(25px)
      scale(.92);

  }

  100%{

    opacity:1;

    transform:
      translateY(0)
      scale(1);

  }

}


/* =========================================================
   结果顶部小字
========================================================= */

.result-small{

  font-size:9px;

  letter-spacing:3px;

  color:
    var(--main-dark);

  margin-bottom:4px;

  font-weight:bold;

}


.result-title{

  font-size:25px;

  font-weight:900;

  color:
    var(--main-dark);

}


.result-icon{

  font-size:54px;

  line-height:1;

  margin:
    6px 0
    2px;

  animation:
    pop .55s ease;

}


@keyframes pop{

  0%{

    transform:
      scale(.3)
      rotate(-12deg);

    opacity:0;

  }

  70%{

    transform:
      scale(1.15);

  }

  100%{

    transform:
      scale(1);

  }

}


/* =========================================================
   结果图片
========================================================= */

.result-img-wrap{

  width:190px;
  height:190px;

  margin:
    12px auto;

  border-radius:20px;

  background:
    #faf6fb;

  border:
    3px solid
    #ead9ee;

  display:flex;

  align-items:center;
  justify-content:center;

  overflow:hidden;

}


.result-img{

  max-width:100%;
  max-height:100%;

  width:auto;
  height:auto;

  object-fit:contain;

}


/* =========================================================
   结果文字
========================================================= */

.result-text{

  font-size:14px;

  color:#8e7893;

  margin-bottom:10px;

}


/* =========================================================
   结果按钮
========================================================= */

.result button{

  background:
    linear-gradient(
      135deg,
      #e7a1b7,
      #d983a3
    );

  padding:
    12px
    25px;

}


/* =========================================================
   星星
========================================================= */

.sparkles{

  position:absolute;

  inset:0;

  pointer-events:none;

  font-size:22px;

}


.sparkles span{

  position:absolute;

  animation:
    spark 1.5s
    ease-out
    forwards;

}


.sparkles span:nth-child(1){
  left:10%;
  top:15%;
}

.sparkles span:nth-child(2){
  right:12%;
  top:20%;
}

.sparkles span:nth-child(3){
  left:18%;
  bottom:18%;
}

.sparkles span:nth-child(4){
  right:17%;
  bottom:15%;
}


@keyframes spark{

  0%{

    transform:
      scale(.3);

    opacity:0;

  }

  35%{

    opacity:1;

  }

  100%{

    transform:
      translateY(-25px)
      scale(1.3)
      rotate(180deg);

    opacity:0;

  }

}


/* =========================================================
   手机
========================================================= */

@media(max-width:380px){

  .machine{

    height:540px;

  }

  .prize{

    width:68px;
    height:68px;

  }

  h1{

    font-size:25px;

  }

  .machine-title{

    padding:
      8px
      18px;

    font-size:11px;

  }

}


/* =========================================================
   更窄屏幕
========================================================= */

@media(max-width:340px){

  .controls{

    gap:6px;

  }

  button,
  .upload{

    font-size:12px;

    padding:
      12px
      4px;

  }

}


/* =========================================================
   主题颜色
========================================================= */


/* 粉色 */

body.theme-pink{

  --main:#d89ab8;
  --main-dark:#bd789c;
  --main-light:#f3d4e2;
  --machine-border:#d89ab8;

}


/* 紫色 */

body.theme-lavender{

  --main:#ad93c5;
  --main-dark:#8e72aa;
  --main-light:#ddd1ea;
  --machine-border:#ad93c5;

}


/* 蓝色 */

body.theme-blue{

  --main:#8fb8cf;
  --main-dark:#6e9db8;
  --main-light:#d4e8f1;
  --machine-border:#8fb8cf;

}


/* 薄荷 */

body.theme-mint{

  --main:#8fbfae;
  --main-dark:#689f8c;
  --main-light:#d2e9df;
  --machine-border:#8fbfae;

}


/* 黄色 */

body.theme-yellow{

  --main:#dfb36e;
  --main-dark:#bc8e4b;
  --main-light:#f3dfb8;
  --machine-border:#dfb36e;

}

</style>

</head>


<body>


<header>

  <div class="logo-small">
    LITTLE DREAM
  </div>

  <h1 id="pageTitle">
    🧸 我的小小娃娃机 ♡
  </h1>

  <div
    class="subtitle"
    id="pageSubtitle"
  >
    上传你喜欢的图片，开始抓取吧 ✦
  </div>

  <div class="header-line"></div>

</header>



<div class="container">


  <!-- =====================================================
       自定义面板
  ====================================================== -->

  <div
    class="custom-panel open"
    id="customPanel"
  >

    <div
      class="custom-head"
      onclick="toggleCustomize()"
    >

      <div class="custom-head-left">

        <span class="custom-number">
          01
        </span>

        <span class="custom-title">
          CUSTOMIZE ♡
        </span>

      </div>

      <span
        class="custom-arrow"
        id="customArrow"
      >
       ⌃
      </span>

    </div>


    <div class="custom-content">


      <!-- 颜色 -->

      <div class="setting">

        <label class="setting-label">
          MACHINE COLOR
        </label>

        <div class="colors">

          <div
            class="color-choice color-pink active"
            data-theme="pink"
            onclick="changeTheme('pink')"
          ></div>

          <div
            class="color-choice color-lavender"
            data-theme="lavender"
            onclick="changeTheme('lavender')"
          ></div>

          <div
            class="color-choice color-blue"
            data-theme="blue"
            onclick="changeTheme('blue')"
          ></div>

          <div
            class="color-choice color-mint"
            data-theme="mint"
            onclick="changeTheme('mint')"
          ></div>

          <div
            class="color-choice color-yellow"
            data-theme="yellow"
            onclick="changeTheme('yellow')"
          ></div>

        </div>

      </div>


      <!-- 标题 -->

      <div class="setting">

        <label class="setting-label">
          MACHINE NAME
        </label>

        <input
          class="text-input"
          id="titleInput"
          type="text"
          maxlength="30"
          value="我的小小娃娃机 ♡"
          oninput="updateTitle(this.value)"
        >

      </div>


      <!-- 副标题 -->

      <div class="setting">

        <label class="setting-label">
          LITTLE MESSAGE
        </label>

        <input
          class="text-input"
          id="subtitleInput"
          type="text"
          maxlength="50"
          value="上传你喜欢的图片，开始抓取吧 ✦"
          oninput="updateSubtitle(this.value)"
        >

      </div>


      <!-- 出奖口 -->

      <div class="setting">

        <label class="setting-label">
          PRIZE EXIT
        </label>

        <input
          class="text-input"
          id="exitInput"
          type="text"
          maxlength="18"
          value="🎁 出奖口"
          oninput="updateExit(this.value)"
        >

      </div>


      <!-- 成功文字 -->

      <div class="setting">

        <label class="setting-label">
          SUCCESS MESSAGE
        </label>

        <input
          class="text-input"
          id="successInput"
          type="text"
          maxlength="30"
          value="恭喜你获得了这个奖品 ♡"
          oninput="updateSuccess(this.value)"
        >

      </div>


      <button
        onclick="resetCustomize()"
        style="
          width:100%;
          margin-top:3px;
          background:#c4a9ca;
        "
      >
        ↻ 恢复默认设置
      </button>


    </div>

  </div>



  <!-- =====================================================
       娃娃机
  ====================================================== -->

  <div class="machine">


    <div class="light"></div>
    <div class="light"></div>
    <div class="light"></div>
    <div class="light"></div>


    <div class="machine-top-label">
      NO. 001
    </div>


    <div class="machine-number">
      ♡ 0001
    </div>


    <div
      class="machine-title"
      id="machineTitle"
    >
      MY LITTLE CLAW
    </div>


    <div class="rail"></div>


    <div
      class="crane"
      id="crane"
    >

      <div class="crane-head"></div>

      <div class="cable"></div>

      <div
        class="claw open"
        id="claw"
      >

        <div class="joint"></div>

        <div class="arm-left-upper"></div>

        <div class="arm-left-lower"></div>

        <div class="arm-right-upper"></div>

        <div class="arm-right-lower"></div>

      </div>

    </div>


    <div
      class="prizes"
      id="prizes"
    ></div>


    <div
      class="exit"
      id="exitText"
    >
      🎁 出奖口
    </div>


  </div>



  <!-- =====================================================
       操作
  ====================================================== -->

  <div class="controls">


    <button onclick="move(-1)">
      ← 左
    </button>


    <button
      class="grab"
      onclick="grab()"
    >
      🪝 抓取
    </button>


    <button onclick="move(1)">
      右 →
    </button>


    <label class="upload">

      ＋ 上传图片

      <input
        type="file"
        id="upload"
        accept="image/*"
        multiple
      >

    </label>


    <button onclick="newGame()">
      🔀 重新摆放
    </button>


    <button onclick="clearPrizes()">
      🗑 清空
    </button>


  </div>



  <!-- =====================================================
       信息
  ====================================================== -->

  <div class="info">

    CURRENT PRIZES ·
    <b id="count">0</b>
    个

  </div>


  <div class="tip">
    MADE WITH ♡ FOR LITTLE DREAMS
  </div>


</div>



<!-- =======================================================
     结果弹窗
======================================================= -->

<div
  class="result"
  id="result"
>


  <div class="result-card">


    <div class="sparkles">

      <span>✦</span>
      <span>♡</span>
      <span>✧</span>
      <span>✦</span>

    </div>


    <div class="result-small">
      CLAW MACHINE
    </div>


    <div
      class="result-icon"
      id="resultIcon"
    >
      🎉
    </div>


    <div
      class="result-title"
      id="resultTitle"
    >
      抓取成功！
    </div>


    <div
      class="result-img-wrap"
      id="resultImgWrap"
    >

      <img
        class="result-img"
        id="resultImg"
        alt=""
      >

    </div>


    <div
      class="result-text"
      id="resultText"
    >
      恭喜你获得了这个奖品 ♡
    </div>


    <button onclick="closeResult()">
      再抓一次 ♡
    </button>


  </div>


</div>



<script>

/* =========================================================
   数据
========================================================= */

let prizes = [];

let position = 50;

let busy = false;


/* =========================================================
   自定义设置
========================================================= */

let settings = {

  theme:
    "pink",

  title:
    "我的小小娃娃机 ♡",

  subtitle:
    "上传你喜欢的图片，开始抓取吧 ✦",

  exit:
    "🎁 出奖口",

  success:
    "恭喜你获得了这个奖品 ♡"

};


/* =========================================================
   获取元素
========================================================= */

const crane =
  document.getElementById("crane");

const claw =
  document.getElementById("claw");

const prizeBox =
  document.getElementById("prizes");

const count =
  document.getElementById("count");

const upload =
  document.getElementById("upload");

const result =
  document.getElementById("result");


/* =========================================================
   保存设置
========================================================= */

function saveSettings(){

  localStorage.setItem(
    "littleClawSettings",
    JSON.stringify(settings)
  );

}


/* =========================================================
   读取设置
========================================================= */

function loadSettings(){

  const saved =
    localStorage.getItem(
      "littleClawSettings"
    );

  if(!saved)return;

  try{

    const data =
      JSON.parse(saved);

    settings = {
      ...settings,
      ...data
    };

  }

  catch(e){

    console.log(
      "设置读取失败"
    );

  }

}


/* =========================================================
   应用设置
========================================================= */

function applySettings(){

  document.body.classList.remove(
    "theme-pink",
    "theme-lavender",
    "theme-blue",
    "theme-mint",
    "theme-yellow"
  );

  document.body.classList.add(
    "theme-" +
    settings.theme
  );


  document.getElementById(
    "pageTitle"
  ).textContent =
    "🧸 " +
    settings.title;


  document.getElementById(
    "pageSubtitle"
  ).textContent =
    settings.subtitle;


  document.getElementById(
    "exitText"
  ).textContent =
    settings.exit;


  document.getElementById(
    "successInput"
  ).value =
    settings.success;


  document.getElementById(
    "titleInput"
  ).value =
    settings.title;


  document.getElementById(
    "subtitleInput"
  ).value =
    settings.subtitle;


  document.getElementById(
    "exitInput"
  ).value =
    settings.exit;


  document.getElementById(
    "machineTitle"
  ).textContent =
    getMachineTitle(
      settings.title
    );


  document.querySelectorAll(
    ".color-choice"
  ).forEach(
    function(choice){

      choice.classList.toggle(
        "active",
        choice.dataset.theme ===
        settings.theme
      );

    }
  );

}


/* =========================================================
   机器内部英文标题
========================================================= */

function getMachineTitle(title){

  if(
    !title ||
    title.trim() === ""
  ){

    return "MY LITTLE CLAW";

  }

  return title
    .replace(
      /[^\x00-\x7F]/g,
      ""
    )
    .trim()
    .slice(0,24)
    .toUpperCase() ||
    "MY LITTLE CLAW";

}


/* =========================================================
   修改主题
========================================================= */

function changeTheme(theme){

  settings.theme =
    theme;

  applySettings();

  saveSettings();

}


/* =========================================================
   修改标题
========================================================= */

function updateTitle(value){

  settings.title =
    value ||
    "我的小小娃娃机 ♡";

  document.getElementById(
    "pageTitle"
  ).textContent =
    "🧸 " +
    settings.title;

  document.getElementById(
    "machineTitle"
  ).textContent =
    getMachineTitle(
      settings.title
    );

  saveSettings();

}


/* =========================================================
   修改副标题
========================================================= */

function updateSubtitle(value){

  settings.subtitle =
    value ||
    "上传你喜欢的图片，开始抓取吧 ✦";

  document.getElementById(
    "pageSubtitle"
  ).textContent =
    settings.subtitle;

  saveSettings();

}


/* =========================================================
   修改出奖口
========================================================= */

function updateExit(value){

  settings.exit =
    value ||
    "🎁 出奖口";

  document.getElementById(
    "exitText"
  ).textContent =
    settings.exit;

  saveSettings();

}


/* =========================================================
   修改成功文字
========================================================= */

function updateSuccess(value){

  settings.success =
    value ||
    "恭喜你获得了这个奖品 ♡";

  saveSettings();

}


/* =========================================================
   自定义面板
========================================================= */

function toggleCustomize(){

  document.getElementById(
    "customPanel"
  ).classList.toggle(
    "open"
  );

}


/* =========================================================
   恢复默认
========================================================= */

function resetCustomize(){

  if(
    !confirm(
      "要恢复默认设置吗？"
    )
  ){

    return;

  }


  settings = {

    theme:"pink",

    title:
      "我的小小娃娃机 ♡",

    subtitle:
      "上传你喜欢的图片，开始抓取吧 ✦",

    exit:
      "🎁 出奖口",

    success:
      "恭喜你获得了这个奖品 ♡"

  };


  applySettings();

  saveSettings();

}


/* =========================================================
   上传图片
========================================================= */

upload.addEventListener(
  "change",
  function(e){

    const files =
      [...e.target.files];


    files.forEach(
      function(file){

        const reader =
          new FileReader();


        reader.onload =
          function(event){

            prizes.push({

              image:
                event.target.result,

              name:
                file.name

            });


            renderPrizes();

          };


        reader.readAsDataURL(file);

      }
    );


    upload.value = "";

  }
);


/* =========================================================
   显示奖品
========================================================= */

function renderPrizes(){

  prizeBox.innerHTML = "";


  if(!prizes.length){

    prizeBox.innerHTML =
      '<div class="empty">' +
      '还没有奖品 ♡<br>' +
      '请先上传图片' +
      '</div>';

  }

  else{

    prizes.forEach(
      function(prize){

        const div =
          document.createElement(
            "div"
          );

        div.className =
          "prize";


        const img =
          document.createElement(
            "img"
          );

        img.src =
          prize.image;

        img.alt =
          prize.name;


        div.appendChild(
          img
        );


        prizeBox.appendChild(
          div
        );

      }
    );

  }


  count.textContent =
    prizes.length;

}


/* =========================================================
   左右移动
========================================================= */

function move(direction){

  if(busy)return;


  position +=
    direction * 10;


  position =
    Math.max(
      9,
      Math.min(
        91,
        position
      )
    );


  crane.style.left =
    position + "%";

}


/* =========================================================
   抓取
========================================================= */

function grab(){

  if(busy)return;


  if(!prizes.length){

    alert(
      "请先上传一些图片作为奖品 ♡"
    );

    return;

  }


  busy = true;


  /* 爪子张开 */

  claw.className =
    "claw open";


  /* 绳索下降 */

  setTimeout(
    function(){

      crane.classList.add(
        "dropping"
      );

    },
    100
  );


  /* 爪子闭合 */

  setTimeout(
    function(){

      claw.className =
        "claw closed";

    },
    650
  );


  /* 绳索收回 */

  setTimeout(
    function(){

      crane.classList.remove(
        "dropping"
      );

    },
    1000
  );


  /* 判断结果 */

  setTimeout(
    function(){

      const success =
        Math.random() < 0.65;


      if(success){

        const index =
          Math.floor(
            Math.random() *
            prizes.length
          );


        const prize =
          prizes[index];


        showSuccess(
          prize
        );


        prizes.splice(
          index,
          1
        );


        renderPrizes();

      }

      else{

        showFail();

      }


      claw.className =
        "claw open";


      busy = false;

    },
    1450
  );

}


/* =========================================================
   抓取成功
========================================================= */

function showSuccess(prize){

  document.getElementById(
    "resultIcon"
  ).textContent =
    "🎉";


  document.getElementById(
    "resultTitle"
  ).textContent =
    "抓取成功！";


  document.getElementById(
    "resultImg"
  ).src =
    prize.image;


  document.getElementById(
    "resultImg"
  ).alt =
    prize.name;


  document.getElementById(
    "resultImgWrap"
  ).style.display =
    "flex";


  document.getElementById(
    "resultText"
  ).textContent =
    settings.success;


  result.classList.add(
    "show"
  );

}


/* =========================================================
   没抓到
========================================================= */

function showFail(){

  document.getElementById(
    "resultIcon"
  ).textContent =
    "💦";


  document.getElementById(
    "resultTitle"
  ).textContent =
    "差一点点！";


  document.getElementById(
    "resultImgWrap"
  ).style.display =
    "none";


  document.getElementById(
    "resultText"
  ).textContent =
    "这次没有抓到，再试一次吧 ♡";


  result.classList.add(
    "show"
  );

}


/* =========================================================
   关闭结果
========================================================= */

function closeResult(){

  result.classList.remove(
    "show"
  );


  document.getElementById(
    "resultImgWrap"
  ).style.display =
    "flex";

}


/* =========================================================
   点击弹窗外部关闭
========================================================= */

result.addEventListener(
  "click",
  function(e){

    if(
      e.target === result
    ){

      closeResult();

    }

  }
);


/* =========================================================
   随机摆放
========================================================= */

function newGame(){

  prizes.sort(
    function(){

      return Math.random() - 0.5;

    }
  );


  renderPrizes();


  position =
    20 +
    Math.random() * 60;


  crane.style.left =
    position + "%";

}


/* =========================================================
   清空奖品
========================================================= */

function clearPrizes(){

  if(
    !confirm(
      "确定要清空所有奖品吗？"
    )
  ){

    return;

  }


  prizes = [];


  renderPrizes();

}


/* =========================================================
   初始化
========================================================= */

loadSettings();

applySettings();

renderPrizes();

</script>


</body>

</html>
