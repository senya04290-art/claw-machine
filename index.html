<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>我的娃娃机</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
    background:
        radial-gradient(circle at 15% 20%,rgba(255,255,255,.95) 0 2px,transparent 3px),
        radial-gradient(circle at 75% 30%,rgba(255,255,255,.9) 0 2px,transparent 3px),
        linear-gradient(135deg,#fff5fa,#f7f1ff);
    background-size:42px 42px,55px 55px,100% 100%;
    color:#5b4d57;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

/* =========================
   页面
========================= */

.page{
    width:100%;
    max-width:1000px;
    margin:0 auto;
    padding:24px 16px 50px;
}

.page-title{
    text-align:center;
    margin-bottom:18px;
}

.page-title h1{
    margin:0;
    font-size:30px;
    color:#8f6682;
    letter-spacing:2px;
}

.page-title p{
    margin:7px 0 0;
    color:#a28c99;
    font-size:13px;
}

/* =========================
   主布局
========================= */

.layout{
    display:flex;
    align-items:flex-start;
    justify-content:center;
    gap:22px;
}

.machine-wrap{
    width:100%;
    max-width:650px;
}

/* =========================
   娃娃机主体
========================= */

.machine{
    position:relative;
    width:100%;
    max-width:620px;
    margin:auto;
    padding:15px 15px 20px;
    background:linear-gradient(135deg,#fffafd,#fff);
    border:9px solid var(--machine-color,#c58fb7);
    border-radius:32px 32px 22px 22px;
    box-shadow:
        0 20px 45px rgba(100,65,85,.17),
        inset 0 2px 0 rgba(255,255,255,.9);
    overflow:hidden;
    transition:.3s;
}

.machine:before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:7px;
    background:rgba(255,255,255,.55);
}

/* =========================
   顶部标题
========================= */

.machine-top{
    height:92px;
    border:4px solid var(--machine-color,#c58fb7);
    border-radius:20px;
    background:
        radial-gradient(circle at 12% 25%,#fff 0 4px,transparent 5px),
        radial-gradient(circle at 24% 25%,#f2ca82 0 4px,transparent 5px),
        radial-gradient(circle at 36% 25%,#fff 0 4px,transparent 5px),
        radial-gradient(circle at 48% 25%,#f2ca82 0 4px,transparent 5px),
        radial-gradient(circle at 60% 25%,#fff 0 4px,transparent 5px),
        radial-gradient(circle at 72% 25%,#f2ca82 0 4px,transparent 5px),
        radial-gradient(circle at 84% 25%,#fff 0 4px,transparent 5px),
        #fff9ec;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    position:relative;
    overflow:hidden;
}

.machine-title{
    margin-top:10px;
    font-family:Georgia,"Times New Roman",serif;
    font-size:34px;
    font-weight:bold;
    font-style:italic;
    color:#587f99;
    letter-spacing:1px;
    text-align:center;
}

.machine-subtitle{
    margin-top:5px;
    font-family:Georgia,"Times New Roman",serif;
    font-size:12px;
    color:#64849a;
}

/* =========================
   玻璃区
========================= */

.glass{
    position:relative;
    height:390px;
    margin-top:12px;
    overflow:hidden;
    border:4px solid var(--machine-color,#c58fb7);
    border-radius:18px;
    background:
        linear-gradient(
            180deg,
            rgba(245,251,255,.96),
            rgba(234,246,251,.98)
        );
    box-shadow:
        inset 0 0 25px rgba(180,130,155,.1);
}

/* 玻璃高光 */

.glass:before{
    content:"";
    position:absolute;
    left:12px;
    top:18px;
    width:190px;
    height:9px;
    border-radius:20px;
    background:rgba(255,255,255,.58);
    transform:rotate(-28deg);
    z-index:20;
    pointer-events:none;
}

.glass:after{
    content:"";
    position:absolute;
    left:12px;
    top:58px;
    width:105px;
    height:6px;
    border-radius:20px;
    background:rgba(255,255,255,.45);
    transform:rotate(-28deg);
    z-index:20;
    pointer-events:none;
}

/* =========================
   长轨道
========================= */

.rail{
    position:absolute;
    top:23px;
    left:7%;
    width:86%;
    height:9px;
    border-radius:20px;
    background:linear-gradient(180deg,#fff,#d0c9cd);
    border:1px solid #c5bdc1;
    box-shadow:
        0 2px 4px rgba(70,50,60,.16),
        inset 0 1px 2px white;
    z-index:8;
}

/* =========================
   紫色小滑块
========================= */

.slider{
    position:absolute;
    top:17px;
    left:50%;
    width:34px;
    height:20px;
    transform:translateX(-50%);
    border-radius:8px;
    background:linear-gradient(180deg,#d7a0c7,#a96f9f);
    border:2px solid white;
    box-shadow:0 3px 7px rgba(90,50,90,.22);
    z-index:9;
    transition:left .35s ease;
}

/* =========================
   爪子整体
========================= */

.crane{
    position:absolute;
    top:21px;
    left:50%;
    width:54px;
    height:340px;
    transform:translateX(-50%);
    z-index:25;
    transition:left .35s ease;
}

/* 机头 */

.crane-head{
    position:absolute;
    top:0;
    left:50%;
    width:42px;
    height:27px;
    transform:translateX(-50%);
    border-radius:7px 7px 5px 5px;
    background:linear-gradient(
        180deg,
        var(--machine-color,#c58fb7),
        var(--machine-dark,#9d6c91)
    );
    box-shadow:
        0 4px 8px rgba(80,50,60,.15),
        inset 0 2px 2px rgba(255,255,255,.35);
    z-index:5;
}

.crane-head:after{
    content:"";
    position:absolute;
    left:50%;
    bottom:-4px;
    width:23px;
    height:5px;
    transform:translateX(-50%);
    border-radius:5px;
    background:#d1c7cc;
}

/* =========================
   细绳
========================= */

.cable{
    position:absolute;
    top:25px;
    left:50%;
    width:3px;
    height:45px;
    transform:translateX(-50%);
    border-radius:5px;
    background:
        linear-gradient(
            90deg,
            #8e858a,
            #f8f5f6,
            #8e858a
        );
    transition:height .7s cubic-bezier(.25,.8,.25,1);
    z-index:4;
}

.crane.dropping .cable{
    height:245px;
}

/* =========================
   CATCHU 风格爪子
========================= */

.claw{
    position:absolute;
    top:68px;
    left:50%;
    width:58px;
    height:67px;
    transform:translateX(-50%);
    z-index:8;
}

/* 中间圆形连接处 */

.claw-center{
    position:absolute;
    top:0;
    left:50%;
    width:19px;
    height:19px;
    transform:translateX(-50%);
    border-radius:50%;
    background:#fff;
    border:3px solid #8e858a;
    box-shadow:
        0 1px 2px rgba(60,50,60,.15),
        inset 0 0 0 1px #ddd6d8;
    z-index:4;
}

/* 两条爪臂 */

.claw-arm{
    position:absolute;
    top:13px;
    width:5px;
    height:44px;
    border-radius:5px;
    background:linear-gradient(
        90deg,
        #7f777c,
        #eee9eb,
        #7f777c
    );
    box-shadow:
        0 1px 2px rgba(60,50,60,.18);
    transform-origin:top center;
    transition:
        transform .35s ease,
        top .2s ease;
}

/* 左爪 */

.claw-arm.left{
    left:24px;
    transform:rotate(36deg);
}

/* 右爪 */

.claw-arm.right{
    right:24px;
    transform:rotate(-36deg);
}

/* 爪尖 */

.claw-arm:after{
    content:"";
    position:absolute;
    bottom:-3px;
    left:50%;
    width:6px;
    height:18px;
    border-radius:4px;
    background:#82797f;
    transform-origin:top center;
}

/* 左爪尖向内 */

.claw-arm.left:after{
    transform:translateX(-50%) rotate(-30deg);
}

/* 右爪尖向内 */

.claw-arm.right:after{
    transform:translateX(-50%) rotate(30deg);
}

/* 合爪 */

.claw.closed .claw-arm.left{
    transform:rotate(25deg);
}

.claw.closed .claw-arm.right{
    transform:rotate(-25deg);
}

.claw.closed .claw-arm:after{
    height:16px;
}

/* =========================
   被抓住的娃娃
========================= */

.grabbed-item{
    position:absolute;
    left:50%;
    top:310px;
    width:auto;
    max-width:100px;
    max-height:100px;
    transform:
        translate(-50%,0)
        rotate(-2deg)
        scale(.9);
    opacity:0;
    pointer-events:none;
    z-index:7;
    transition:
        opacity .25s ease,
        transform .35s ease;
}

.grabbed-item img{
    display:block;
    width:auto;
    height:auto;
    max-width:100px;
    max-height:100px;
    object-fit:contain;
    background:transparent;
    border:0;
    box-shadow:none;
    filter:drop-shadow(0 3px 3px rgba(70,50,70,.18));
}

.grabbed-item.show{
    opacity:1;
    transform:
        translate(-50%,0)
        rotate(-2deg)
        scale(1);
}

/* =========================
   娃娃区
========================= */

.prizes{
    position:absolute;
    left:10px;
    right:10px;
    bottom:0;
    height:145px;
    z-index:6;
    pointer-events:none;
}

/* 每个娃娃没有方框 */

.prize-slot{
    position:absolute;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    width:auto;
    height:auto;
    background:transparent;
    border:0;
    box-shadow:none;
    padding:0;
    transition:
        transform .35s ease,
        opacity .35s ease;
}

.prize-slot img{
    display:block;
    width:auto;
    height:auto;
    max-width:105px;
    max-height:105px;
    object-fit:contain;
    object-position:center bottom;
    background:transparent;
    border:0;
    border-radius:0;
    box-shadow:none;
    filter:drop-shadow(0 3px 3px rgba(80,60,80,.14));
}

/* 前后层次 */

.prize-slot.back{
    z-index:1;
}

.prize-slot.middle{
    z-index:3;
}

.prize-slot.front{
    z-index:5;
}

/* 空状态 */

.empty{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#a79ba3;
    font-size:13px;
    letter-spacing:1px;
    pointer-events:none;
}

/* =========================
   出口
========================= */

.exit{
    position:absolute;
    right:42px;
    bottom:10px;
    width:120px;
    height:66px;
    border-radius:12px 12px 8px 8px;
    background:#555064;
    border:8px solid #706c82;
    box-shadow:
        inset 0 3px 5px rgba(0,0,0,.18),
        0 2px 4px rgba(60,50,70,.15);
    z-index:7;
}

.exit:before{
    content:"";
    position:absolute;
    top:10px;
    left:13px;
    width:80px;
    height:8px;
    border-radius:20px;
    background:rgba(255,255,255,.55);
    transform:rotate(-28deg);
}

/* =========================
   操作台
========================= */

.controls{
    position:relative;
    z-index:30;
    margin-top:-1px;
    min-height:80px;
    padding:13px 18px;
    border-radius:15px;
    background:#fff7ec;
    border:4px solid var(--machine-color,#c58fb7);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

/* 摇杆 */

.joystick{
    width:95px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.stick-base{
    position:relative;
    width:80px;
    height:25px;
    border-radius:50%;
    background:#557e99;
    box-shadow:
        inset 0 2px 3px rgba(255,255,255,.3),
        0 2px 2px rgba(70,60,80,.15);
}

.stick{
    position:absolute;
    left:50%;
    bottom:10px;
    width:8px;
    height:38px;
    transform:translateX(-50%) rotate(-7deg);
    transform-origin:bottom center;
    border-radius:7px;
    background:#75616d;
}

.stick-ball{
    position:absolute;
    left:50%;
    top:-30px;
    width:36px;
    height:36px;
    transform:translateX(-50%);
    border-radius:50%;
    background:#fff;
    border:4px solid #5e849a;
    box-shadow:0 3px 4px rgba(60,50,70,.15);
}

/* 抓取按钮 */

.grab-btn{
    min-width:94px;
    height:38px;
    border:0;
    border-radius:6px;
    background:#50485f;
    color:#fff;
    font-weight:700;
    letter-spacing:.5px;
    box-shadow:0 3px 0 #3e384b;
    transition:.15s;
}

.grab-btn:hover{
    transform:translateY(-1px);
}

.grab-btn:active{
    transform:translateY(2px);
    box-shadow:0 1px 0 #3e384b;
}

.grab-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

/* DROP 按钮 */

.drop-btn{
    width:82px;
    height:42px;
    border-radius:50%;
    border:0;
    background:#a7d9e9;
    color:#4f8199;
    font-weight:bold;
}

/* =========================
   机器底部
========================= */

.machine-bottom{
    position:relative;
    min-height:110px;
    padding-top:15px;
}

.coin-box{
    position:absolute;
    left:35px;
    top:18px;
    width:90px;
    height:67px;
    border:3px solid #5e849a;
    border-radius:10px;
    background:#e8f5fa;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.coin-slot{
    width:9px;
    height:32px;
    border-radius:4px;
    background:#5d879f;
}

.coin-text{
    margin-top:4px;
    font-size:10px;
    color:#52758a;
    font-weight:bold;
}

.prize-out-label{
    position:absolute;
    right:58px;
    top:5px;
    color:#fff;
    font-size:14px;
    font-weight:bold;
    letter-spacing:4px;
}

.machine-feet{
    display:flex;
    justify-content:space-between;
    padding:0 48px;
}

.machine-feet span{
    width:58px;
    height:15px;
    border-radius:0 0 10px 10px;
    background:var(--machine-color,#c58fb7);
}

/* =========================
   编辑器
========================= */

.editor{
    margin-top:18px;
    width:100%;
    max-width:620px;
    margin-left:auto;
    margin-right:auto;
    background:rgba(255,255,255,.92);
    border:2px solid #eadbe5;
    border-radius:18px;
    box-shadow:0 10px 25px rgba(100,65,85,.08);
    overflow:hidden;
}

.editor-header{
    padding:15px 18px;
    font-weight:bold;
    color:#805f74;
    border-bottom:1px solid #eee1e9;
}

.editor-section{
    border-bottom:1px solid #eee1e9;
}

.editor-section:last-child{
    border-bottom:0;
}

.section-title{
    padding:13px 18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
    color:#765a6d;
    font-weight:bold;
}

.section-title span:last-child{
    transition:.25s;
}

.section-content{
    padding:0 18px 16px;
}

.editor-section.collapsed .section-content{
    display:none;
}

.editor-section.collapsed .section-title span:last-child{
    transform:rotate(-90deg);
}

.upload-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.upload-label,
.small-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:36px;
    padding:0 14px;
    border:0;
    border-radius:9px;
    background:#eee3ec;
    color:#765b70;
    cursor:pointer;
    font-size:13px;
}

.upload-label{
    background:#d7b5d0;
    color:#fff;
}

.upload-label input{
    display:none;
}

.small-btn:hover,
.upload-label:hover{
    filter:brightness(.97);
}

.upload-list{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:12px;
}

.upload-thumb{
    position:relative;
    width:58px;
    height:58px;
    border-radius:9px;
    background:#faf7fa;
    border:1px solid #eadfe7;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.upload-thumb img{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
}

.upload-thumb small{
    position:absolute;
    right:2px;
    top:2px;
    background:rgba(80,60,80,.7);
    color:#fff;
    border-radius:50%;
    width:16px;
    height:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:10px;
}

.field{
    margin-bottom:12px;
}

.field:last-child{
    margin-bottom:0;
}

.field label{
    display:block;
    margin-bottom:6px;
    color:#826b79;
    font-size:13px;
}

.text-input,
.number-input{
    width:100%;
    height:38px;
    padding:0 10px;
    border:1px solid #dfd1db;
    border-radius:8px;
    background:#fff;
    outline:none;
}

.text-input:focus,
.number-input:focus{
    border-color:#c59ab8;
}

.color-row{
    display:flex;
    flex-wrap:wrap;
    gap:9px;
}

.color-choice{
    width:32px;
    height:32px;
    border-radius:50%;
    border:3px solid #fff;
    box-shadow:0 0 0 1px #ddd;
}

.custom-color{
    width:38px;
    height:32px;
    border:0;
    padding:0;
    background:transparent;
}

.range-row{
    display:flex;
    align-items:center;
    gap:10px;
}

.range-row input{
    flex:1;
}

.rate-value{
    width:45px;
    text-align:center;
    font-weight:bold;
    color:#8b6d80;
}

.switch-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:10px;
    color:#826b79;
    font-size:13px;
}

.switch{
    position:relative;
    width:46px;
    height:25px;
}

.switch input{
    display:none;
}

.switch-slider{
    position:absolute;
    inset:0;
    border-radius:20px;
    background:#d8cbd4;
    transition:.25s;
    cursor:pointer;
}

.switch-slider:before{
    content:"";
    position:absolute;
    width:19px;
    height:19px;
    left:3px;
    top:3px;
    border-radius:50%;
    background:white;
    transition:.25s;
    box-shadow:0 2px 3px rgba(0,0,0,.15);
}

.switch input:checked + .switch-slider{
    background:#c394b8;
}

.switch input:checked + .switch-slider:before{
    transform:translateX(21px);
}

/* =========================
   弹窗
========================= */

.modal{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:rgba(60,45,60,.38);
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:100;
}

.modal.show{
    opacity:1;
    pointer-events:auto;
}

.modal-box{
    width:min(360px,100%);
    padding:28px 24px 22px;
    background:#fffafc;
    border-radius:22px;
    text-align:center;
    box-shadow:0 20px 60px rgba(50,40,60,.22);
    transform:translateY(15px) scale(.96);
    transition:.25s;
}

.modal.show .modal-box{
    transform:translateY(0) scale(1);
}

.modal-icon{
    font-size:52px;
    margin-bottom:8px;
}

.modal-title{
    font-size:22px;
    font-weight:bold;
    color:#76586d;
}

.modal-message{
    margin-top:8px;
    color:#978793;
    font-size:14px;
    line-height:1.6;
}

.modal-close{
    margin-top:18px;
    width:110px;
    height:38px;
    border:0;
    border-radius:10px;
    background:#a8789e;
    color:white;
    font-weight:bold;
}

/* =========================
   成功闪光
========================= */

.sparkles{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:50;
    overflow:hidden;
}

.spark{
    position:absolute;
    width:7px;
    height:7px;
    background:#fff;
    border-radius:50%;
    opacity:0;
}

.spark.animate{
    animation:spark .8s ease-out forwards;
}

@keyframes spark{
    0%{
        opacity:1;
        transform:translate(0,0) scale(.5);
    }
    100%{
        opacity:0;
        transform:translate(var(--x),var(--y)) scale(1.3);
    }
}

/* =========================
   响应式
========================= */

@media(max-width:700px){

    .page{
        padding:15px 8px 35px;
    }

    .machine{
        border-width:7px;
        padding:11px 10px 15px;

            <!-- 编辑器 -->
            <div class="editor">

                <div class="editor-header">

                <!-- 图片 -->
                <div class="editor-section">

                    <div class="section-title">

                    <div class="section-content">

                        <div class="upload-row">

                            <label class="upload-label">

                                >
                            </label>

                            <button
                                class="small-btn"
                                id="randomBtn"

                                ✨ 随机摆放
                            </button>

                            <button
                                class="small-btn"
                                id="clearBtn"
                            >
                                清空
                            </button>

                        </div>

                        <div
                            class="upload-list"
                            id="uploadList"
                        ></div>

                    </div>

                </div>

                <!-- 外观 -->
                <div class="editor-section">

                    <div class="section-title">
                        <span>🎨 外观</span>
                        <span>⌄</span>
                    </div>

                                ></button>

                                <button
                                    class="color-choice"

                                    style="background:#d9a1a1"
                                ></button>

                                <button
                                    class="color-choice"
                                    data-color="#a7c49a"
                                    style="background:#a7c49a"
                                ></button>

                                <button
                                    class="color-choice"
                                    data-color="#b19bc8"
                                    style="background:#b19bc8"
                                ></button>

                                <input
                                    class="custom-color"

                            <label>
                                副标题

                            >

                        </div>

                    </div>

                </div>

                <!-- 抓取设置 -->
                <div class="editor-section">

                    <div class="section-title">
                        <span>🎯 抓取设置</span>
                        <span>⌄</span>
                    </div>

                    <div class="section-content">

                        <div class="field">

                            <label>
                                抓取成功率
                            </label>

                            <div class="range-row">

                                <input
                                    id="successRate"
                                    type="range"
                                    min="1"
                                    max="100"
                                    value="70"
                                >

                                <div
                                    class="rate-value"
                                    id="rateValue"
                                >
                                    70%
                                </div>

                            </div>

                        </div>

                        <div class="switch-row">

                            <span>
                                ✨ 成功特效
                            </span>

                            <label class="switch">

                                <input
                                    id="effectsSwitch"
                                    type="checkbox"
                                    checked
                                >

                                <span class="switch-slider"></span>

                            </label>

                            <span>
                                💾 自动保存
                            </span>

                                <input

                                >

                <!-- 文案 -->
                <div class="editor-section">

                    <div class="section-title">
                        <span>💬 提示文字</span>
                        <span>⌄</span>
                    </div>

                    <div class="section-content">

                        <div class="field">

                            <label>
                                抓取成功
                            </label>

                            <input
                                class="text-input"
                                id="successMessage"
                                value="恭喜！抓到了 ♡"

                            <label>
                                抓取失败
                            </label>

                            <input

</div>


<!-- 弹窗 -->

<div
    class="modal"
    id="modal"
>

    <div class="modal-box">

            class="modal-icon"
            id="modalIcon"

            🎉
        </div>

        <div

        >

<script>

/* =========================================================
   基础变量
========================================================= */

const machine = document.getElementById("machine");
const glass = document.getElementById("glass");

const crane = document.getElementById("crane");
const slider = document.getElementById("slider");
const claw = document.getElementById("claw");

const prizes = document.getElementById("prizes");
const empty = document.getElementById("empty");

const grabbedItem = document.getElementById("grabbedItem");
const grabbedImage = document.getElementById("grabbedImage");

const grabBtn = document.getElementById("grabBtn");
const dropBtn = document.getElementById("dropBtn");

const imageInput = document.getElementById("imageInput");
const uploadList = document.getElementById("uploadList");

const randomBtn = document.getElementById("randomBtn");
const clearBtn = document.getElementById("clearBtn");

const titleInput = document.getElementById("titleInput");
const subtitleInput = document.getElementById("subtitleInput");

const machineTitle = document.getElementById("machineTitle");
const machineSubtitle = document.getElementById("machineSubtitle");

const successRate = document.getElementById("successRate");
const rateValue = document.getElementById("rateValue");

const effectsSwitch = document.getElementById("effectsSwitch");
const autoSaveSwitch = document.getElementById("autoSaveSwitch");

const successMessage = document.getElementById("successMessage");
const failMessage = document.getElementById("failMessage");

const customColor = document.getElementById("customColor");

const modal = document.getElementById("modal");
const modalIcon = document.getElementById("modalIcon");
const modalTitle = document.getElementById("modalTitle");
const modalMessage = document.getElementById("modalMessage");
const modalClose = document.getElementById("modalClose");

const sparkles = document.getElementById("sparkles");


/* =========================================================
   状态
========================================================= */

let uploadedImages = [];

let prizePositions = [];

let cranePosition = 50;

let isPlaying = false;


/* =========================================================
   工具
========================================================= */

function wait(ms){
    return new Promise(resolve => setTimeout(resolve,ms));
}

function clamp(value,min,max){
    return Math.max(min,Math.min(max,value));
}


/* =========================================================
   随机娃娃位置
========================================================= */

function createRandomPosition(index){

    /*
       让娃娃像 CATCHU 那样：
       - 不规则
       - 有前后层次
       - 有轻微旋转
       - 不使用方框
    */

    const count = Math.max(uploadedImages.length,1);

    const usableWidth = 88;

    let x;

    if(count <= 4){

        const preset = [
            10,
            32,
            55,
            77
        ];

        x = preset[index % preset.length];

    }else{

        x = 5 + Math.random() * 88;

    }

    let y;

    const row = index % 3;

    if(row === 0){
        y = 5 + Math.random() * 10;
    }else if(row === 1){
        y = 35 + Math.random() * 13;
    }else{
        y = 58 + Math.random() * 13;
    }

    let rotation =
        -7 + Math.random() * 14;

    let scale =
        .78 + Math.random() * .25;

    let layer;

    if(row === 0){
        layer = "back";
    }else if(row === 1){
        layer = "middle";
    }else{
        layer = "front";
    }

    return {
        x,
        y,
        rotation,
        scale,
        layer
    };
}


/* =========================================================
   生成全部位置
========================================================= */

function regeneratePositions(){

    prizePositions = [];

    for(let i=0;i<uploadedImages.length;i++){

        prizePositions.push(
            createRandomPosition(i)
        );

    }
}


/* =========================================================
   渲染娃娃
========================================================= */

function renderPrizes(){

    prizes.innerHTML = "";

    if(uploadedImages.length === 0){

        empty.style.display = "flex";

        return;
    }

    empty.style.display = "none";


    uploadedImages.forEach((src,index)=>{

        if(!prizePositions[index]){
            prizePositions[index] =
                createRandomPosition(index);
        }

        const pos =
            prizePositions[index];

        const item =
            document.createElement("div");

        item.className =
            "prize-slot " + pos.layer;

        item.dataset.index = index;

        item.style.left =
            pos.x + "%";

        item.style.bottom =
            pos.y + "px";

        item.style.transform =
            `translateX(-50%) rotate(${pos.rotation}deg) scale(${pos.scale})`;

        const img =
            document.createElement("img");

        img.src = src;

        img.alt = "prize";

        item.appendChild(img);

        prizes.appendChild(item);

    });

}


/* =========================================================
   上传列表
========================================================= */

function renderUploadList(){

    uploadList.innerHTML = "";

    uploadedImages.forEach((src,index)=>{

        const thumb =
            document.createElement("div");

        thumb.className =
            "upload-thumb";

        const img =
            document.createElement("img");

        img.src = src;

        const number =
            document.createElement("small");

        number.textContent =
            index + 1;

        thumb.appendChild(img);

        thumb.appendChild(number);

        uploadList.appendChild(thumb);

    });

}


/* =========================================================
   图片上传
========================================================= */

imageInput.addEventListener("change",function(){

    const files =
        Array.from(this.files || []);

    if(files.length === 0){
        return;
    }

    let loaded = 0;

    files.forEach(file=>{

        if(!file.type.startsWith("image/")){
            loaded++;
            return;
        }

        const reader =
            new FileReader();

        reader.onload = function(e){

            uploadedImages.push(
                e.target.result
            );

            loaded++;

            if(loaded === files.length){

                regeneratePositions();

                renderUploadList();

                renderPrizes();

                saveData();

            }

        };

        reader.readAsDataURL(file);

    });

    this.value = "";

});


/* =========================================================
   随机摆放
========================================================= */

randomBtn.addEventListener("click",function(){

    if(uploadedImages.length === 0){
        return;
    }

    regeneratePositions();

    renderPrizes();

    saveData();

});


/* =========================================================
   清空
========================================================= */

clearBtn.addEventListener("click",function(){

    if(uploadedImages.length === 0){
        return;
    }

    const ok =
        confirm("确定要清空所有娃娃吗？");

    if(!ok){
        return;
    }

    uploadedImages = [];

    prizePositions = [];

    renderUploadList();

    renderPrizes();

    saveData();

});


/* =========================================================
   移动爪子
========================================================= */

function moveCrane(percent){

    if(isPlaying){
        return;
    }

    cranePosition =
        clamp(percent,8,92);

    crane.style.left =
        cranePosition + "%";

    slider.style.left =
        cranePosition + "%";

}


/* =========================================================
   左右按钮
========================================================= */

function moveLeft(){

    moveCrane(
        cranePosition - 9
    );

}

function moveRight(){

    moveCrane(
        cranePosition + 9
    );

}


/* =========================================================
   键盘控制
========================================================= */

document.addEventListener("keydown",function(e){

    if(isPlaying){
        return;
    }

    if(e.key === "ArrowLeft"){
        moveLeft();
    }

    if(e.key === "ArrowRight"){
        moveRight();
    }

    if(
        e.key === " " ||
        e.key === "Enter"
    ){

        if(
            document.activeElement.tagName !== "INPUT" &&
            document.activeElement.tagName !== "BUTTON"
        ){

            grab();

        }

    }

});


/* =========================================================
   点击玻璃区域左右移动
========================================================= */

glass.addEventListener("click",function(e){

    if(isPlaying){
        return;
    }

    if(
        e.target.closest(".prize-slot") ||
        e.target.closest(".exit") ||
        e.target.closest(".crane")
    ){
        return;
    }

    const rect =
        glass.getBoundingClientRect();

    const percent =
        ((e.clientX - rect.left) / rect.width) * 100;

    moveCrane(percent);

});


/* =========================================================
   DROP
========================================================= */

dropBtn.addEventListener("click",function(){

    grab();

});


/* =========================================================
   PLAY
========================================================= */

grabBtn.addEventListener("click",function(){

    grab();

});


/* =========================================================
   抓取
========================================================= */

async function grab(){

    if(isPlaying){
        return;
    }

    if(uploadedImages.length === 0){

        showModal(
            "🧸",
            "没有娃娃啦",
            "先上传一些图片，再来抓吧 ♡"
        );

        return;
    }


    isPlaying = true;

    grabBtn.disabled = true;
    dropBtn.disabled = true;


    /* -----------------------------------------
       随机选择一个娃娃
    ----------------------------------------- */

    const grabbedIndex =
        Math.floor(
            Math.random() *
            uploadedImages.length
        );

    const grabbedSrc =
        uploadedImages[grabbedIndex];

    grabbedImage.src =
        grabbedSrc;


    /* -----------------------------------------
       让爪子先移动到随机位置
    ----------------------------------------- */

    const targetPosition =
        prizePositions[grabbedIndex]
        ? prizePositions[grabbedIndex].x
        : 50;

    cranePosition =
        clamp(targetPosition,8,92);

    crane.style.left =
        cranePosition + "%";

    slider.style.left =
        cranePosition + "%";

    await wait(450);


    /* -----------------------------------------
       爪子下降
    ----------------------------------------- */

    crane.classList.add("dropping");

    await wait(850);


    /* -----------------------------------------
       合爪
    ----------------------------------------- */

    claw.classList.add("closed");

    await wait(420);


    /* -----------------------------------------
       娃娃出现，被爪子夹住
    ----------------------------------------- */

    grabbedItem.classList.add("show");

    /*
       让被抓娃娃出现在爪子正下方。
       这里使用 CSS top 配合 crane 的下降状态。
    */

    grabbedItem.style.left =
        cranePosition + "%";

    grabbedItem.style.top =
        "292px";

    await wait(350);


    /* -----------------------------------------
       随爪子抬起
    ----------------------------------------- */

    crane.classList.remove("dropping");

    /*
       抓起来以后让娃娃往上移动。
    */

    grabbedItem.style.top =
        "73px";

    await wait(900);


    /* -----------------------------------------
       判断成功率
    ----------------------------------------- */

    let rate =
        parseInt(
            successRate.value,
            10
        );

    if(isNaN(rate)){
        rate = 70;
    }

    rate =
        clamp(rate,1,100);

    const success =
        Math.random() * 100 < rate;


    /* =================================================
       成功
    ================================================= */

    if(success){

        /*
           从实际奖品数组删除。
        */

        uploadedImages.splice(
            grabbedIndex,
            1
        );

        prizePositions.splice(
            grabbedIndex,
            1
        );


        renderUploadList();

        renderPrizes();

        saveData();


        /*
           成功特效
        */

        if(effectsSwitch.checked){

            createSparkles();

        }


        await wait(250);


        showModal(
            "🎉",
            "抓取成功！",
            successMessage.value ||
            "恭喜！抓到了 ♡"
        );

    }

    /* =================================================
       失败
    ================================================= */

    else{

        /*
           娃娃掉下来。
        */

        grabbedItem.style.top =
            "300px";

        await wait(450);


        showModal(
            "🥺",
            "差一点！",
            failMessage.value ||
            "差一点点，再试一次吧！"
        );

    }


    /* -----------------------------------------
       清理动画
    ----------------------------------------- */

    await wait(400);

    grabbedItem.classList.remove("show");

    grabbedImage.src = "";

    await wait(200);

    claw.classList.remove("closed");

    await wait(300);


    /*
       重置位置
    */

    grabbedItem.style.top =
        "310px";

    grabbedItem.style.left =
        "50%";


    isPlaying = false;

    grabBtn.disabled = false;
    dropBtn.disabled = false;

}


/* =========================================================
   成功闪光
========================================================= */

function createSparkles(){

    sparkles.innerHTML = "";

    const amount = 18;

    for(let i=0;i<amount;i++){

        const spark =
            document.createElement("div");

        spark.className =
            "spark";

        spark.style.left =
            (35 + Math.random()*30) + "%";

        spark.style.top =
            (30 + Math.random()*35) + "%";

        spark.style.setProperty(
            "--x",
            (-100 + Math.random()*200) + "px"
        );

        spark.style.setProperty(
            "--y",
            (-100 + Math.random()*200) + "px"
        );

        spark.style.animationDelay =
            (Math.random()*.15) + "s";

        sparkles.appendChild(spark);

        requestAnimationFrame(()=>{
            spark.classList.add("animate");
        });

    }

}


/* =========================================================
   弹窗
========================================================= */

function showModal(
    icon,
    title,
    message
){

    modalIcon.textContent =
        icon;

    modalTitle.textContent =
        title;

    modalMessage.textContent =
        message;

    modal.classList.add("show");

}

modalClose.addEventListener(
    "click",
    function(){

        modal.classList.remove("show");

    }
);

modal.addEventListener(
    "click",
    function(e){

        if(e.target === modal){

            modal.classList.remove("show");

        }

    }
);


/* =========================================================
   标题
========================================================= */

titleInput.addEventListener(
    "input",
    function(){

        machineTitle.textContent =
            this.value || "CATCH ME!";

        saveData();

    }
);


subtitleInput.addEventListener(
    "input",
    function(){

        machineSubtitle.textContent =
            this.value ||
            "♡ YOUR FAVORITE, NOW A PRIZE ♡";

        saveData();

    }
);


/* =========================================================
   成功率
========================================================= */

successRate.addEventListener(
    "input",
    function(){

        rateValue.textContent =
            this.value + "%";

        saveData();

    }
);


/* =========================================================
   颜色
========================================================= */

function hexToDark(hex){

    /*
       简单计算一个较深颜色。
    */

    const clean =
        hex.replace("#","");

    const r =
        parseInt(clean.substring(0,2),16);

    const g =
        parseInt(clean.substring(2,4),16);

    const b =
        parseInt(clean.substring(4,6),16);

    const dr =
        Math.round(r * .78);

    const dg =
        Math.round(g * .78);

    const db =
        Math.round(b * .78);

    return "#" +
        [dr,dg,db]
        .map(v =>
            v.toString(16).padStart(2,"0")
        )
        .join("");

}


function setMachineColor(color){

    machine.style.setProperty(
        "--machine-color",
        color
    );

    machine.style.setProperty(
        "--machine-dark",
        hexToDark(color)
    );

    customColor.value =
        color;

    saveData();

}


document.querySelectorAll(
    ".color-choice"
).forEach(button=>{

    button.addEventListener(
        "click",
        function(){

            setMachineColor(
                this.dataset.color
            );

        }
    );

});


customColor.addEventListener(
    "input",
    function(){

        setMachineColor(
            this.value
        );

    }
);


/* =========================================================
   编辑器折叠
========================================================= */

document.querySelectorAll(
    ".section-title"
).forEach(title=>{

    title.addEventListener(
        "click",
        function(){

            const section =
                this.parentElement;

            section.classList.toggle(
                "collapsed"
            );

        }
    );

});


/* =========================================================
   LocalStorage
========================================================= */

const STORAGE_KEY =
    "my_virtual_claw_machine_v3";


function saveData(){

    if(!autoSaveSwitch.checked){
        return;
    }

    try{

        const data = {

            uploadedImages,

            prizePositions,

            cranePosition,

            title:
                titleInput.value,

            subtitle:
                subtitleInput.value,

            successRate:
                successRate.value,

            effects:
                effectsSwitch.checked,

            color:
                machine.style
                .getPropertyValue(
                    "--machine-color"
                )
                .trim(),

            successMessage:
                successMessage.value,

            failMessage:
                failMessage.value

        };

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(data)
        );

    }catch(error){

        console.warn(
            "自动保存失败:",
            error
        );

    }

}


function loadData(){

    try{

        const raw =
            localStorage.getItem(
                STORAGE_KEY
            );

        if(!raw){
            return;
        }

        const data =
            JSON.parse(raw);


        if(Array.isArray(data.uploadedImages)){

            uploadedImages =
                data.uploadedImages;

        }


        if(Array.isArray(data.prizePositions)){

            prizePositions =
                data.prizePositions;

        }


        if(
            typeof data.cranePosition ===
            "number"
        ){

            cranePosition =
                clamp(
                    data.cranePosition,
                    8,
                    92
                );

        }


        if(data.title !== undefined){

            titleInput.value =
                data.title;

            machineTitle.textContent =
                data.title;

        }


        if(data.subtitle !== undefined){

            subtitleInput.value =
                data.subtitle;

            machineSubtitle.textContent =
                data.subtitle;

        }


        if(data.successRate !== undefined){

            successRate.value =
                data.successRate;

            rateValue.textContent =
                data.successRate + "%";

        }


        if(data.effects !== undefined){

            effectsSwitch.checked =
                data.effects;

        }


        if(data.color){

            machine.style.setProperty(
                "--machine-color",
                data.color
            );

            machine.style.setProperty(
                "--machine-dark",
                hexToDark(data.color)
            );

            customColor.value =
                data.color;

        }


        if(data.successMessage !== undefined){

            successMessage.value =
                data.successMessage;

        }


        if(data.failMessage !== undefined){

            failMessage.value =
                data.failMessage;

        }

    }catch(error){

        console.warn(
            "读取保存数据失败:",
            error
        );

    }

}


/* =========================================================
   自动保存开关
========================================================= */

autoSaveSwitch.addEventListener(
    "change",
    function(){

        if(this.checked){

            saveData();

        }

    }
);


/* =========================================================
   页面初始化
========================================================= */

loadData();


/*
   如果旧数据没有位置，
   自动生成。
*/

if(
    prizePositions.length !==
    uploadedImages.length
){

    regeneratePositions();

}


renderUploadList();

renderPrizes();


crane.style.left =
    cranePosition + "%";

slider.style.left =
    cranePosition + "%";


rateValue.textContent =
    successRate.value + "%";


/* =========================================================
   初始化完成
========================================================= */

console.log(
    "♡ Virtual Claw Machine Ready ♡"
);

</script>

</body>
</html>
