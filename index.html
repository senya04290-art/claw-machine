<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>我的小小娃娃机 ♡</title>

<style>

/* =========================
   基础
========================= */

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:
        "Arial Rounded MT Bold",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #ffeaf5 0%,
            #eee7ff 50%,
            #e4f6ff 100%
        );

    color:#6b5470;
    display:flex;
    justify-content:center;
    padding:28px 15px 45px;
}


/* =========================
   页面
========================= */

.page{
    width:min(760px,100%);
}

.header{
    text-align:center;
    margin-bottom:18px;
}

.header h1{
    margin:0;
    font-size:30px;
    color:#9b70b2;
    letter-spacing:2px;
}

.header p{
    margin:8px 0 0;
    color:#a78eaa;
    font-size:14px;
}


/* =========================
   娃娃机
========================= */

.machine{
    position:relative;

    width:100%;
    height:560px;

    overflow:hidden;

    border:6px solid #e8a7cf;
    border-radius:30px;

    background:
        linear-gradient(
            to bottom,
            #eaf7ff 0%,
            #e9f6ff 61%,
            #f9dbea 61%,
            #f9dbea 100%
        );

    box-shadow:
        0 15px 35px rgba(139,91,142,.18),
        inset 0 0 0 3px rgba(255,255,255,.7);
}


/* 顶部装饰 */

.machine-title{
    position:absolute;
    left:50%;
    top:15px;

    transform:translateX(-50%);

    z-index:10;

    padding:6px 22px;

    border-radius:999px;

    background:rgba(255,255,255,.78);

    color:#9a6baa;

    font-size:12px;
    font-weight:bold;

    letter-spacing:2px;

    box-shadow:
        0 4px 10px rgba(137,100,145,.1);
}


/* =========================
   横轨
========================= */

.rail{
    position:absolute;

    left:34px;
    right:34px;

    top:75px;

    height:10px;

    border-radius:999px;

    background:
        linear-gradient(
            to bottom,
            #b98bc9,
            #9566ae
        );

    box-shadow:
        0 3px 0 #7e5595,
        0 5px 10px rgba(111,76,126,.18);

    z-index:5;
}


/* =========================
   整个横向移动组件
========================= */

.crane{
    position:absolute;

    top:78px;
    left:50%;

    width:78px;
    height:280px;

    transform:translateX(-50%);

    transition:left .35s ease;

    z-index:20;
}


/* =========================
   紫色滑块
========================= */

.crane-head{
    position:absolute;

    top:-1px;
    left:50%;

    transform:translateX(-50%);

    width:48px;
    height:34px;

    border-radius:11px 11px 8px 8px;

    background:
        linear-gradient(
            135deg,
            #c99ade,
            #9a67b3
        );

    border:3px solid #8b5ca3;

    box-shadow:
        0 4px 0 #7d5294,
        0 6px 10px rgba(105,69,124,.2);
}


/* 滑块里面的小高光 */

.crane-head::before{
    content:"";

    position:absolute;

    left:8px;
    right:8px;
    top:5px;

    height:6px;

    border-radius:999px;

    background:rgba(255,255,255,.35);
}


/* 滑轮 */

.crane-head::after{
    content:"";

    position:absolute;

    left:50%;
    bottom:-7px;

    transform:translateX(-50%);

    width:14px;
    height:14px;

    border-radius:50%;

    background:#fff;

    border:3px solid #8d61a5;
}


/* =========================
   固定绳索
========================= */

.cable{
    position:absolute;

    left:50%;
    top:33px;

    transform:translateX(-50%);

    width:4px;
    height:118px;

    border-radius:999px;

    background:
        linear-gradient(
            to right,
            #d99abf,
            #f2c2db,
            #c984b1
        );

    box-shadow:
        1px 0 2px rgba(126,77,115,.18);

    z-index:2;
}


/*
   绳索底部固定连接点
*/

.cable::after{
    content:"";

    position:absolute;

    left:50%;
    bottom:-7px;

    transform:translateX(-50%);

    width:16px;
    height:16px;

    border-radius:50%;

    background:#fff;

    border:3px solid #b27fc2;

    box-shadow:
        0 2px 4px rgba(102,69,120,.15);
}


/* =========================
   爪子区域
========================= */

.claw-anchor{
    position:absolute;

    left:50%;
    top:150px;

    transform:translateX(-50%);

    width:72px;
    height:120px;

    z-index:4;
}


/* 固定的小连接杆 */

.claw-neck{
    position:absolute;

    left:50%;
    top:0;

    transform:translateX(-50%);

    width:8px;
    height:20px;

    border-radius:5px;

    background:
        linear-gradient(
            to right,
            #aa78bb,
            #d9b0e5,
            #9866ad
        );

    box-shadow:
        0 2px 3px rgba(101,67,118,.15);
}


/* =========================
   ★ 缩小后的爪子本体 ★
========================= */

.claw-body{
    position:absolute;

    left:50%;
    top:13px;

    /*
       原来：
       78 × 105

       现在：
       64 × 88

       不使用 scale，
       直接调整实际尺寸。
    */

    width:64px;
    height:88px;

    transform:
        translateX(-50%)
        translateY(0);

    transform-origin:top center;

    transition:
        transform .48s cubic-bezier(.2,.75,.3,1);

    z-index:5;
}


/*
   抓取时只有爪子本体下降
*/

.claw-anchor.grabbing .claw-body{
    transform:
        translateX(-50%)
        translateY(68px);
}


/* =========================
   爪子中心连接块
========================= */

.claw-core{
    position:absolute;

    left:50%;
    top:0;

    transform:translateX(-50%);

    width:20px;
    height:20px;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #f6e7fb,
            #c08bd1 60%,
            #9460a9 100%
        );

    border:3px solid #87579f;

    box-shadow:
        0 3px 4px rgba(92,60,110,.2);

    z-index:10;
}


/* =========================
   爪子两侧上半部分
========================= */

.arm-left-upper{
    position:absolute;

    /*
       相对于 64px 爪子重新定位
    */

    left:24px;
    top:14px;

    width:7px;
    height:29px;

    border-radius:999px;

    background:
        linear-gradient(
            to right,
            #a86cbd,
            #d4a0df,
            #9560aa
        );

    transform:
        rotate(34deg);

    transform-origin:top center;

    box-shadow:
        1px 2px 3px rgba(93,61,111,.18);
}


.arm-right-upper{
    position:absolute;

    right:24px;
    top:14px;

    width:7px;
    height:29px;

    border-radius:999px;

    background:
        linear-gradient(
            to right,
            #a86cbd,
            #d4a0df,
            #9560aa
        );

    transform:
        rotate(-34deg);

    transform-origin:top center;

    box-shadow:
        -1px 2px 3px rgba(93,61,111,.18);
}


/* =========================
   ★ 缩小后的左右下半部分
========================= */

.arm-left-lower{
    position:absolute;

    left:11px;
    top:36px;

    width:7px;
    height:36px;

    border-radius:999px;

    background:
        linear-gradient(
            to right,
            #a66abc,
            #d4a0df,
            #925fa8
        );

    transform:
        rotate(-30deg);

    transform-origin:top center;

    transition:
        transform .35s ease;

    box-shadow:
        1px 2px 3px rgba(93,61,111,.18);
}


.arm-right-lower{
    position:absolute;

    right:11px;
    top:36px;

    width:7px;
    height:36px;

    border-radius:999px;

    background:
        linear-gradient(
            to right,
            #a66abc,
            #d4a0df,
            #925fa8
        );

    transform:
        rotate(30deg);

    transform-origin:top center;

    transition:
        transform .35s ease;

    box-shadow:
        -1px 2px 3px rgba(93,61,111,.18);
}


/* =========================
   抓取闭合
========================= */

.claw-anchor.closed .arm-left-lower{
    transform:
        rotate(-5deg);
}


.claw-anchor.closed .arm-right-lower{
    transform:
        rotate(5deg);
}


/* =========================
   ★ 缩小后的两个爪尖
========================= */

.tip-left{
    position:absolute;

    left:1px;
    top:65px;

    width:17px;
    height:8px;

    border-radius:
        3px
        8px
        8px
        3px;

    background:
        linear-gradient(
            to bottom,
            #c78ad4,
            #9660aa
        );

    transform:
        rotate(-18deg);

    transition:
        transform .35s ease;

    box-shadow:
        0 2px 3px rgba(90,57,108,.18);
}


.tip-right{
    position:absolute;

    right:1px;
    top:65px;

    width:17px;
    height:8px;

    border-radius:
        8px
        3px
        3px
        8px;

    background:
        linear-gradient(
            to bottom,
            #c78ad4,
            #9660aa
        );

    transform:
        rotate(18deg);

    transition:
        transform .35s ease;

    box-shadow:
        0 2px 3px rgba(90,57,108,.18);
}


/* 闭合时两个爪尖向中间 */

.claw-anchor.closed .tip-left{
    transform:
        rotate(8deg);
}


.claw-anchor.closed .tip-right{
    transform:
        rotate(-8deg);
}


/* =========================
   奖品区域
========================= */

.prize-area{
    position:absolute;

    left:35px;
    right:35px;

    top:235px;
    bottom:74px;

    display:flex;

    align-items:flex-end;
    justify-content:center;

    gap:12px;

    flex-wrap:wrap;

    padding:10px 12px;

    z-index:3;
}


.prize{
    position:relative;

    width:92px;
    height:92px;

    display:flex;
    align-items:center;
    justify-content:center;

    animation:
        prizeFloat 2.5s ease-in-out infinite;

    animation-delay:
        calc(var(--i) * -.3s);
}


.prize img{
    display:block;

    max-width:92px;
    max-height:92px;

    width:auto;
    height:auto;

    object-fit:contain;

    border-radius:8px;

    filter:
        drop-shadow(
            0 5px 5px rgba(103,70,95,.18)
        );
}


@keyframes prizeFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-5px);
    }
}


/* =========================
   掉落出口
========================= */

.exit{
    position:absolute;

    left:50%;
    bottom:17px;

    transform:translateX(-50%);

    width:180px;
    height:43px;

    border-radius:
        18px
        18px
        25px
        25px;

    background:
        linear-gradient(
            to bottom,
            #bd83bc,
            #96629c
        );

    border:4px solid #805486;

    box-shadow:
        inset 0 4px 5px rgba(255,255,255,.25),
        0 5px 10px rgba(108,67,105,.18);

    z-index:4;
}


.exit::before{
    content:"";

    position:absolute;

    left:50%;
    top:7px;

    transform:translateX(-50%);

    width:120px;
    height:19px;

    border-radius:999px;

    background:#765071;
}


/* =========================
   控制区
========================= */

.controls{
    margin-top:18px;

    display:flex;

    justify-content:center;
    align-items:center;

    gap:12px;

    flex-wrap:wrap;
}


.control-btn{
    min-width:100px;

    border:none;

    padding:12px 20px;

    border-radius:999px;

    background:#fff;

    color:#8c6595;

    font-size:15px;
    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 5px 15px rgba(115,77,119,.13);

    transition:
        transform .15s ease,
        box-shadow .15s ease,
        background .15s ease;
}


.control-btn:hover{
    transform:translateY(-2px);

    box-shadow:
        0 8px 18px rgba(115,77,119,.18);
}


.control-btn:active{
    transform:translateY(1px);
}


.grab-btn{
    padding:14px 34px;

    background:
        linear-gradient(
            135deg,
            #c792d6,
            #a66bbb
        );

    color:#fff;

    font-size:16px;

    box-shadow:
        0 7px 18px rgba(136,89,151,.25);
}


.grab-btn:hover{
    background:
        linear-gradient(
            135deg,
            #b983c9,
            #965eac
        );
}


/* =========================
   上传区
========================= */

.panel{
    margin-top:18px;

    padding:20px;

    border-radius:22px;

    background:rgba(255,255,255,.75);

    box-shadow:
        0 10px 25px rgba(110,76,115,.09);

    border:2px solid rgba(255,255,255,.8);
}


.panel-title{
    text-align:center;

    color:#90659d;

    font-weight:bold;

    margin-bottom:14px;
}


.upload-row{
    display:flex;

    justify-content:center;

    align-items:center;

    gap:10px;

    flex-wrap:wrap;
}


.upload-label{
    display:inline-flex;

    align-items:center;
    justify-content:center;

    padding:11px 18px;

    border-radius:999px;

    background:#f4e5f8;

    color:#8b6195;

    cursor:pointer;

    font-weight:bold;
}


.upload-label:hover{
    background:#edd9f3;
}


#fileInput{
    display:none;
}


.small-btn{
    border:none;

    padding:10px 16px;

    border-radius:999px;

    background:#fff;

    color:#956d9b;

    cursor:pointer;

    font-weight:bold;
}


.small-btn:hover{
    background:#faf1fc;
}


/* =========================
   提示
========================= */

.info{
    margin-top:12px;

    text-align:center;

    font-size:12px;

    color:#ad94ad;

    line-height:1.7;
}


/* =========================
   结果弹窗
========================= */

.modal{
    position:fixed;

    inset:0;

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:
        rgba(100,70,105,.35);

    backdrop-filter:
        blur(6px);

    z-index:100;
}


.modal.show{
    display:flex;
}


.modal-box{
    width:min(360px,100%);

    padding:28px 22px;

    text-align:center;

    border-radius:28px;

    background:
        linear-gradient(
            145deg,
            #fff,
            #fff5fc
        );

    box-shadow:
        0 20px 50px rgba(70,43,73,.25);

    animation:
        modalIn .35s ease;
}


@keyframes modalIn{

    from{
        opacity:0;
        transform:scale(.85) translateY(20px);
    }

    to{
        opacity:1;
        transform:scale(1) translateY(0);
    }
}


.success-icon{
    width:72px;
    height:72px;

    margin:0 auto 12px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #f7c7e5,
            #dcb8f1
        );

    font-size:38px;

    box-shadow:
        0 8px 20px rgba(158,100,166,.2);
}


.modal-box h2{
    margin:6px 0;

    color:#93609f;
}


.modal-box p{
    margin:8px 0 20px;

    color:#a68ca5;

    font-size:14px;
}


.modal-prize{
    max-width:180px;
    max-height:180px;

    object-fit:contain;

    border-radius:10px;

    margin-bottom:15px;

    filter:
        drop-shadow(
            0 7px 8px rgba(103,70,95,.2)
        );
}


.modal-close{
    border:none;

    padding:11px 25px;

    border-radius:999px;

    background:#b984ca;

    color:#fff;

    font-weight:bold;

    cursor:pointer;
}


/* =========================
   手机适配
========================= */

@media(max-width:600px){

    body{
        padding:15px 9px 30px;
    }

    .header h1{
        font-size:24px;
    }

    .machine{
        height:520px;

        border-width:5px;
    }

    .rail{
        left:25px;
        right:25px;
    }

    .prize-area{
        left:20px;
        right:20px;
        top:230px;
        bottom:70px;

        gap:7px;
    }

    .prize{
        width:75px;
        height:75px;
    }

    .prize img{
        max-width:75px;
        max-height:75px;
    }

    .exit{
        width:150px;
    }

    .control-btn{
        min-width:88px;
        padding:11px 15px;
    }

    .grab-btn{
        order:-1;

        width:100%;
    }

}

</style>
</head>


<body>

<div class="page">

    <!-- =========================
         标题
    ========================== -->

    <header class="header">

        <h1>🧸 我的小小娃娃机 ♡</h1>

        <p>
            上传你喜欢的图片，开始抓取吧 ✦
        </p>

    </header>


    <!-- =========================
         娃娃机
    ========================== -->

    <div class="machine" id="machine">

        <div class="machine-title">
            ✦ MY CLAW MACHINE ✦
        </div>


        <!-- 横轨 -->

        <div class="rail"></div>


        <!-- =========================
             整个吊钩横向组件
        ========================== -->

        <div class="crane" id="crane">

            <!-- 紫色滑块 -->

            <div class="crane-head"></div>


            <!-- 固定绳索 -->

            <div class="cable"></div>


            <!-- =========================
                 爪子固定连接点
            ========================== -->

            <div
                class="claw-anchor"
                id="clawAnchor"
            >

                <div class="claw-neck"></div>


                <!-- 爪子本体 -->

                <div class="claw-body">

                    <div class="claw-core"></div>


                    <!-- 左边上半部分 -->

                    <div class="arm-left-upper"></div>


                    <!-- 右边上半部分 -->

                    <div class="arm-right-upper"></div>


                    <!-- 左边下半部分 -->

                    <div class="arm-left-lower"></div>


                    <!-- 右边下半部分 -->

                    <div class="arm-right-lower"></div>


                    <!-- 左爪尖 -->

                    <div class="tip-left"></div>


                    <!-- 右爪尖 -->

                    <div class="tip-right"></div>

                </div>

            </div>

        </div>


        <!-- =========================
             奖品区域
        ========================== -->

        <div
            class="prize-area"
            id="prizeArea"
        ></div>


        <!-- 出口 -->

        <div class="exit"></div>

    </div>


    <!-- =========================
         控制按钮
    ========================== -->

    <div class="controls">

        <button
            class="control-btn"
            onclick="move(-1)"
        >
            ◀ 左移
        </button>


        <button
            class="control-btn grab-btn"
            id="grabButton"
            onclick="grab()"
        >
            ✨ 抓取！
        </button>


        <button
            class="control-btn"
            onclick="move(1)"
        >
            右移 ▶
        </button>

    </div>


    <!-- =========================
         上传
    ========================== -->

    <div class="panel">

        <div class="panel-title">
            ♡ 放入你的专属奖品 ♡
        </div>


        <div class="upload-row">

            <label
                class="upload-label"
                for="fileInput"
            >
                ＋ 上传图片
            </label>

            <input
                id="fileInput"
                type="file"
                accept="image/png,image/jpeg,image/webp"
                multiple
            >


            <button
                class="small-btn"
                onclick="randomPrizes()"
            >
                🎲 随机摆放
            </button>


            <button
                class="small-btn"
                onclick="clearPrizes()"
            >
                🗑 清空
            </button>

        </div>


        <div class="info">
            可以一次上传多张图片 ♡<br>
            图片会保持原本的比例，不会被裁成圆形。
        </div>

    </div>

</div>


<!-- =========================
     抓取结果弹窗
========================= -->

<div
    class="modal"
    id="resultModal"
>

    <div class="modal-box">

        <div class="success-icon">
            🎉
        </div>

        <h2>
            抓取成功！
        </h2>

        <p>
            恭喜你获得了这个小可爱 ♡
        </p>

        <img
            class="modal-prize"
            id="modalPrize"
            src=""
            alt="抓取成功的奖品"
        >

        <br>

        <button
            class="modal-close"
            onclick="closeModal()"
        >
            收下它 ♡
        </button>

    </div>

</div>


<script>

/* =====================================================
   数据
===================================================== */

let prizes = [];

let position = 50;

let busy = false;


/* =====================================================
   获取元素
===================================================== */

const crane =
    document.getElementById("crane");

const clawAnchor =
    document.getElementById("clawAnchor");

const prizeArea =
    document.getElementById("prizeArea");

const fileInput =
    document.getElementById("fileInput");

const grabButton =
    document.getElementById("grabButton");

const resultModal =
    document.getElementById("resultModal");

const modalPrize =
    document.getElementById("modalPrize");


/* =====================================================
   左右移动
===================================================== */

function move(direction){

    if(busy){
        return;
    }

    position += direction * 9;

    position =
        Math.max(
            9,
            Math.min(
                91,
                position
            )
        );

    crane.style.left =
        position + "%";
}


/* =====================================================
   键盘操作
===================================================== */

document.addEventListener(
    "keydown",
    function(event){

        if(event.key === "ArrowLeft"){
            move(-1);
        }

        if(event.key === "ArrowRight"){
            move(1);
        }

        if(
            event.key === " " ||
            event.key === "Enter"
        ){
            event.preventDefault();

            grab();
        }

    }
);


/* =====================================================
   抓取
===================================================== */

function grab(){

    if(busy){
        return;
    }

    if(prizes.length === 0){

        alert(
            "先上传一些喜欢的图片吧 ♡"
        );

        return;
    }


    busy = true;

    grabButton.disabled = true;


    /*
       第一步：
       爪子保持打开
    */

    clawAnchor.classList.remove(
        "closed"
    );


    /*
       第二步：
       只有爪子本体下降
    */

    setTimeout(
        function(){

            clawAnchor.classList.add(
                "grabbing"
            );

        },
        100
    );


    /*
       第三步：
       爪子闭合
    */

    setTimeout(
        function(){

            clawAnchor.classList.add(
                "closed"
            );

        },
        650
    );


    /*
       第四步：
       判断抓取
    */

    setTimeout(
        function(){

            const success =
                Math.random() < 0.75;

            if(success){

                const index =
                    Math.floor(
                        Math.random() *
                        prizes.length
                    );

                const caught =
                    prizes[index];


                prizes.splice(
                    index,
                    1
                );

                renderPrizes();


                modalPrize.src =
                    caught.src;

                resultModal.classList.add(
                    "show"
                );

            }
            else{

                clawAnchor.classList.remove(
                    "closed"
                );

            }

        },
        1050
    );


    /*
       第五步：
       爪子回到原来的位置
    */

    setTimeout(
        function(){

            clawAnchor.classList.remove(
                "grabbing"
            );

        },
        1350
    );


    /*
       最后恢复
    */

    setTimeout(
        function(){

            clawAnchor.classList.remove(
                "closed"
            );

            busy = false;

            grabButton.disabled =
                false;

        },
        1900
    );
}


/* =====================================================
   上传图片
===================================================== */

fileInput.addEventListener(
    "change",
    function(event){

        const files =
            Array.from(
                event.target.files
            );


        files.forEach(
            function(file){

                if(
                    !file.type.startsWith(
                        "image/"
                    )
                ){
                    return;
                }


                const reader =
                    new FileReader();


                reader.onload =
                    function(e){

                        prizes.push({

                            src:e.target.result,

                            id:
                                Date.now() +
                                Math.random()

                        });

                        renderPrizes();

                    };


                reader.readAsDataURL(
                    file
                );

            }
        );


        fileInput.value = "";
    }
);


/* =====================================================
   显示奖品
===================================================== */

function renderPrizes(){

    prizeArea.innerHTML = "";


    prizes.forEach(
        function(prize,index){

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "prize";

            item.style.setProperty(
                "--i",
                index
            );


            const img =
                document.createElement(
                    "img"
                );

            img.src =
                prize.src;

            img.alt =
                "奖品";


            item.appendChild(
                img
            );


            prizeArea.appendChild(
                item
            );

        }
    );
}


/* =====================================================
   随机摆放
===================================================== */

function randomPrizes(){

    if(prizes.length === 0){

        alert(
            "还没有奖品哦，先上传一些图片吧 ♡"
        );

        return;
    }


    for(
        let i = prizes.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            prizes[i],
            prizes[j]
        ] =
        [
            prizes[j],
            prizes[i]
        ];

    }


    renderPrizes();
}


/* =====================================================
   清空奖品
===================================================== */

function clearPrizes(){

    if(busy){
        return;
    }


    prizes = [];

    renderPrizes();
}


/* =====================================================
   关闭结果
===================================================== */

function closeModal(){

    resultModal.classList.remove(
        "show"
    );
}


/* 点击背景关闭 */

resultModal.addEventListener(
    "click",
    function(event){

        if(
            event.target ===
            resultModal
        ){

            closeModal();

        }

    }
);


/* =====================================================
   初始
===================================================== */

renderPrizes();

</script>
