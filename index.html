<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的小小娃娃机 ♡</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #fff4f8, #f5efff);
    font-family: Arial, "Noto Sans SC", sans-serif;
    color: #67536d;
}

header {
    text-align: center;
    padding: 25px 15px 12px;
}

h1 {
    margin: 0;
    font-size: 28px;
    color: #9b6fa8;
}

.subtitle {
    margin-top: 7px;
    font-size: 13px;
    color: #aa94b1;
}

.container {
    width: min(94%, 520px);
    margin: auto;
}

/* 娃娃机 */
.machine {
    position: relative;
    height: 560px;
    overflow: hidden;
    border: 8px solid #d29abb;
    border-radius: 30px;
    background:
        linear-gradient(
            to bottom,
            #dff7ff 0%,
            #f3fbff 67%,
            #d7a779 67%,
            #c18c61 100%
        );
    box-shadow:
        0 15px 35px rgba(120, 90, 130, .18),
        inset 0 0 30px rgba(255,255,255,.6);
}

/* 顶部装饰 */
.machine-title {
    position: absolute;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,.8);
    padding: 8px 24px;
    border-radius: 20px;
    color: #a06da0;
    font-weight: bold;
    z-index: 10;
    white-space: nowrap;
}

.light {
    position: absolute;
    top: 4px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 12px #fff;
}

.light:nth-child(1){left:25px}
.light:nth-child(2){left:55px}
.light:nth-child(3){right:55px}
.light:nth-child(4){right:25px}

/* 横向轨道 */
.rail {
    position: absolute;
    top: 78px;
    left: 6%;
    width: 88%;
    height: 10px;
    border-radius: 10px;
    background: #a984b4;
}

/* 爪子 */
.crane {
    position: absolute;
    top: 77px;
    left: 50%;
    width: 70px;
    height: 180px;
    transform: translateX(-50%);
    transition: left .35s ease;
    z-index: 8;
}

.crane-head {
    width: 42px;
    height: 30px;
    margin: auto;
    background: #b88bc2;
    border-radius: 10px 10px 6px 6px;
    box-shadow: 0 3px 4px rgba(80,50,80,.2);
}

.cable {
    width: 4px;
    height: 85px;
    margin: auto;
    background: #555;
}

.claw {
    position: relative;
    width: 48px;
    height: 42px;
    margin: auto;
}

.claw:before,
.claw:after {
    content: "";
    position: absolute;
    top: 0;
    width: 8px;
    height: 38px;
    border: 4px solid #555;
    border-top: 0;
    border-radius: 0 0 15px 15px;
}

.claw:before {
    left: 5px;
    transform: rotate(22deg);
}

.claw:after {
    right: 5px;
    transform: rotate(-22deg);
}

/* 奖品区域 */
.prizes {
    position: absolute;
    left: 7%;
    right: 7%;
    bottom: 14%;
    height: 52%;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: center;
    gap: 8px;
}

.prize {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    overflow: hidden;
    background: white;
    border: 4px solid white;
    box-shadow: 0 5px 10px rgba(80,50,80,.2);
    animation: float 2.5s ease-in-out infinite;
}

.prize:nth-child(2n) {
    animation-delay: .5s;
}

.prize:nth-child(3n) {
    animation-delay: 1s;
}

.prize img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

@keyframes float {
    50% {
        transform: translateY(-3px);
    }
}

/* 出奖口 */
.exit {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 145px;
    height: 55px;
    border-radius: 15px 15px 5px 5px;
    background: #725d76;
    border: 5px solid #aa8bb0;
    color: white;
    text-align: center;
    padding-top: 13px;
    font-weight: bold;
}

/* 控制按钮 */
.controls {
    display: grid;
    grid-template-columns: 1fr 1.2fr 1fr;
    gap: 9px;
    margin-top: 14px;
}

button,
.upload {
    border: none;
    border-radius: 15px;
    padding: 13px 8px;
    font-size: 15px;
    font-weight: bold;
    color: white;
    background: #ad83b9;
    box-shadow: 0 4px 8px rgba(100,70,110,.15);
    cursor: pointer;
    text-align: center;
}

button:active,
.upload:active {
    transform: scale(.96);
}

.grab {
    background: #df8fac;
}

.upload {
    background: #91a7c9;
}

input {
    display: none;
}

/* 下方区域 */
.info {
    margin-top: 12px;
    padding: 13px;
    background: rgba(255,255,255,.75);
    border-radius: 15px;
    text-align: center;
    font-size: 14px;
}

.result {
    display: none;
    margin-top: 15px;
    padding: 20px;
    background: white;
    border-radius: 22px;
    text-align: center;
    box-shadow: 0 8px 25px rgba(100,70,110,.12);
}

.result.show {
    display: block;
}

.result-title {
    font-size: 21px;
    font-weight: bold;
    color: #d27f9d;
}

.result img {
    display: block;
    width: 160px;
    height: 160px;
    object-fit: cover;
    border-radius: 25px;
    margin: 15px auto;
}

.empty {
    color: #aa94b1;
    font-size: 14px;
    text-align: center;
    padding-top: 130px;
}
</style>
</head>

<body>

<header>
    <h1>🧸 我的小小娃娃机 ♡</h1>
    <div class="subtitle">上传你喜欢的图片，开始抓取吧 ✦</div>
</header>

<div class="container">

    <div class="machine">

        <div class="light"></div>
        <div class="light"></div>
        <div class="light"></div>
        <div class="light"></div>

        <div class="machine-title">
            ✦ MY CLAW MACHINE ✦
        </div>

        <div class="rail"></div>

        <div class="crane" id="crane">
            <div class="crane-head"></div>
            <div class="cable"></div>
            <div class="claw"></div>
        </div>

        <div class="prizes" id="prizes">
            <div class="empty" id="empty">
                还没有奖品 ♡<br>
                请先上传图片
            </div>
        </div>

        <div class="exit">
            🎁 出奖口
        </div>

    </div>

    <div class="controls">
        <button onclick="move(-1)">← 左</button>

        <button class="grab" onclick="grab()">
            🪝 抓取
        </button>

        <button onclick="move(1)">右 →</button>

        <label class="upload">
            ＋ 上传图片
            <input
                type="file"
                id="upload"
                accept="image/*"
                multiple
            >
        </label>

        <button onclick="newGame()">
            🔀 重新摆放
        </button>

        <button onclick="clearPrizes()">
            🗑 清空
        </button>
    </div>

    <div class="info">
        当前奖品：<b id="count">0</b> 个
    </div>

    <div class="result" id="result">
        <div class="result-title" id="resultTitle">
            🎉 抓到了！
        </div>

        <img id="resultImg">

        <div id="resultText"></div>

        <button
            style="margin-top:12px"
            onclick="closeResult()"
        >
            再抓一次 ♡
        </button>
    </div>

</div>

<script>

let prizes = [];
let position = 50;
let busy = false;

const crane = document.getElementById("crane");
const prizeBox = document.getElementById("prizes");
const count = document.getElementById("count");
const upload = document.getElementById("upload");

upload.addEventListener("change", function(e) {

    const files = [...e.target.files];

    files.forEach(file => {

        const reader = new FileReader();

        reader.onload = function(event) {

            prizes.push({
                image: event.target.result,
                name: file.name
            });

            renderPrizes();

        };

        reader.readAsDataURL(file);

    });

    upload.value = "";

});


function renderPrizes() {

    prizeBox.innerHTML = "";

    if (prizes.length === 0) {

        prizeBox.innerHTML = `
            <div class="empty">
                还没有奖品 ♡<br>
                请先上传图片
            </div>
        `;

    } else {

        prizes.forEach((prize, index) => {

            const div = document.createElement("div");

            div.className = "prize";

            div.innerHTML = `
                <img src="${prize.image}">
            `;

            prizeBox.appendChild(div);

        });

    }

    count.textContent = prizes.length;

}


function move(direction) {

    if (busy) return;

    position += direction * 10;

    if (position < 12) position = 12;
    if (position > 88) position = 88;

    crane.style.left = position + "%";

}


function grab() {

    if (busy) return;

    if (prizes.length === 0) {

        alert("请先上传一些图片作为奖品 ♡");

        return;

    }

    busy = true;

    const oldTop = crane.style.top;

    crane.style.transition = "top .45s ease";
    crane.style.top = "240px";

    setTimeout(() => {

        crane.style.top = "77px";

    }, 650);

    setTimeout(() => {

        const success = Math.random() < 0.65;

        if (success) {

            const index =
                Math.floor(Math.random() * prizes.length);

            const prize = prizes[index];

            showResult(prize);

            prizes.splice(index, 1);

            renderPrizes();

        } else {

            showFail();

        }

        busy = false;

    }, 1150);

}


function showResult(prize) {

    const result =
        document.getElementById("result");

    const img =
        document.getElementById("resultImg");

    const title =
        document.getElementById("resultTitle");

    const text =
        document.getElementById("resultText");

    title.textContent = "🎉 抓到了！";

    img.src = prize.image;

    img.style.display = "block";

    text.textContent =
        "恭喜你获得了这个奖品 ♡";

    result.classList.add("show");

}


function showFail() {

    const result =
        document.getElementById("result");

    const img =
        document.getElementById("resultImg");

    const title =
        document.getElementById("resultTitle");

    const text =
        document.getElementById("resultText");

    title.textContent = "💦 差一点！";

    img.style.display = "none";

    text.textContent =
        "这次没有抓到，再试一次吧 ♡";

    result.classList.add("show");

}


function closeResult() {

    document
        .getElementById("result")
        .classList.remove("show");

}


function newGame() {

    prizes.sort(() => Math.random() - 0.5);

    renderPrizes();

    position =
        20 + Math.random() * 60;

    crane.style.left =
        position + "%";

}


function clearPrizes() {

    if (!confirm("确定要清空所有奖品吗？")) {
        return;
    }

    prizes = [];

    renderPrizes();

}


renderPrizes();

</script>

</body>
</html>
